// Agendar Sessão de Ginásio — atalho rápido (Data/Hora/Local/Equipa/Ficha) a partir de
// Fichas de Ginásio, para não obrigar a passar pelo formulário completo do Planeamento
// (SPS-Ginásio, pedido do Roger "agendar, data, hora, local" — ver
// project_sps_ginasio_app_standalone). Cria o mesmo formato de evento que saveEvent()
// (ver Planeamento), só que com um formulário mais curto focado no essencial.
function _ginasioQuickScheduleModal(){
  const teamSel=APP.teams.map(t=>`<option value="${t.id}">${escHtml(t.name)}</option>`).join('');
  const sheets=(APP.gymSheets||[]).slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  const sheetSel=`<option value="">— Sem ficha (definir depois) —</option>`+sheets.map(f=>`<option value="${f.id}">${escHtml(f.title||'Ficha sem título')}</option>`).join('');
  openMod('🗓️ Agendar Sessão de Ginásio',`
  <div class="fr3"><div class="form-g"><label class="fl">Data *</label><input class="fc" id="gq-date" type="date" value="${today()}"></div>
  <div class="form-g"><label class="fl">Hora</label><input class="fc" id="gq-time" type="time" value="18:00"></div>
  <div class="form-g"><label class="fl">Local</label><input class="fc" id="gq-loc" placeholder="Ginásio..."></div></div>
  <div class="fr"><div class="form-g"><label class="fl">Equipa</label><select class="fc" id="gq-team">${teamSel}</select></div>
  <div class="form-g"><label class="fl">Ficha de Ginásio</label><select class="fc" id="gq-sheet">${sheetSel}</select></div></div>
  <div style="display:flex;gap:8px;margin-top:6px">
    <button class="btn btn-g" onclick="_saveGinasioQuickSchedule()">💾 Agendar</button>
    <button class="btn btn-gh" onclick="closeMod()">Cancelar</button>
  </div>`,'lg');
}
async function _saveGinasioQuickSchedule(){
  const date=document.getElementById('gq-date').value;
  if(!date)return toast('Data obrigatória','err');
  const sheetId=document.getElementById('gq-sheet').value;
  const sheet=sheetId?(APP.gymSheets||[]).find(f=>f.id===sheetId):null;
  const ev={id:uid(),teamId:document.getElementById('gq-team').value,type:'Ginásio',title:'Ginásio',date,time:document.getElementById('gq-time').value,dur:null,location:document.getElementById('gq-loc').value.trim(),notes:'',horaConcentracao:'',localConcentracao:'',guestIds:[],gymSheet:sheet?JSON.parse(JSON.stringify(sheet)):null};
  if(!APP.schedule)APP.schedule=[];
  APP.schedule.push(ev);
  if(_sync)await cloudUpsert('schedule_events',{...ev,club_id:_cid});
  saveData();
  closeMod();
  toast('Sessão de Ginásio agendada ✓');
  renderFichasGinasio();
}
// ─── REGISTOS DE GINÁSIO (Fase 2) ──────────────────────────
// Grelha de registo de uma sessão de Ginásio concreta: uma linha por atleta
// da equipa do evento (+ convocadas avulso, mesmo padrão de guestIds já usado
// no resto do Planeamento), colunas = cada exercício da ficha importada
// (carga×reps em texto livre, como no papel) + RIR geral + Observações
// (partilhados pela sessão toda, não por exercício — replica a "Tabela geral
// de registo" do documento original do Roger). Aberta a partir de 2 sítios:
// botão "Registar Sessão" no editor do evento (Planeamento) e a partir da
// aba "Registos" em Fichas de Ginásio — ambos chamam openGymSessionGrid(id).
// _gymGridData é um rascunho em memória (não grava a cada tecla); só grava
// tudo de uma vez ao clicar "Guardar Registos", mesmo espírito do _gsDraft
// nas Fichas. Ver project_sps_fichas_ginasio_fase2.
let _gymGridEventId=null, _gymGridData={}, _gymAccOpen=null;
function _gymGridAthletes(ev){
  return APP.athletes.filter(a=>a.teamId===ev.teamId||(ev.guestIds||[]).includes(a.id)).sort((a,b)=>_shortName(a).localeCompare(_shortName(b)));
}
function openGymSessionGrid(eventId){
  const ev=APP.schedule.find(e=>e.id===eventId);
  if(!ev||!ev.gymSheet){toast('Esta sessão não tem ficha importada','err');return;}
  _gymGridEventId=eventId;
  _gymGridData={};
  _gymAccOpen=null;
  _gymGridAthletes(ev).forEach(a=>{
    const rec=(APP.gymRecords||[]).find(r=>r.eventId===eventId&&r.athleteId===a.id);
    _gymGridData[a.id]={vals:rec&&rec.vals?[...rec.vals]:[],rirGeral:(rec&&rec.rirGeral)||'',obs:(rec&&rec.obs)||''};
  });
  renderGymSessionGrid();
}
// Registo responsivo (SPS-Ginásio, pedido do Roger — "abre no telemóvel/tablet a folha de
// registos"): tabela larga (como no papel) em tablet/desktop, onde cabe bem; acordeão por
// atleta em telemóvel, onde uma tabela com N colunas de exercícios fica ilegível/minúscula.
// Mesmo _gymGridData/_gymCellInput/saveGymRecords por trás dos dois — só muda o HTML gerado.
// Ver project_sps_ginasio_app_standalone.
function renderGymSessionGrid(){
  const ev=APP.schedule.find(e=>e.id===_gymGridEventId);
  if(!ev||!ev.gymSheet){closeMod();return;}
  const gs=ev.gymSheet;
  const athletes=_gymGridAthletes(ev);
  const isMobile=window.innerWidth<640;
  const bodyHtml=isMobile?_gymGridAccordionHtml(gs,athletes):_gymGridTableHtml(gs,athletes);
  openMod(`📋 Registar Sessão — ${escHtml(gs.title||'Ficha')} (${fmtDate(ev.date)})`,`
  ${bodyHtml}
  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn btn-g" onclick="saveGymRecords()">💾 Guardar Registos</button>
    <button class="btn btn-gh" onclick="exportGymSessionPDFFromGrid()">🖨️ Exportar PDF</button>
    <button class="btn btn-gh" onclick="closeMod()">Fechar</button>
  </div>`,'xl');
}
function _gymGridTableHtml(gs,athletes){
  const headHtml=gs.exercises.map(ex=>`<th style="padding:6px 8px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--brd)">${escHtml(ex.name)}<div style="font-weight:400;font-size:9.5px;color:var(--t2)">${escHtml(ex.reps||'')}${ex.rir?' · RIR '+escHtml(ex.rir):''}</div></th>`).join('');
  const rowsHtml=athletes.length?athletes.map(a=>{
    const d=_gymGridData[a.id]||{vals:[],rirGeral:'',obs:''};
    const exCells=gs.exercises.map((ex,i)=>`<td style="padding:3px 6px"><input class="fc" style="width:100px;font-size:11px;padding:5px 7px" value="${escHtml(d.vals[i]||'')}" placeholder="kg × reps" data-ath="${a.id}" data-ex="${i}" oninput="_gymCellInput(this)"></td>`).join('');
    return `<tr>
      <td style="padding:6px 8px;font-weight:700;white-space:nowrap;border-bottom:1px solid var(--brd)">${escHtml(_shortName(a))}</td>
      ${exCells}
      <td style="padding:3px 6px"><input class="fc" style="width:50px;font-size:11px;padding:5px 7px" value="${escHtml(d.rirGeral||'')}" placeholder="RIR" data-ath="${a.id}" data-f="rirGeral" oninput="_gymCellInput(this)"></td>
      <td style="padding:3px 6px"><input class="fc" style="width:160px;font-size:11px;padding:5px 7px" value="${escHtml(d.obs||'')}" placeholder="Observações" data-ath="${a.id}" data-f="obs" oninput="_gymCellInput(this)"></td>
    </tr>`;
  }).join(''):`<tr><td colspan="99" style="padding:16px;text-align:center;color:var(--t2)">Sem atletas nesta equipa.</td></tr>`;
  return `<div style="overflow-x:auto;max-height:60vh">
  <table style="border-collapse:collapse;width:100%">
    <thead><tr>
      <th style="padding:6px 8px;text-align:left;border-bottom:1px solid var(--brd)">Atleta</th>
      ${headHtml}
      <th style="padding:6px 8px;text-align:left;border-bottom:1px solid var(--brd);white-space:nowrap">RIR geral</th>
      <th style="padding:6px 8px;text-align:left;border-bottom:1px solid var(--brd)">Observações</th>
    </tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table>
  </div>`;
}
function _gymToggleAcc(athId){
  _gymAccOpen=_gymAccOpen===athId?null:athId;
  renderGymSessionGrid();
}
function _gymGridAccordionHtml(gs,athletes){
  if(!athletes.length)return `<div class="empty"><div class="ei">🏋️‍♀️</div><p>Sem atletas nesta equipa.</p></div>`;
  return `<div style="max-height:65vh;overflow-y:auto">`+athletes.map(a=>{
    const d=_gymGridData[a.id]||{vals:[],rirGeral:'',obs:''};
    const filled=d.vals.filter(v=>v&&String(v).trim()).length;
    const open=_gymAccOpen===a.id;
    const exRows=gs.exercises.map((ex,i)=>`
      <div class="form-g" style="margin-bottom:8px">
        <label class="fl">${escHtml(ex.name)}${ex.reps?` <span style="font-weight:400;color:var(--t2)">(${escHtml(ex.reps)}${ex.rir?' · RIR '+escHtml(ex.rir):''})</span>`:''}</label>
        <input class="fc" value="${escHtml(d.vals[i]||'')}" placeholder="kg × reps" data-ath="${a.id}" data-ex="${i}" oninput="_gymCellInput(this)">
      </div>`).join('');
    return `<div class="card" style="padding:0;overflow:hidden;margin-bottom:8px">
      <div style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="_gymToggleAcc('${a.id}')">
        <div><div style="font-weight:700;font-size:13px">${escHtml(_shortName(a))}</div>
        <div style="font-size:11px;color:var(--t2)">${filled}/${gs.exercises.length} preenchido${filled!==1?'s':''}</div></div>
        <span style="font-size:16px;color:var(--t2)">${open?'▲':'▼'}</span>
      </div>
      ${open?`<div style="border-top:1px solid var(--brd);padding:12px 14px">
        ${exRows}
        <div class="form-g" style="margin-bottom:8px"><label class="fl">RIR geral</label><input class="fc" value="${escHtml(d.rirGeral||'')}" placeholder="RIR" data-ath="${a.id}" data-f="rirGeral" oninput="_gymCellInput(this)"></div>
        <div class="form-g"><label class="fl">Observações</label><input class="fc" value="${escHtml(d.obs||'')}" placeholder="Observações" data-ath="${a.id}" data-f="obs" oninput="_gymCellInput(this)"></div>
      </div>`:''}
    </div>`;
  }).join('')+`</div>`;
}
function _gymCellInput(el){
  const ath=el.getAttribute('data-ath');
  if(!_gymGridData[ath])_gymGridData[ath]={vals:[],rirGeral:'',obs:''};
  const exIdx=el.getAttribute('data-ex');
  const f=el.getAttribute('data-f');
  if(exIdx!==null){_gymGridData[ath].vals[+exIdx]=el.value;}
  else if(f==='rirGeral'){_gymGridData[ath].rirGeral=el.value;}
  else if(f==='obs'){_gymGridData[ath].obs=el.value;}
}
async function saveGymRecords(){
  const ev=APP.schedule.find(e=>e.id===_gymGridEventId);
  if(!ev)return;
  if(!APP.gymRecords)APP.gymRecords=[];
  for(const athleteId in _gymGridData){
    const d=_gymGridData[athleteId];
    const hasData=(d.vals||[]).some(v=>v&&v.trim())||(d.rirGeral&&d.rirGeral.trim())||(d.obs&&d.obs.trim());
    let rec=APP.gymRecords.find(r=>r.eventId===ev.id&&r.athleteId===athleteId);
    if(!hasData){
      if(rec){
        _markDeleted('gymRecords',rec.id);
        APP.gymRecords=APP.gymRecords.filter(r=>r.id!==rec.id);
        if(_sync&&_supa){try{await _supa.from('gym_records').delete().eq('id',rec.id);}catch(err){_warnSyncFailure('gym_records (apagar)',err);}}
      }
      continue;
    }
    if(rec){rec.vals=d.vals;rec.rirGeral=d.rirGeral;rec.obs=d.obs;rec.updatedAt=new Date().toISOString();}
    else{rec={id:uid(),eventId:ev.id,athleteId,vals:d.vals,rirGeral:d.rirGeral,obs:d.obs,updatedAt:new Date().toISOString()};APP.gymRecords.push(rec);}
    if(_sync)await cloudUpsert('gym_records',{...rec,club_id:_cid});
  }
  saveData();
  toast('Registos guardados ✓');
  closeMod();
  const gsPage=document.getElementById('pg-fichas-ginasio');
  if(gsPage&&gsPage.classList.contains('on')&&_gsTab==='registos')renderGymRecordsList();
}

// PDF de uma sessão de Ginásio: A4 paisagem, 3 blocos de exercício por página
// (imagem+identificação+prescrição à esquerda, atletas em grelha compacta à
// direita) + página final com RIR geral/Observações. Uma única função de
// render (_gymSessionPdfHtml) recebe um dataMap {athleteId:{vals,rirGeral,obs}}
// — chamada com dados vazios produz um modelo em branco (para imprimir e
// preencher à mão no ginásio); chamada com APP.gymRecords ou o rascunho ao
// vivo da grelha (_gymGridData) produz o registo preenchido. Dois pontos de
// entrada: exportGymSessionPDF(eventId) (fora da grelha, lê o guardado) e
// exportGymSessionPDFFromGrid() (dentro da grelha aberta, lê o rascunho não
// guardado). Ver project_sps_fichas_ginasio_fase2.
function _gymSessionPdfHtml(ev,dataMap){
  const gs=ev.gymSheet;
  const athletes=_gymGridAthletes(ev);
  const cols=athletes.length>18?6:(athletes.length>10?5:4);
  const exercises=gs.exercises||[];
  const blocksHtml=exercises.length?exercises.map((ex,idx)=>{
    const athCells=athletes.map(a=>{
      const d=dataMap[a.id]||{};
      const v=(d.vals||[])[idx]||'';
      return `<div style="display:flex;justify-content:space-between;gap:4px;border-bottom:1px dotted #ccc;padding:1.5px 0;font-size:7pt;overflow:hidden">
        <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58%">${escHtml(_shortName(a))}</span>
        <span style="color:#1d6f3b;font-weight:700;white-space:nowrap">${v?escHtml(v):'&nbsp;'}</span>
      </div>`;
    }).join('');
    const imgPart=ex.img?`<img src="${ex.img}" style="width:26mm;height:26mm;object-fit:cover;border-radius:4px;flex-shrink:0">`
      :`<div style="width:26mm;height:26mm;border-radius:4px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">🏋️</div>`;
    return `<div style="${idx>0&&idx%3===0?'page-break-before:always;':''}display:flex;gap:10px;border:1px solid #ddd;border-radius:8px;padding:8px;margin-bottom:6mm;height:52mm;page-break-inside:avoid">
      <div style="flex-shrink:0;display:flex;flex-direction:column;gap:4px;width:70mm;overflow:hidden">
        ${imgPart}
        <div style="font-size:9.5pt;font-weight:700;color:#1d6f3b">${escHtml(ex.name)}</div>
        <div style="font-size:7.5pt;color:#666">${escHtml(ex.reps||'')}${ex.rir?' · RIR '+escHtml(ex.rir):''}${ex.equip?' · '+escHtml(ex.equip):''}</div>
        <div style="font-size:7pt;color:#555;line-height:1.3;overflow:hidden">${escHtml(ex.desc||'')}</div>
      </div>
      <div style="flex:1;display:grid;grid-template-columns:repeat(${cols},1fr);gap:2px 8px;align-content:start;overflow:hidden">${athCells||'<div style="color:#bbb;font-size:8pt">Sem atletas nesta equipa.</div>'}</div>
    </div>`;
  }).join(''):'<div style="color:#999;text-align:center;padding:30px">Esta ficha não tem exercícios.</div>';
  const summaryRows=athletes.length?athletes.map(a=>{
    const d=dataMap[a.id]||{};
    return `<tr><td style="padding:5px 8px;border-bottom:1px solid #eee;font-weight:700">${escHtml(_shortName(a))}</td><td style="padding:5px 8px;border-bottom:1px solid #eee">${escHtml(d.rirGeral||'')||'&nbsp;'}</td><td style="padding:5px 8px;border-bottom:1px solid #eee">${escHtml(d.obs||'')||'&nbsp;'}</td></tr>`;
  }).join(''):`<tr><td colspan="3" style="padding:8px;color:#999">Sem atletas nesta equipa.</td></tr>`;
  const summaryHtml=`<div style="page-break-before:always">
    <div style="font-size:11pt;font-weight:700;color:#1d6f3b;margin-bottom:8px">RIR Geral &amp; Observações</div>
    <table style="width:100%;border-collapse:collapse;font-size:9pt">
      <thead><tr><th style="text-align:left;padding:5px 8px;border-bottom:2px solid #1d6f3b">Atleta</th><th style="text-align:left;padding:5px 8px;border-bottom:2px solid #1d6f3b">RIR geral</th><th style="text-align:left;padding:5px 8px;border-bottom:2px solid #1d6f3b">Observações</th></tr></thead>
      <tbody>${summaryRows}</tbody>
    </table>
  </div>`;
  return `<div>${blocksHtml}${summaryHtml}</div>`;
}
function exportGymSessionPDF(eventId){
  const ev=APP.schedule.find(e=>e.id===eventId);
  if(!ev||!ev.gymSheet){toast('Esta sessão não tem ficha importada','err');return;}
  const dataMap={};
  _gymGridAthletes(ev).forEach(a=>{
    const rec=(APP.gymRecords||[]).find(r=>r.eventId===eventId&&r.athleteId===a.id);
    dataMap[a.id]=rec?{vals:rec.vals||[],rirGeral:rec.rirGeral||'',obs:rec.obs||''}:{vals:[],rirGeral:'',obs:''};
  });
  _printWin('Registo de Ginásio — '+(ev.gymSheet.title||'Ficha')+' ('+fmtDate(ev.date)+')',_gymSessionPdfHtml(ev,dataMap),null,false,true);
}
function exportGymSessionPDFFromGrid(){
  const ev=APP.schedule.find(e=>e.id===_gymGridEventId);
  if(!ev||!ev.gymSheet)return;
  _printWin('Registo de Ginásio — '+(ev.gymSheet.title||'Ficha')+' ('+fmtDate(ev.date)+')',_gymSessionPdfHtml(ev,_gymGridData),null,false,true);
}

// ─── TREINOS INDIVIDUALIZADOS ─────────────────────────────
let _tiTeam='T1', _tiAtId=null, _showTiForm=false;
function renderTreinosInd(){
  const athletes=APP.athletes.filter(a=>a.teamId===_tiTeam);
  const formHtml=_showTiForm&&_tiAtId?`
  <div class="ipanel">
    <div class="sh"><div class="sh-t">Nova Ficha — ${APP.athletes.find(a=>a.id===_tiAtId)?.name||''}</div><button class="btn btn-sm btn-gh" onclick="_showTiForm=false;renderTreinosInd()">✕</button></div>

    <div class="form-g"><label class="fl">Tipo</label><select class="fc" id="tf-type"><option>Físico</option><option>Técnico</option><option>Tático</option><option>Mental</option><option>Reabilitação</option><option>Velocidade</option><option>Força</option><option>Resistência</option></select></div></div>
    <div class="fr"><div class="form-g"><label class="fl">Semana</label><input class="fc" id="tf-week" type="date"></div>
    <div class="form-g"><label class="fl">Volume</label><input class="fc" id="tf-vol" placeholder="Ex: 45 min"></div></div>
    <div class="form-g"><label class="fl">Descrição / Exercícios</label><textarea class="fc" id="tf-desc" rows="5" placeholder="Descreve os exercícios, séries, repetições..."></textarea></div>
    <div class="form-g"><label class="fl">Nota para a Atleta</label><input class="fc" id="tf-note" placeholder="Mensagem motivacional ou instrução especial"></div>
    <div style="display:flex;gap:8px"><button class="btn btn-g" onclick="saveTreinoInd()">💾 Guardar</button><button class="btn btn-gh" onclick="_showTiForm=false;renderTreinosInd()">Cancelar</button></div>
  </div>`:'';

  const rows=athletes.sort((a,b)=>a.name.localeCompare(b.name)).map(at=>{
    const plans=APP.trainingPlans.filter(p=>p.athleteId===at.id).sort((a,b)=>b.createdAt?.localeCompare(a.createdAt||''));
    const active=plans.filter(p=>!p.done).length;
    const done=plans.filter(p=>p.done).length;
    return`<tr><td><div style="display:flex;align-items:center;gap:7px" title="${escHtml(at.name)}">${_avHtml(at.name,at.photo,26)}<strong>${escHtml(_shortName(at))}</strong></div></td><td>${at.pos||'—'}</td>
    <td style="text-align:center"><span class="bdg bg-b">${active} ativa${active!==1?'s':''}</span></td>
    <td style="text-align:center"><span class="bdg bg-g">${done} concluída${done!==1?'s':''}</span></td>
    <td><button class="btn btn-xs btn-g" onclick="_tiAtId='${at.id}';_showTiForm=true;renderTreinosInd()">+ Ficha</button>
    <button class="btn btn-xs btn-gh" onclick="viewTreinosAt('${at.id}')">Ver todas</button></td></tr>`;
  }).join('');

  document.getElementById('pg-treinos-ind').innerHTML=`
  <div class="sh"><div class="sh-t">🏋️ Treinos Individualizados</div>
    <select class="fc" style="width:auto;font-size:11px" onchange="_tiTeam=this.value;renderTreinosInd()">${APP.teams.map(t=>`<option value="${t.id}" ${t.id===_tiTeam?'selected':''}>${t.name}</option>`).join('')}</select>
  </div>
  ${formHtml}
  <div class="card"><div class="cb"><div class="tw"><table><thead><tr><th>Atleta</th><th>Posição</th><th>Fichas Ativas</th><th>Concluídas</th><th>Ações</th></tr></thead>
  <tbody>${rows||'<tr><td colspan="5" style="text-align:center;color:var(--t2);padding:20px">Sem atletas</td></tr>'}</tbody></table></div></div></div>`;
}
function saveTreinoInd(){
  const tp={id:uid(),athleteId:_tiAtId,title:document.getElementById('tf-title').value||'Ficha de Treino',type:document.getElementById('tf-type').value,week:document.getElementById('tf-week').value,volume:document.getElementById('tf-vol').value,description:document.getElementById('tf-desc').value,note:document.getElementById('tf-note').value,done:false,createdAt:today()};
  APP.trainingPlans.push(tp);
  if(_sync)cloudUpsert('training_plans',tp);
  saveData();_showTiForm=false;toast('Ficha criada ✓');renderTreinosInd();
}
function viewTreinosAt(aid){
  const at=APP.athletes.find(a=>a.id===aid);
  const plans=APP.trainingPlans.filter(p=>p.athleteId===aid).sort((a,b)=>b.createdAt?.localeCompare(a.createdAt||''));
  openMod(`📋 Fichas — ${at?.name||''}`,`
  ${plans.length?plans.map(p=>`<div class="card" style="margin-bottom:10px;padding:13px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">

// ─── FISIOTERAPIA ─────────────────────────────────────────
// Snapshot do dia (não histórico): usa o wellness reportado HOJE por cada atleta do
// plantel principal (quem não reportou não entra na lista — não há dado para avaliar).
// Reaproveita o mesmo núcleo _riscoCiclo/_cargaWellnessCicloSev usado na Análise da UT,
// só que aqui é "hoje" em vez de "na data da UT" — sinal de atenção operacional, não
// diagnóstico nem previsão de lesão.
function _riscoCicloHojeRows(){
  const dt=today();
  const ats=(APP.athletes||[]).filter(a=>a.teamId==='T1'||!a.teamId);
  return ats.map(at=>{
    const well=(APP.wellness||[]).find(w=>w.athleteId===at.id&&w.date===dt);
    const pse=(APP.pse||[]).find(p=>p.athleteId===at.id&&p.date===dt);
    const inj=(APP.injuries||[]).find(i=>i.athleteId===at.id&&i.status==='ativo');
    const trat=(APP.treatments||[]).find(t=>t.athleteId===at.id&&t.date===dt);
    return {at,well,pse,inj,trat,risco:_riscoCiclo({pse,well,inj,trat})};
  }).filter(r=>r.well);
}
function renderFisioDash(){
  const active=APP.injuries.filter(i=>i.status==='ativo');
  const rehab=APP.injuries.filter(i=>i.status==='reabilitação');
  const alta=APP.injuries.filter(i=>i.status==='alta').length;
  const rows=[...active,...rehab].sort((a,b)=>b.date.localeCompare(a.date)).map(inj=>{
    const at=APP.athletes.find(a=>a.id===inj.athleteId);
    const treats=APP.treatments.filter(t=>t.injuryId===inj.id);
    const lastT=treats.sort((a,b)=>b.date.localeCompare(a.date))[0];
    const daysInj=diffDays(inj.date,today());
    return`<div class="card" style="margin-bottom:10px;padding:14px">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px">
        <div>
          <div style="font-size:13px;font-weight:800">${at?escHtml(_displayName(at)):'?'} <span style="font-size:10px;color:var(--t2)">${at?.pos||''}</span></div>
          <div style="font-size:11px;color:var(--t2)">${inj.type||'—'} · ${inj.diagnosis||'—'} · ${inj.bodyPart||''}</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          ${statusBadge(inj.status)} ${sevBadge(inj.severity)}
          <span style="font-size:10px;color:var(--t2)">${daysInj}d</span>
        </div>
      </div>
      <div class="pbar">${[1,2,3,4,5].map(p=>`<div class="ps ${p<(inj.phase||1)?'done':p===(inj.phase||1)?'now':''}"></div>`).join('')}</div>
      <div style="font-size:10px;color:var(--t2);margin-top:3px">Fase ${inj.phase||1}/5 — ${inj.phaseDesc||'Avaliação inicial'} ${inj.returnDate?'· Retorno: '+fmtDate(inj.returnDate):''}</div>
      ${lastT?`<div style="font-size:11px;color:var(--t2);margin-top:6px">Último tratamento: ${lastT.type} — ${fmtDate(lastT.date)}</div>`:''}
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn btn-xs btn-g" onclick="navTo('fisio-trat');setTratAt('${inj.id}')">+ Tratamento</button>
        <button class="btn btn-xs btn-gh" onclick="updatePhase('${inj.id}')">📈 Fase</button>
        <button class="btn btn-xs btn-gh" onclick="altaMedica('${inj.id}')">✅ Alta</button>
      </div>
    </div>`;
  }).join('');

  const cicloRows=_riscoCicloHojeRows();
  const cicloAlerta=cicloRows.filter(r=>r.risco.lvl&&r.risco.lvl!=='g').sort((a,b)=>{
    const ord={r:0,o:1,y:2};return (ord[a.risco.lvl]??9)-(ord[b.risco.lvl]??9);
  });
  const cicloHtml=`
  <div class="sh"><div class="sh-t">🔄 Risco por Ciclo — Hoje</div><span style="font-size:10px;color:var(--t2)">${cicloRows.length} atleta(s) reportaram wellness hoje</span></div>
  <div style="font-size:11px;color:var(--t2);margin:-6px 0 8px">Sinal de atenção operacional a partir de carga + wellness + impacto do ciclo autorreportado — não é diagnóstico nem previsão de lesão.</div>
  ${cicloAlerta.length?`<div class="card" style="padding:0;overflow:hidden;margin-bottom:14px"><div class="tw"><table><thead><tr><th>Atleta</th><th>Fase</th><th>Impacto</th><th>Wellness</th><th>Risco</th></tr></thead>
  <tbody>${cicloAlerta.map(r=>`<tr>
    <td>${escHtml(_displayName(r.at))}</td>
    <td>${r.well.cycle&&r.well.cycle!=='N/A'?escHtml(r.well.cycle):'—'}</td>
    <td>${r.well.cycleImpact!==undefined&&r.well.cycleImpact!==null?r.well.cycleImpact:'—'}</td>
    <td>${r.well.score}</td>
    <td><span class="bdg bg-${r.risco.lvl}">${r.risco.label}</span></td>
  </tr>`).join('')}</tbody></table></div></div>`
  :`<div class="empty" style="margin-bottom:14px"><div class="ei">✅</div><p>Sem alertas hoje</p><div class="esub">${cicloRows.length?'Todas as atletas que reportaram estão em zona normal':'Ainda ninguém reportou wellness hoje'}</div></div>`}`;

  const cicloRefHtml=`
  <details class="card" style="padding:14px;margin-bottom:14px">
    <summary style="cursor:pointer;font-size:13px;font-weight:800">📚 Referência: Ciclo Menstrual e Capacidades Físicas</summary>
    <div style="font-size:11px;color:var(--t2);margin-top:10px;line-height:1.5">
      <p style="margin-bottom:8px"><strong>Aviso:</strong> as associações abaixo são tendências de <em>grupo</em>, retiradas da literatura geral de ciências do desporto — a variabilidade individual é grande e a evidência tem limitações e inconsistências entre estudos. <strong>Não usar como regra automática</strong> para decidir a carga de uma atleta específica (ex.: "Fase X = maior/menor carga"). A decisão diária deve continuar a basear-se no autorreporte de cada atleta (wellness + impacto do ciclo) e, no futuro, na sua baseline individual — nunca só na fase.</p>
      <p style="margin-bottom:6px"><strong>Menstruação:</strong> sintomatologia muito variável entre atletas (cólicas, fadiga, alterações de sono/humor nalgumas); evidência sobre efeito no desempenho é inconsistente — algumas atletas sem qualquer alteração percebida, outras com quebra de energia. Foco em conforto e gestão sintomática, não em reduzir carga por defeito.</p>
      <p style="margin-bottom:6px"><strong>Folicular:</strong> estrogénio em subida; parte da literatura associa maior tolerância ao treino e recuperação percebida mais rápida nalgumas atletas, mas o efeito é pequeno e nem sempre replicado.</p>
      <p style="margin-bottom:6px"><strong>Ovulação:</strong> pico de estrogénio; existem hipóteses sobre maior risco de lesão ligamentar (ex. LCA) associadas a esta fase, mas a evidência é debatida e não permite prever risco individual — não deve, por si só, condicionar convocação ou volume de treino.</p>
      <p style="margin-bottom:6px"><strong>Lútea:</strong> progesterona elevada; algumas atletas reportam mais fadiga, alteração da temperatura corporal e retenção, com possível impacto percebido no esforço nalguma literatura, sem consenso forte.</p>
      <p style="margin-top:8px;color:var(--t2)">Sempre que existir incerteza científica relevante, ela é sinalizada acima em vez de convertida numa regra fixa.</p>
    </div>
  </details>`;

  document.getElementById('pg-fisio-dash').innerHTML=`
  <div class="kpis">
    <div class="kpi red"><div class="kpi-lbl">Ativas</div><div class="kpi-val" style="color:#f87171">${active.length}</div><div class="kpi-sub">Lesões em curso</div></div>
    <div class="kpi yel"><div class="kpi-lbl">Reabilitação</div><div class="kpi-val" style="color:#fbbf24">${rehab.length}</div><div class="kpi-sub">Em prog. reab.</div></div>
    <div class="kpi grn"><div class="kpi-lbl">Alta</div><div class="kpi-val" style="color:#4ade80">${alta}</div><div class="kpi-sub">Total altas</div></div>
    <div class="kpi"><div class="kpi-lbl">Tratamentos</div><div class="kpi-val">${APP.treatments.length}</div><div class="kpi-sub">Total registados</div></div>
  </div>
  ${cicloHtml}
  ${cicloRefHtml}
  <div class="sh"><div class="sh-t">🩺 Atletas em Acompanhamento</div>
    <button class="btn btn-g" onclick="navTo('fisio-ep')">+ Novo Episódio</button>
  </div>
  ${rows||`<div class="empty"><div class="ei">🏥</div><p>Sem lesões ativas</p><div class="esub">Todas as atletas disponíveis</div></div>`}`;
}

function saveEpisodio(){
  const aid=document.getElementById('epf-at').value;
  const date=document.getElementById('epf-date').value;
  if(!aid||!date)return toast('Atleta e data obrigatórios','err');
  const ep={id:_editEpId||uid(),athleteId:aid,date,type:document.getElementById('epf-type').value,bodyPart:document.getElementById('epf-body').value,diagnosis:document.getElementById('epf-diag').value,severity:document.getElementById('epf-sev').value,returnDate:document.getElementById('epf-ret').value,notes:document.getElementById('epf-notes').value,status:'ativo',phase:1,phaseDesc:'Avaliação inicial',progress:0};
  if(_editEpId){const i=APP.injuries.findIndex(x=>x.id===_editEpId);if(i>=0)APP.injuries[i]={...APP.injuries[i],...ep};}
  else APP.injuries.push(ep);
  if(_sync)cloudUpsert('injuries',APP.injuries.find(x=>x.id===ep.id));
  saveData();_showEpForm=false;_editEpId=null;toast('Episódio registado ✓');renderFisioEp();
}
function editEpisodio(id){_editEpId=id;_showEpForm=true;renderFisioEp();}
function deleteEpisodio(id){if(!confirm('Apagar?'))return;APP.injuries=APP.injuries.filter(i=>i.id!==id);APP.treatments=APP.treatments.filter(t=>t.injuryId!==id);saveData();toast('Apagado');renderFisioEp();}
function altaMedica(id){const i=APP.injuries.find(x=>x.id===id);if(i){i.status='alta';i.phase=5;saveData();toast('Alta médica registada ✓');renderFisioDash();}}
function updatePhase(id){
  const i=APP.injuries.find(x=>x.id===id);if(!i)return;
  const phases=['Avaliação inicial','Controlo da dor','Recuperação funcional','Treino específico','Retorno ao jogo'];
  const next=Math.min((i.phase||1)+1,5);
  i.phase=next;i.phaseDesc=phases[next-1];
  if(next>=4)i.status='reabilitação';
  saveData();toast(`Fase ${next}: ${phases[next-1]}`);renderFisioDash();
}

function saveTratamento(){
  const date=document.getElementById('tr-date').value;
  if(!date)return toast('Data obrigatória','err');
  const inj=APP.injuries.find(i=>i.id===_tratEpId);
  const t={id:uid(),injuryId:_tratEpId,athleteId:inj?.athleteId||null,date,type:document.getElementById('tr-type').value,description:document.getElementById('tr-desc').value,response:document.getElementById('tr-resp').value,professional:document.getElementById('tr-prof').value};
  APP.treatments.push(t);
  if(_sync)cloudUpsert('treatments',t);
  if(t.athleteId)_autoMarkAttendance(t.athleteId,date,'tratamento');

// que a fisio já regista normalmente — não precisa de duplicar/atualizar nada à parte.
function renderFisioAnamnese(){
  const athletes=APP.athletes.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const rows=athletes.map(at=>{
    const an=_getAnamnesis(at.id);
    const filled=!!an.selfReportUpdatedAt;
    const isNew=filled&&(!an.fisioViewedAt||an.selfReportUpdatedAt>an.fisioViewedAt);
    return `<div class="card" style="margin-bottom:8px;padding:12px;cursor:pointer" onclick="openAnamneseDetail('${at.id}')">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px">${_avHtml(at.name,at.photo,26)}<div style="font-size:13px;font-weight:700">${escHtml(_displayName(at))} <span style="font-size:10px;color:var(--t2);font-weight:400">${at.pos||''}${at.num?' · #'+at.num:''}</span></div></div>
        <div style="display:flex;gap:6px">
          ${isNew?'<span class="bdg bg-y">🔔 Atualizado</span>':''}
          <span class="bdg ${filled?'bg-g':'bg-r'}">${filled?'Preenchido':'Por preencher'}</span>
        </div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('pg-fisio-anamnese').innerHTML=`
  <div class="sh"><div class="sh-t">📋 Anamnese — Histórico Clínico</div></div>
  ${rows||'<div class="empty"><div class="ei">📋</div><p>Sem atletas no plantel</p></div>'}`;
}
function _anamDetailField(label,val){
  return `<div style="margin-bottom:8px"><div style="font-size:10px;color:var(--t2);text-transform:uppercase;font-weight:700">${label}</div><div style="font-size:12px">${val?escHtml(val):'—'}</div></div>`;
}
function openAnamneseDetail(athleteId){
  const at=APP.athletes.find(a=>a.id===athleteId);if(!at)return;
  if(!APP.anamnesis)APP.anamnesis=[];
  let an=APP.anamnesis.find(a=>a.athleteId===athleteId);
  if(!an){an={id:athleteId,athleteId,selfReport:{},selfReportUpdatedAt:null,clinicalNotes:'',clinicalNotesUpdatedAt:null,clinicalNotesUpdatedBy:null,fisioViewedAt:null};APP.anamnesis.push(an);}
  const sr=an.selfReport||{};
  // Marcar como vista pela fisio (limpa o aviso "🔔 Atualizado" na lista)
  an.fisioViewedAt=new Date().toISOString();
  saveData();
  if(_sync)cloudUpsert('athlete_anamnesis',{...an,club_id:_cid});

  const injs=APP.injuries.filter(i=>i.athleteId===athleteId).sort((a,b)=>b.date.localeCompare(a.date));
  const timelineHtml=injs.length?injs.map(inj=>{
    const treats=APP.treatments.filter(t=>t.injuryId===inj.id).sort((a,b)=>b.date.localeCompare(a.date));
    return `<div style="padding:8px 0;border-bottom:1px solid var(--brd)">
      <div style="font-size:12px;font-weight:700">${fmtDate(inj.date)} — ${escHtml(inj.diagnosis||inj.type||'')} ${statusBadge(inj.status)}</div>
      <div style="font-size:10px;color:var(--t2)">${inj.bodyPart||''}</div>
      ${treats.map(t=>`<div style="font-size:10px;color:var(--t2);padding-left:10px">↳ ${fmtDate(t.date)} · ${t.type}</div>`).join('')}
    </div>`;
  }).join(''):'<div style="font-size:11px;color:var(--t2)">Sem episódios registados desde que está no clube.</div>';

  openMod('📋 Anamnese — '+_displayName(at),
    '<div style="font-size:11px;color:var(--t2);margin-bottom:10px">Autorreportado pela atleta'+(an.selfReportUpdatedAt?' · atualizado em '+fmtDate(an.selfReportUpdatedAt.slice(0,10)):' · ainda não preenchido')+'</div>'
    +_anamDetailField('Lesões anteriores',sr.previousInjuries)
    +_anamDetailField('Cirurgias',sr.surgeries)
    +_anamDetailField('Condições crónicas',sr.chronicConditions)
    +_anamDetailField('Alergias',sr.allergies)
    +_anamDetailField('Medicação',sr.medication)
    +_anamDetailField('Histórico familiar',sr.familyHistory)
    +_anamDetailField('Outras notas',sr.notes)
    +'<div class="sh" style="margin-top:14px"><div class="sh-t" style="font-size:12px">Historial no clube</div></div>'
    +'<div style="max-height:180px;overflow-y:auto">'+timelineHtml+'</div>'
    +'<div class="fg" style="margin-top:14px"><label class="lbl">Notas clínicas (só visível para a fisio)</label>'
    +'<textarea class="ctrl" id="an-clinical" rows="4">'+(an.clinicalNotes?escHtml(an.clinicalNotes):'')+'</textarea></div>'
    +'<button class="btn btn-g" style="width:100%" onclick="saveClinicalNotes(\''+athleteId+'\')">Guardar notas clínicas</button>'
  ,'lg');
  renderFisioAnamnese();
}
async function saveClinicalNotes(athleteId){
  const an=(APP.anamnesis||[]).find(a=>a.athleteId===athleteId);
  if(!an)return;
  const sess=getSession();
  an.clinicalNotes=document.getElementById('an-clinical')?.value.trim()||'';
  an.clinicalNotesUpdatedAt=new Date().toISOString();
  an.clinicalNotesUpdatedBy=sess?sess.name:'';
  saveData();
  if(_sync)await cloudUpsert('athlete_anamnesis',{...an,club_id:_cid});
  closeMod();
  toast('Notas clínicas guardadas ✓');
}

function calcBMI(){
  const wt=+document.getElementById('na-wt').value;

}
function saveNutriAval(){

  const a={id:uid(),athleteId:aid,date,weight:document.getElementById('na-wt').value,height:document.getElementById('na-ht').value,bmi:document.getElementById('na-bmi').value,bodyFat:document.getElementById('na-fat').value,muscle:document.getElementById('na-mus').value,hydration:document.getElementById('na-hyd').value,tricipital:document.getElementById('na-tri').value,suprailiaca:document.getElementById('na-sup').value,notes:document.getElementById('na-notes').value};

  if(_sync)cloudUpsert('nutrition_records',a);

}
function deleteNutriAval(id){if(!confirm('Apagar?'))return;APP.nutritionAssessments=APP.nutritionAssessments.filter(a=>a.id!==id);saveData();toast('Apagada');renderNutriAval();}

function _dlCSV(rows,filename){
  const csv=rows.map(r=>r.map(c=>{const s=String(c==null?'':c);return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

// ── Relatório de Atleta ────────────────────────────────────────────────────────
// Classificação de carga de UMA sessão (não confundir com ACWR, que é acumulado 7/28 dias).
// Bandas de referência iniciais definidas com o Roger — não são valores fisiológicos
// universais, servem de ponto de partida até termos baseline coletiva do plantel (ver
// memória project_sps_sistema_carga_wellness_ciclo). Cores: abaixo do ideal = azul,
// zona-alvo = verde, acima do ideal, crescente = amarelo → laranja → vermelho.
function _uaZone(ua){
  if(ua===null||ua===undefined||isNaN(ua))return {label:'—',cls:''};
  if(ua<=150)return {label:'Muito baixa',cls:'bg-b'};
  if(ua<=300)return {label:'Baixa',cls:'bg-b'};
  if(ua<=450)return {label:'Ótima/controlada',cls:'bg-g'};
  if(ua<=600)return {label:'Moderada',cls:'bg-g'};
  if(ua<=750)return {label:'Alta',cls:'bg-y'};
  if(ua<=900)return {label:'Muito alta',cls:'bg-o'};
  return {label:'Extrema',cls:'bg-r'};
}
// Núcleo partilhado: severidade 0-3 combinando carga da sessão (UA) + wellness + impacto
// do ciclo reportado. Duas leituras diferentes sobre o mesmo cálculo consoante o contexto:
// _decisaoDiaria (linguagem de decisão de treino, para o treinador) e _riscoCiclo
// (linguagem de risco/atenção operacional, para a fisio) — nunca diagnóstico médico.
// 'r' é o registo de uma atleta num dia (espera-se {pse:{ua}, well:{score,cycleImpact}, inj, trat}).
// Vermelho exige combinação de fatores no pior nível (não um único fator isolado), seguindo
// o princípio do Roger: associações isoladas não devem virar regras automáticas de alarme.
function _cargaWellnessCicloSev(r){
  const cargaSev=r&&r.pse?(r.pse.ua>750?2:r.pse.ua>600?1:0):null;
  const wellSev=r&&r.well?(r.well.score<45?2:r.well.score<70?1:0):null;
  const impacto=r&&r.well?(+r.well.cycleImpact||0):0;
  const impactoSev=impacto>=3?2:impacto===2?1:0;
  const sevs=[cargaSev,wellSev,impactoSev].filter(v=>v!==null);
  if(!sevs.length)return null;
  const severeCount=sevs.filter(v=>v===2).length;
  const elevatedCount=sevs.filter(v=>v===1).length;
  if(severeCount>=2)return 3;
  if(severeCount===1)return 2;
  if(elevatedCount>=1)return 1;
  return 0;
}
function _decisaoDiaria(r){
  if(r&&(r.inj||r.trat))return {lvl:null,label:'—'};
  const sev=_cargaWellnessCicloSev(r);
  if(sev===null)return {lvl:null,label:'Sem dados suficientes'};
  return [{lvl:'g',label:'🟢 Treino normal'},{lvl:'y',label:'🟡 Monitorizar / considerar individualização'},{lvl:'o',label:'🟠 Ajustar volume/intensidade'},{lvl:'r',label:'🔴 Avaliação individual antes da sessão'}][sev];
}
function _riscoCiclo(r){
  if(r&&(r.inj||r.trat))return {lvl:null,label:'—'};
  const sev=_cargaWellnessCicloSev(r);
  if(sev===null)return {lvl:null,label:'Sem dados suficientes'};
  return [{lvl:'g',label:'🟢 Normal'},{lvl:'y',label:'🟡 Atenção'},{lvl:'o',label:'🟠 Alerta'},{lvl:'r',label:'🔴 Intervenção/avaliação individual'}][sev];
}
function _acwrAt(id,endDate){
  const days7=Array.from({length:7},(_,i)=>addDaysStr(endDate,-(6-i)));
  const days28=Array.from({length:28},(_,i)=>addDaysStr(endDate,-(27-i)));
  const p=APP.pse.filter(x=>x.athleteId===id);
  const acute=p.filter(x=>days7.includes(x.date)).reduce((s,x)=>s+(+x.ua||0),0)/7;
  const chronic=p.filter(x=>days28.includes(x.date)).reduce((s,x)=>s+(+x.ua||0),0)/28;
  return chronic?Math.round(acute/chronic*100)/100:null;
}

// Análise Descritiva — texto gerado por regras/templates a partir dos dados já calculados
// (sem chamadas a IA externa: sem custo, sem latência, sem dados a sair da app). Os números
// vêm sempre do código, nunca são "adivinhados" pelo texto.
function _athleteNarrative(d){
  const s=[];
  const{name,avgPse,avgPsePrev,acwr,avgWell,avgWellPrev,attPct,attPctPrev,attPresente,attDenom,
    naoJustCount,gamesCount,evalDateLbl,daysSinceEval,activeInjuries}=d;
  if(avgPse==null&&avgWell==null&&attDenom===0&&!gamesCount){
    return `Não há dados suficientes registados para ${escHtml(name)} neste período para uma análise descritiva.`;
  }
  if(avgPse!=null){
    let loadNote='';
    if(acwr!=null){
      loadNote=acwr>1.5?`, com ACWR de ${acwr} — carga aguda elevada face à crónica, sinal de possível sobrecarga`
        :acwr<0.8?`, com ACWR de ${acwr} — carga aguda baixa face à crónica, sinal de destreino`
        :`, com ACWR de ${acwr} dentro da zona considerada segura`;
    }
    s.push(`A carga de treino registou um PSE médio de ${avgPse}/10${loadNote}.`);
    if(avgPsePrev!=null){
      const diff=Math.round((avgPse-avgPsePrev)*10)/10;
      if(Math.abs(diff)>=0.3)s.push(`Face ao período anterior (${avgPsePrev}/10), a carga percebida ${diff>0?'aumentou':'diminuiu'} ${Math.abs(diff)} pontos.`);
    }
  }else{
    s.push('Não foram registados dados de PSE neste período.');
  }
  if(avgWell!=null){
    const wellNote=avgWell>=70?'boa recuperação e bem-estar geral':avgWell>=45?'níveis moderados de bem-estar, a acompanhar':'sinais de fadiga e bem-estar reduzido, a merecer atenção';
    s.push(`O wellness médio foi de ${avgWell}/100, refletindo ${wellNote}.`);
    if(avgWellPrev!=null){
      const diff=avgWell-avgWellPrev;
      if(Math.abs(diff)>=5)s.push(`Comparado com o período anterior (${avgWellPrev}), houve uma ${diff>0?'melhoria':'queda'} de ${Math.abs(diff)} pontos.`);
    }
  }else{
    s.push('Sem registos de wellness neste período.');
  }
  if(attPct!=null){
    s.push(`A assiduidade foi de ${attPct}% (${attPresente}/${attDenom} sessões)${naoJustCount?`, com ${naoJustCount} falta${naoJustCount>1?'s':''} não justificada${naoJustCount>1?'s':''}`:''}.`);
    if(attPctPrev!=null){
      const diff=attPct-attPctPrev;
      if(Math.abs(diff)>=10)s.push(`${diff>0?'Melhorou':'Piorou'} face ao período anterior (${attPctPrev}%).`);
    }
  }
  if(gamesCount)s.push(`Participou em ${gamesCount} jogo${gamesCount>1?'s':''} no período.`);
  if(evalDateLbl){
    s.push(`A avaliação técnica mais recente é de ${evalDateLbl}${daysSinceEval>60?`, já com ${daysSinceEval} dias — a merecer atualização`:''}.`);
  }else{
    s.push('Sem avaliação técnica registada.');
  }
  if(activeInjuries&&activeInjuries.length)s.push(`Encontra-se em acompanhamento clínico: ${activeInjuries.join(', ')}.`);
  return s.join(' ');
}
function printAthleteReport(){
  const id=document.getElementById('rep-at-sel').value;
  if(!id)return toast('Seleciona uma atleta','err');
  const at=APP.athletes.find(a=>a.id===id);if(!at)return;
  const mode=_repAtMode||'semanal';
  let startDate,endDate,periodLabel;
  if(mode==='semanal'){
    const anyDay=document.getElementById('rep-at-week')?.value||today();
    startDate=getMonday(anyDay);
    endDate=addDaysStr(startDate,6);
    periodLabel=fmtDate(startDate)+' – '+fmtDate(endDate);
  } else {
    const ym=document.getElementById('rep-at-month')?.value||today().slice(0,7);
    startDate=ym+'-01';
    const [y,m]=ym.split('-').map(Number);
    endDate=_fmtISO(new Date(y,m,0));
    periodLabel=new Date(ym+'-01T00:00:00').toLocaleDateString('pt-PT',{month:'long',year:'numeric'});
  }
  const inRange=d=>d>=startDate&&d<=endDate;

  const pseRecs=APP.pse.filter(p=>p.athleteId===id&&inRange(p.date)).sort((a,b)=>a.date.localeCompare(b.date));
  const avgPse=pseRecs.length?Math.round(pseRecs.reduce((s,p)=>s+(+p.pse||0),0)/pseRecs.length*10)/10:null;
  const acwr=_acwrAt(id,endDate);

  const wellRecs=APP.wellness.filter(w=>w.athleteId===id&&inRange(w.date)).sort((a,b)=>a.date.localeCompare(b.date));
  // Treino Extra (autorreportado, fora do clube) — carga própria, não somada ao ACWR oficial
  const extraRecs=(APP.extraTrainings||[]).filter(e=>e.athleteId===id&&inRange(e.date)).sort((a,b)=>a.date.localeCompare(b.date));
  const extraTotalMin=extraRecs.reduce((s,e)=>s+(+e.duration||0),0);
  const extraTotalUA=extraRecs.reduce((s,e)=>s+(+e.ua||0),0);
  const avgWell=wellRecs.length?Math.round(wellRecs.reduce((s,w)=>s+(+w.score||0),0)/wellRecs.length):null;

  if(!APP.attendance)APP.attendance=[];
  const evsPeriodo=APP.schedule.filter(e=>inRange(e.date)&&((!e.teamId||e.teamId===at.teamId)||(e.guestIds||[]).includes(id))&&_isTrainingType(e.type));
  const evIdsP=new Set(evsPeriodo.map(e=>e.id));
  const attRecsP=APP.attendance.filter(a=>a.athleteId===id&&evIdsP.has(a.eventId));
  const attPresente=attRecsP.filter(a=>a.status==='treino').length;
  const attTratamento=attRecsP.filter(a=>a.status==='tratamento').length;
  const attAusentesAll=attRecsP.filter(a=>a.status==='ausente');
  const attFerias=attAusentesAll.filter(a=>a.reason==='ferias');
  const attAusentes=attAusentesAll.filter(a=>a.reason!=='ferias'&&a.reason!=='convocada'); // férias e convocatória avulsa não contam como falta (como o tratamento)
  const attDenom=attPresente+attAusentes.length;
  const attPct=attDenom?Math.round(attPresente/attDenom*100):null;

  const _byDate=(type)=>(APP.evalResponses||[])
    .filter(r=>r.athleteId===id&&r.type===type)
    .map(r=>({r,p:(APP.evalPeriods||[]).find(p=>p.id===r.periodId)}))
    .filter(x=>x.p)
    .sort((a,b)=>(b.p.openDate||'').localeCompare(a.p.openDate||''))[0];
  const tecEntry=_byDate('tecnica'), autoEntry=_byDate('auto');
  const ratiosTec=tecEntry?_calcRatios(tecEntry.r):{};
  const ratiosAuto=autoEntry?_calcRatios(autoEntry.r):{};
  const evalImg=(tecEntry||autoEntry)?_evalRadarB64(ratiosAuto,ratiosTec):'';
  const evalDateLbl=tecEntry?fmtDate(tecEntry.p.openDate):(autoEntry?fmtDate(autoEntry.p.openDate):'');

  const convocsP=(APP.convocatorias||[]).filter(c=>c.athletes&&c.athletes.includes(id)&&inRange(c.date)).sort((a,b)=>a.date.localeCompare(b.date));

  const gamesP=APP.games.filter(g=>inRange(g.date)&&((g.lineup&&g.lineup.includes(id))||(g.subs&&g.subs.includes(id))||(g.playerStats||[]).some(s=>s.aid===id)||(g.noShow&&g.noShow[id]!==undefined)));
  const noShowGamesP=gamesP.filter(g=>g.noShow&&g.noShow[id]!==undefined);

  const injuriesP=APP.injuries.filter(i=>i.athleteId===id&&i.date<=endDate&&(!i.returnDate||i.returnDate>=startDate));
  const treatsP=APP.treatments.filter(t=>t.athleteId===id&&inRange(t.date)).sort((a,b)=>a.date.localeCompare(b.date));

  const nutriPlan=(APP.nutritionPlans||[]).find(n=>n.athleteId===id&&n.active);
  const avalsAll=(APP.nutritionAssessments||[]).filter(a=>a.athleteId===id).sort((a,b)=>b.date.localeCompare(a.date));
  const lastAval=avalsAll[0];
  const avalsP=avalsAll.filter(a=>inRange(a.date));

  const pseChartImg=pseRecs.length?_pseTrendB64(pseRecs.map(p=>fmtDateShort(p.date)),pseRecs.map(p=>p.ua),pseRecs.map(p=>p.pse)):'';
  const wellChartImg=wellRecs.length?_wellTrendB64(wellRecs.map(w=>fmtDateShort(w.date)),wellRecs.map(w=>w.score)):'';

  const age=at.dob?ageYears(at.dob):null;
  const photoHtml=at.photo?`<img class="profile-photo" src="${at.photo}" onerror="this.style.display='none'">`:`<div class="profile-photo-ph">${at.name.slice(0,1)}</div>`;

  const kpis=[
    {v:avgPse??'—',l:'PSE Médio'},
    {v:avgWell??'—',l:'Wellness Médio'},
    {v:acwr??'—',l:'ACWR'},
    {v:attPct!=null?attPct+'%':'—',l:'Presenças'},
    {v:gamesP.length,l:'Jogos no Período'},
    {v:extraRecs.length,l:'Treino Extra'}
  ];

  // ── Análise Automática do Período (baseada em regras, mesma lógica do painel Estado da Atleta) ──
  const naoJust=attAusentes.filter(a=>a.reason==='nao_justificada');
  const activeInPeriod=injuriesP.filter(i=>i.status!=='alta');
  const periodDays=mode==='semanal'?7:(Math.round((new Date(endDate+'T00:00:00')-new Date(startDate+'T00:00:00'))/86400000)+1);
  const prevEnd=addDaysStr(startDate,-1);
  const prevStart=addDaysStr(startDate,-periodDays);
  const prevWellRecs=APP.wellness.filter(w=>w.athleteId===id&&w.date>=prevStart&&w.date<=prevEnd);
  const avgWellPrev=prevWellRecs.length?Math.round(prevWellRecs.reduce((s,w)=>s+(+w.score||0),0)/prevWellRecs.length):null;
  const prevPseRecs=APP.pse.filter(p=>p.athleteId===id&&p.date>=prevStart&&p.date<=prevEnd);
  const avgPsePrev=prevPseRecs.length?Math.round(prevPseRecs.reduce((s,p)=>s+(+p.pse||0),0)/prevPseRecs.length*10)/10:null;
  const acwrPrev=_acwrAt(id,prevEnd);
  const evsPeriodoPrev=APP.schedule.filter(e=>e.date>=prevStart&&e.date<=prevEnd&&((!e.teamId||e.teamId===at.teamId)||(e.guestIds||[]).includes(id))&&_isTrainingType(e.type));
  const evIdsPrev=new Set(evsPeriodoPrev.map(e=>e.id));
  const attRecsPrev=APP.attendance.filter(a=>a.athleteId===id&&evIdsPrev.has(a.eventId));
  const attPresentePrev=attRecsPrev.filter(a=>a.status==='treino').length;
  const attAusentesPrev=attRecsPrev.filter(a=>a.status==='ausente'&&a.reason!=='ferias'&&a.reason!=='convocada');
  const attDenomPrev=attPresentePrev+attAusentesPrev.length;
  const attPctPrev=attDenomPrev?Math.round(attPresentePrev/attDenomPrev*100):null;
  const gamesPrev=APP.games.filter(g=>g.date>=prevStart&&g.date<=prevEnd&&((g.lineup&&g.lineup.includes(id))||(g.subs&&g.subs.includes(id))||(g.playerStats||[]).some(s=>s.aid===id)||(g.noShow&&g.noShow[id]!==undefined)));
  const latestEvalDate=[tecEntry?.p.openDate,autoEntry?.p.openDate].filter(Boolean).sort().pop()||null;
  const daysSinceEval=latestEvalDate?Math.round((new Date(endDate+'T00:00:00')-new Date(latestEvalDate+'T00:00:00'))/86400000):null;
  const cycleOvul=wellRecs.some(w=>w.cycle==='Ovulação');
  const cycleOvulRisk=cycleOvul&&acwr!==null&&acwr>=1.3;

  const findings=[];
  if(acwr!==null&&(acwr>1.5||acwr<0.8))findings.push({lvl:'r',txt:`Carga fora da zona segura — ACWR ${acwr} (risco de ${acwr>1.5?'sobrecarga':'destreino'})`});
  if(avgWell!==null&&avgWell<45)findings.push({lvl:'r',txt:`Wellness médio baixo no período — ${avgWell}/100`});
  if(avgWell!==null&&avgWellPrev!==null&&(avgWellPrev-avgWell)>=15)findings.push({lvl:'y',txt:`Queda de wellness face ao período anterior — ${avgWellPrev} → ${avgWell}`});
  if(attPct!==null&&attPct<80)findings.push({lvl:'y',txt:`Presenças abaixo do esperado — ${attPct}% no período`});
  if(naoJust.length)findings.push({lvl:'y',txt:`${naoJust.length} falta${naoJust.length>1?'s':''} não justificada${naoJust.length>1?'s':''} no período`});
  if(noShowGamesP.length)findings.push({lvl:'y',txt:`${noShowGamesP.length} falta${noShowGamesP.length>1?'s':''} a jogo${noShowGamesP.length>1?'s':''} para o${noShowGamesP.length>1?'s':''} qual${noShowGamesP.length>1?'is':''} estava convocada`});
  if(activeInPeriod.length)findings.push({lvl:'r',txt:`Lesão em acompanhamento: ${activeInPeriod.map(i=>escHtml(i.diagnosis||i.type||'—')).join(', ')}`});
  if(!latestEvalDate)findings.push({lvl:'y',txt:'Sem avaliação técnica registada'});
  else if(daysSinceEval>60)findings.push({lvl:'y',txt:`Avaliação técnica desatualizada — última há ${daysSinceEval} dias`});
  if(cycleOvulRisk)findings.push({lvl:'r',txt:`Risco acrescido de lesão ligamentar — fase ovulatória + carga elevada (ACWR ${acwr})`});
  else if(cycleOvul)findings.push({lvl:'info',txt:'Fase ovulatória reportada no período — atenção redobrada em mudanças de direção e aterragens'});
  const _lvlOrder={r:0,y:1,info:2,g:3};
  findings.sort((a,b)=>_lvlOrder[a.lvl]-_lvlOrder[b.lvl]);
  const _lvlIcon={r:'🔴',y:'🟡',info:'ℹ️',g:'🟢'};
  const analysisHtml=findings.length
    ?findings.slice(0,6).map(f=>`<div class="an-item an-${f.lvl}">${_lvlIcon[f.lvl]} ${f.txt}</div>`).join('')
    :`<div class="an-item an-g">🟢 Sem alertas relevantes — período dentro da normalidade.</div>`;

  // ── Comparação com o Período Anterior (números só do código, nunca do texto) ──
  const _cmpRow=(label,cur,prev,unit='')=>{
    const curTxt=cur==null?'—':cur+unit;
    const prevTxt=prev==null?'—':prev+unit;
    let varTxt='—';
    if(cur!=null&&prev!=null){
      const diff=Math.round((cur-prev)*10)/10;
      const arrow=diff>0?'↑':diff<0?'↓':'→';
      varTxt=diff===0?'→ =':`${arrow} ${diff>0?'+':''}${diff}${unit}`;
    }
    return `<tr><td>${label}</td><td>${curTxt}</td><td>${prevTxt}</td><td>${varTxt}</td></tr>`;
  };
  const comparisonTable=`<table><thead><tr><th>Métrica</th><th>Atual</th><th>Anterior</th><th>Var.</th></tr></thead><tbody>
    ${_cmpRow('PSE Médio',avgPse,avgPsePrev)}
    ${_cmpRow('Wellness Médio',avgWell,avgWellPrev)}
    ${_cmpRow('ACWR',acwr,acwrPrev)}
    ${_cmpRow('Presenças',attPct,attPctPrev,'%')}
    ${_cmpRow('Jogos',gamesP.length,gamesPrev.length)}
  </tbody></table>`;

  // ── Análise Descritiva (texto por regras/templates, sem IA — ver _athleteNarrative) ──
  const narrativeText=_athleteNarrative({
    name:at.name,avgPse,avgPsePrev,acwr,avgWell,avgWellPrev,attPct,attPctPrev,
    attPresente,attDenom,naoJustCount:naoJust.length,gamesCount:gamesP.length,
    evalDateLbl,daysSinceEval,
    activeInjuries:activeInPeriod.map(i=>escHtml(i.diagnosis||i.type||'—'))
  });

  const attTable=`<table><thead><tr><th>Sessões</th><th>Presente</th><th>Tratamento</th><th>Férias</th><th>Ausente</th></tr></thead>
    <tbody><tr><td>${evsPeriodo.length}</td><td>${attPresente}</td><td>${attTratamento}</td><td>${attFerias.length}</td><td>${attAusentes.length}</td></tr></tbody></table>
    ${attAusentes.length?`<table style="margin-top:4px"><thead><tr><th>Data</th><th>Motivo</th></tr></thead><tbody>${attAusentes.map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${ATT_REASONS[a.reason]||'—'}</td></tr>`).join('')}</tbody></table>`:''}`;

  let pseTable;
  if(!pseRecs.length){
    pseTable='<p style="color:#999;font-size:8pt">Sem dados</p>';
  }else if(mode==='mensal'){
    const hi=pseRecs.filter(p=>(+p.pse||0)>=8);
    pseTable=hi.length
      ?`<table><thead><tr><th>Data</th><th>PSE</th><th>Duração</th><th>UA</th><th>Tipo</th></tr></thead><tbody>${hi.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${p.pse}/10</td><td>${p.duration} min</td><td>${p.ua}</td><td>${p.sessionType||'—'}</td></tr>`).join('')}</tbody></table><p class="an-note">Mostrando apenas sessões de carga elevada (PSE≥8) — ${pseRecs.length} registos no mês, ver gráfico para a evolução completa.</p>`
      :`<p class="an-note">Sem sessões de carga elevada no mês (todas PSE&lt;8) — ${pseRecs.length} registos, ver gráfico para a evolução completa.</p>`;
  }else{
    pseTable=`<table><thead><tr><th>Data</th><th>PSE</th><th>Duração</th><th>UA</th><th>Tipo</th></tr></thead><tbody>${pseRecs.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${p.pse}/10</td><td>${p.duration} min</td><td>${p.ua}</td><td>${p.sessionType||'—'}</td></tr>`).join('')}</tbody></table>`;
  }

  let wellTable;
  if(!wellRecs.length){
    wellTable='<p style="color:#999;font-size:8pt">Sem dados</p>';
  }else if(mode==='mensal'){
    const low=wellRecs.filter(w=>(+w.score||0)<45);
    const wRow=w=>{const c=w.score>=70?'bg-g':w.score>=45?'bg-y':'bg-r';return`<tr><td>${fmtDate(w.date)}</td><td>${w.sleep}</td><td>${w.fatigue}</td><td>${w.stress}</td><td>${w.pain}</td><td>${w.mood}</td><td><span class="badge ${c}">${w.score}</span></td><td>${w.cycle||'—'}</td></tr>`;};
    wellTable=low.length
      ?`<table><thead><tr><th>Data</th><th>Sono</th><th>Fadiga</th><th>Stress</th><th>Dor</th><th>Humor</th><th>Score</th><th>Ciclo</th></tr></thead><tbody>${low.map(wRow).join('')}</tbody></table><p class="an-note">Mostrando apenas dias de wellness baixo (&lt;45) — ${wellRecs.length} registos no mês, ver gráfico para a evolução completa.</p>`
      :`<p class="an-note">Sem dias de wellness baixo no mês — ${wellRecs.length} registos, ver gráfico para a evolução completa.</p>`;
  }else{
    const wRow=w=>{const c=w.score>=70?'bg-g':w.score>=45?'bg-y':'bg-r';return`<tr><td>${fmtDate(w.date)}</td><td>${w.sleep}</td><td>${w.fatigue}</td><td>${w.stress}</td><td>${w.pain}</td><td>${w.mood}</td><td><span class="badge ${c}">${w.score}</span></td><td>${w.cycle||'—'}</td></tr>`;};
    wellTable=`<table><thead><tr><th>Data</th><th>Sono</th><th>Fadiga</th><th>Stress</th><th>Dor</th><th>Humor</th><th>Score</th><th>Ciclo</th></tr></thead><tbody>${wellRecs.map(wRow).join('')}</tbody></table>`;
  }

  // Treino Extra: mesma lógica de tabela simples do PSE/Wellness, sem gráfico (pedido
  // do Roger: "só mais uma linha" no relatório, não um gráfico novo).
  const extraTable=extraRecs.length
    ?`<table><thead><tr><th>Data</th><th>Hora</th><th>Tipo</th><th>Duração</th><th>PSE</th><th>UA</th><th>Resumo</th></tr></thead><tbody>${extraRecs.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${fmtHora(e.submittedAt)}</td><td>${escHtml(e.type||'—')}</td><td>${e.duration} min</td><td>${e.pse}/10</td><td>${e.ua}</td><td style="font-size:8pt;color:#555">${escHtml(e.summary||'—')}</td></tr>`).join('')}</tbody></table><p class="an-note">${extraRecs.length} sessão${extraRecs.length>1?'ões':''} · ${extraTotalMin} min total · UA extra ${extraTotalUA} (carga autorreportada, fora do clube — não incluída no ACWR oficial).</p>`
    :'<p style="color:#999;font-size:8pt">Sem treino extra registado no período</p>';

  const convocTable=convocsP.length?`<table><thead><tr><th>Data</th><th>Adversário</th><th>Papel</th><th>Viu</th></tr></thead><tbody>${convocsP.map(c=>{
    const g=c.gameId?APP.games.find(x=>x.id===c.gameId):null;
    const opp=g?g.opp:(c.notes||'—');
    const isCap=c.captain===id, isVice=c.viceCaptain===id, isTit=(c.lineup||[]).includes(id);
    const papel=[isTit?'Titular':(c.athletes.includes(id)?'Suplente':''),isCap?'Capitã':(isVice?'Vice-Cap.':'')].filter(Boolean).join(' · ');
    const viu=(c.seenBy||[]).some(s=>s.athleteId===id);
    return `<tr><td>${fmtDate(c.date)}</td><td>${escHtml(opp)}</td><td>${papel||'—'}</td><td>${viu?'✅':'—'}</td></tr>`;
  }).join('')}</tbody></table>`:'<p style="color:#999;font-size:9pt">Sem convocatórias no período</p>';

  const gamesTable=gamesP.length?`<table><thead><tr><th>Data</th><th>Adversário</th><th>Resultado</th><th>Min.</th><th>⚽</th><th>🅰️</th><th>🟨</th><th>🟥</th></tr></thead><tbody>${gamesP.sort((a,b)=>a.date.localeCompare(b.date)).map(g=>{
    const noShow=g.noShow&&g.noShow[id]!==undefined;
    if(noShow){
      const motivo=ATT_REASONS[g.noShow[id]]||'Sem motivo indicado';
      return `<tr><td>${fmtDate(g.date)}</td><td>${escHtml(g.opp)}</td><td colspan="6" style="color:#c0392b">❌ Convocada mas não compareceu — ${motivo}</td></tr>`;
    }
    const st=(g.playerStats||[]).find(s=>s.aid===id);
    const res=g.g1!=null&&g.g2!=null?g.g1+'–'+g.g2:'—';
    return `<tr><td>${fmtDate(g.date)}</td><td>${escHtml(g.opp)}</td><td>${res}</td><td>${st?st.mins||0:'sem dados'}</td><td>${st?st.goals||0:'—'}</td><td>${st?st.assists||0:'—'}</td><td>${st?st.yellow||0:'—'}</td><td>${st?st.red||0:'—'}</td></tr>`;
  }).join('')}</tbody></table>`:'<p style="color:#999;font-size:9pt">Sem jogos no período</p>';

  const injTable=injuriesP.length?`<table><thead><tr><th>Data</th><th>Diagnóstico</th><th>Zona</th><th>Estado</th><th>Retorno previsto</th></tr></thead><tbody>${injuriesP.map(i=>`<tr><td>${fmtDate(i.date)}</td><td>${escHtml(i.diagnosis||i.type||'—')}</td><td>${escHtml(i.bodyPart||'—')}</td><td>${i.status||'—'}</td><td>${i.returnDate?fmtDate(i.returnDate):'—'}</td></tr>`).join('')}</tbody></table>`:'<p style="color:#999;font-size:9pt">Sem lesões relevantes no período</p>';
  const tratTable=treatsP.length?`<table><thead><tr><th>Data</th><th>Tipo</th><th>Resposta</th></tr></thead><tbody>${treatsP.map(t=>`<tr><td>${fmtDate(t.date)}</td><td>${escHtml(t.type||'—')}</td><td>${t.response||'—'}</td></tr>`).join('')}</tbody></table>`:'<p style="color:#999;font-size:9pt">Sem tratamentos no período</p>';

  const nutriBlock=`
    ${nutriPlan?`<p style="font-size:7.8pt"><strong>Plano ativo:</strong> ${escHtml(nutriPlan.name||nutriPlan.title||'—')}${nutriPlan.kcal?' · '+nutriPlan.kcal+' kcal':''}</p>`:'<p style="color:#999;font-size:7.8pt">Sem plano nutricional ativo</p>'}
    ${lastAval?`<p style="font-size:7.8pt;margin-top:2px"><strong>Última avaliação (${fmtDate(lastAval.date)}):</strong> ${lastAval.weight?lastAval.weight+'kg':'—'}${lastAval.height?' · '+lastAval.height+'cm':''}${lastAval.bmi?' · IMC '+lastAval.bmi:''}${lastAval.bodyFat?' · '+lastAval.bodyFat+'% gordura':''}</p>`:'<p style="color:#999;font-size:7.8pt">Sem avaliação antropométrica registada</p>'}
    ${avalsP.length>1?`<table style="margin-top:4px"><thead><tr><th>Data</th><th>Peso</th><th>IMC</th><th>% Gordura</th></tr></thead><tbody>${avalsP.map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${a.weight||'—'}</td><td>${a.bmi||'—'}</td><td>${a.bodyFat||'—'}</td></tr>`).join('')}</tbody></table>`:''}
  `;

  const body=`
  <style>
    .rep-at{font-size:8.5pt}
    .rep-at h3{font-size:9.5pt;margin:7px 0 3px;padding-bottom:2px}
    .rep-at table{margin-bottom:3px}
    .rep-at th{padding:3px 6px;font-size:7.5pt}
    .rep-at td{padding:2px 6px;font-size:7.5pt}
    .rep-at .profile-header{margin-bottom:6px;padding-bottom:6px}
    .rep-at .profile-photo,.rep-at .profile-photo-ph{width:52px;height:52px;font-size:20px}
    .rep-at .kpi-row{margin-bottom:6px}
    .rep-at .kpi{padding:5px}
    .rep-at .kpi-v{font-size:13pt}
    .rep-at .kpi-l{font-size:6.5pt}
    .rep-at .an-box{border:1px solid #e5e5e5;border-radius:6px;padding:5px 8px;margin-bottom:6px;background:#fafafa}
    .rep-at .an-title{font-size:8.5pt;font-weight:700;color:#333;margin-bottom:2px}
    .rep-at .an-item{font-size:7.8pt;padding:1px 0;line-height:1.3}
    .rep-at .an-r{color:#a32424}
    .rep-at .an-y{color:#8a6a10}
    .rep-at .an-info{color:#185FA5}
    .rep-at .an-g{color:#1d6f3b}
    .rep-at .an-note{color:#999;font-size:6.8pt;margin-top:1px}
    .rep-at .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
    .rep-at .g2>div{min-width:0}
    .rep-at .sub-h{font-size:7.5pt;font-weight:700;margin-bottom:2px}
  </style>
  <div class="rep-at">
    <div class="pr-title">Relatório de Atleta — ${mode==='semanal'?'Semanal':'Mensal'}</div>
    <div class="profile-header">
      ${photoHtml}
      <div style="flex:1">
        <div style="font-size:15pt;font-weight:900;color:#111">${escHtml(at.name)}${at.alcunha?` <span style="font-size:10pt;font-weight:600;color:#888">("${escHtml(at.alcunha)}")</span>`:''}</div>
        <div style="font-size:9pt;color:#555;margin-top:3px">${at.pos||'—'} ${at.num?'· Nº '+at.num:''}${age?' · '+age+' anos':''}</div>
        <div style="font-size:9pt;color:#1d6f3b;font-weight:700;margin-top:3px">Período: ${periodLabel}</div>

// ── Presenças ────────────────────────────────────────────────────────────────
function _getAttReportData(){
  if(!APP.attendance)APP.attendance=[];
  const teamId=document.getElementById('rep-att-team')?.value||'';
  const ym=document.getElementById('rep-att-month')?.value||today().slice(0,7);
  const athletes=(teamId?APP.athletes.filter(a=>a.teamId===teamId):APP.athletes).sort((a,b)=>a.name.localeCompare(b.name));
  const evs=APP.schedule.filter(e=>e.date.startsWith(ym)&&(!teamId||e.teamId===teamId||!e.teamId)&&_isTrainingType(e.type));
  const evIds=new Set(evs.map(e=>e.id));
  const rows=athletes.map(at=>{
    const recs=APP.attendance.filter(a=>a.athleteId===at.id&&evIds.has(a.eventId));
    const presente=recs.filter(a=>a.status==='treino').length;
    const tratamento=recs.filter(a=>a.status==='tratamento').length;
    const feriasRecs=recs.filter(a=>a.status==='ausente'&&a.reason==='ferias');
    const convocadaRecs=recs.filter(a=>a.status==='ausente'&&a.reason==='convocada');
    const ausentes=recs.filter(a=>a.status==='ausente'&&a.reason!=='ferias'&&a.reason!=='convocada'); // férias e convocatória avulsa não contam como falta (como o tratamento)
    const byReason={justificada:0,nao_justificada:0,lesao:0,doenca:0,outro:0,sem_motivo:0};
    ausentes.forEach(a=>{if(a.reason&&byReason[a.reason]!==undefined)byReason[a.reason]++;else byReason.sem_motivo++;});
    const denom=presente+ausentes.length;
    const pct=denom?Math.round(presente/denom*100):null;
    return {at,presente,tratamento,ferias:feriasRecs.length,convocada:convocadaRecs.length,ausenteTotal:ausentes.length,...byReason,pct};
  });
  const team=APP.teams.find(t=>t.id===teamId);
  return {teamId,team,ym,evsCount:evs.length,rows};
}
function exportAttendanceCSV(){
  const d=_getAttReportData();
  if(!d.rows.length)return toast('Sem atletas para exportar','err');
  const headers=['Atleta','Treinos no mês','Presenças','Tratamento','Férias','Convocada a outra equipa','Faltas (total)','Justificada','Não Justificada','Lesão','Doença','Outro','Sem motivo','% Assiduidade'];
  const rows=[headers,...d.rows.map(r=>[_shortName(r.at),d.evsCount,r.presente,r.tratamento,r.ferias,r.convocada,r.ausenteTotal,r.justificada,r.nao_justificada,r.lesao,r.doenca,r.outro,r.sem_motivo,r.pct!==null?r.pct+'%':'—'])];
  _dlCSV(rows,`presencas_${(d.team?.name||'equipa')}_${d.ym}.csv`);
  toast('CSV exportado ✓');
}

    <table><thead><tr><th>Atleta</th><th>Treinos</th><th>Presente</th><th>Tratamento</th><th>Férias</th><th>Convocada</th><th>Faltas</th><th>Motivos</th><th>%</th></tr></thead>
    <tbody>${d.rows.map(r=>{
      const motivos=[r.justificada?'Just.: '+r.justificada:'',r.nao_justificada?'Não Just.: '+r.nao_justificada:'',r.lesao?'Lesão: '+r.lesao:'',r.doenca?'Doença: '+r.doenca:'',r.outro?'Outro: '+r.outro:'',r.sem_motivo?'S/ motivo: '+r.sem_motivo:''].filter(Boolean).join(', ')||'—';
      return`<tr><td title="${escHtml(r.at.name)}">${escHtml(_shortName(r.at))}</td><td>${d.evsCount}</td><td>${r.presente}</td><td>${r.tratamento}</td><td>${r.ferias}</td><td>${r.convocada}</td><td>${r.ausenteTotal}</td><td style="font-size:9pt">${motivos}</td><td><strong>${r.pct!==null?r.pct+'%':'—'}</strong></td></tr>`;

async function addUserFromConfig(){
  const name=document.getElementById('new-user-name').value.trim();
  const email=document.getElementById('new-user-email').value.trim();
  const role=document.getElementById('new-user-role').value;
  if(!name||!email)return toast('Nome e email obrigatórios','err');
  if(APP.users.find(u=>u.email.toLowerCase()===email.toLowerCase()))return toast('Email já existe','err');
  // Password inicial fixa (não gerada aleatoriamente) — mais rápido de criar/comunicar,
  // sobretudo para cargos como fisio/nutri com rotação de pessoas. A pessoa é obrigada a
  // definir a sua própria password no 1º acesso (handleLogin → _showStaffPwdSetup), tal
  // como já acontece com as atletas — mantém identificação individual real, sem o overhead
  // de gerir uma password aleatória por conta.
  const rawPwd=_defaultStaffPwd();
  const hash=await hashPwd(rawPwd);
  const uPhoto=document.getElementById('new-user-photo')?document.getElementById('new-user-photo').getAttribute('data-val')||'':'';
  const user={id:uid(),name,email,role,photo:uPhoto,passwordHash:hash,isAdmin:false,active:true,mustChangePwd:true,createdAt:today()};
  APP.users.push(user);saveData();
  if(_sync)cloudUpsert('staff_users',{...user,club_id:_cid});
  toast('Utilizador criado ✓');renderConfig();showUserCredsModal(user,rawPwd);
}
async function resetUserPwd(id){
  const user=APP.users.find(u=>u.id===id);if(!user)return;
  // Repor = voltar à password fixa + obrigar a definir uma nova no próximo acesso (mesmo
  // padrão do reset de password das atletas — ver resetAthletePwd).
  const rawPwd=_defaultStaffPwd();const hash=await hashPwd(rawPwd);
  user.passwordHash=hash;user.mustChangePwd=true;saveData();
  if(_sync)cloudUpsert('staff_users',{...user,club_id:_cid});
  toast('Password reposta ✓');showUserCredsModal(user,rawPwd);
}
function toggleUserActive(id){
  const sess=getSession();
  if(sess&&sess.userId===id)return toast('Não podes desativar a tua própria conta','err');
  const user=APP.users.find(u=>u.id===id);if(!user)return;
  user.active=!user.active;saveData();
  if(_sync)cloudUpsert('staff_users',{...user,club_id:_cid});
  toast(user.active?'Utilizador ativado':'Utilizador desativado');renderConfig();
}
async function deleteUser(id){
  const sess=getSession();
  if(sess&&sess.userId===id)return toast('Não podes apagar a tua própria conta','err');
  if(!confirm('Apagar utilizador?'))return;
  APP.users=APP.users.filter(u=>u.id!==id);saveData();
  if(_sync&&_supa){try{await _supa.from('staff_users').delete().eq('id',id);}catch(err){_warnSyncFailure('staff_users (apagar)',err);}}
  toast('Apagado');renderConfig();
}

// ── Alteração voluntária de password (lado atleta, dentro da app) ────────────
function atOpenChangePwd(){
  const at=APP.athletes.find(a=>a.id===AID);if(!at)return;
  openMod('🔑 Alterar Password',
    '<div class="fg"><label class="lbl">Nova password</label>'
    +'<input class="ctrl" type="password" id="at-newpwd1" placeholder="Mín. 6 caracteres" autocomplete="new-password"></div>'
    +'<div class="fg"><label class="lbl">Confirmar password</label>'
    +'<input class="ctrl" type="password" id="at-newpwd2" placeholder="Repete a password" autocomplete="new-password" onkeydown="if(event.key===\'Enter\')atSaveChangePwd()"></div>'
    +'<div class="login-err" id="at-newpwd-err"></div>'
    +'<button class="btn btn-g" style="width:100%;margin-top:8px" onclick="atSaveChangePwd()">Guardar nova password</button>');
  setTimeout(()=>document.getElementById('at-newpwd1')?.focus(),80);
}
async function atSaveChangePwd(){
  const at=APP.athletes.find(a=>a.id===AID);if(!at)return;
  const p1=document.getElementById('at-newpwd1')?.value||'';
  const p2=document.getElementById('at-newpwd2')?.value||'';
  const err=document.getElementById('at-newpwd-err');
  if(p1.length<6){if(err)err.textContent='⚠️ Mínimo 6 caracteres.';return;}
  if(p1!==p2){if(err)err.textContent='⚠️ As passwords não coincidem.';return;}
  at.passwordHash=await hashPwd(p1);
  at.mustChangePwd=false;
  saveData();
  if(_sync)await cloudUpsert('athletes',{...at,club_id:_cid,team_id:at.teamId});
  closeMod();
  toast('Password alterada ✓');
}
async function resetAthletePwd(id){
  const at=APP.athletes.find(a=>a.id===id);if(!at)return;
  const rawPwd=_defaultAthletePwd(at.num||at.number);
  if(!rawPwd)return toast('Esta atleta ainda não tem número de camisola — atribui um número antes de repor a password','err');
  const hash=await hashPwd(rawPwd);
  at.passwordHash=hash;at.mustChangePwd=true;saveData();
  if(_sync)cloudUpsert('athletes',{...at,club_id:_cid,team_id:at.teamId});
  toast('Password reposta ✓');showAthleteCredsModal(at,rawPwd);
}
async function deleteAthlete(id){
  const at=APP.athletes.find(a=>a.id===id);if(!at)return;
  if(!confirm('Remover '+at.name+' do plantel? Vai passar para Scouting.'))return;
  APP.athletes=APP.athletes.filter(a=>a.id!==id);
  if(!APP.scouting)APP.scouting=[];
  APP.scouting.push({id:uid(),name:at.name,pos:at.pos||'',club:(APP.config.clubName||'Clube')+' (ex-)',nat:at.nat||'',age:ageYears(at.dob)||null,height:at.height||'',foot:at.foot||'',rating:0,notes:'Saiu do plantel em '+today()+'.'+(at.num?' Usava o nº'+at.num+'.':''),video:'',photo:at.photo||'',addedAt:today()});
  _purgeAthleteRefs(id);
  saveData();
  if(_sync&&_supa){try{await _supa.from('athletes').delete().eq('id',id);}catch(err){_warnSyncFailure('athletes (apagar)',err);}}
  toast('Atleta movida para Scouting ✓');
  closeMod();
  const ov=document.getElementById('athlete-profile-ov');if(ov)ov.remove();
  navTo('plantel');
}
function showAthleteCredsFromProfile(id){
  const at=APP.athletes.find(a=>a.id===id);if(!at)return;
  if(at.passwordHash){if(confirm('Gerar nova password para '+at.name+'?'))resetAthletePwd(id);}
  else resetAthletePwd(id);
}

function _dj_toMin(t){if(!t)return null;const p=t.split(':').map(Number);return p[0]*60+(p[1]||0);}
function _dj_toHHMM(m){if(m==null)return null;m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}

  return items;
}

function submitWellness(){
  const v=_wfVals;
  if(!v.sleep||!v.fatigue||!v.stress||!v.mood)return toast('Preenche todos os campos','err');
  const score=calcWellnessScore(v);
  const td=today();
  const existing=APP.wellness.findIndex(w=>w.athleteId===AID&&w.date===td);
  const entry={id:uid(),athleteId:AID,date:td,sleep:v.sleep,fatigue:v.fatigue,stress:v.stress,pain:v.pain||0,mood:v.mood,score,cycle:v.cycle||'N/A',cycleImpact:v.cycleImpact||0,submittedAt:new Date().toISOString()};
  if(existing>=0)APP.wellness[existing]=entry;else APP.wellness.push(entry);
  if(_sync)cloudUpsert('wellness_records',{...entry,athlete_id:entry.athleteId,club_id:_cid});
  saveData();_wfVals={sleep:0,fatigue:0,stress:0,pain:0,mood:0,cycle:'',cycleImpact:0};toast('Wellness submetido! Score: '+score+'/100');renderAtWellness();
}
function calcWellnessScore(v){
  let s=0;
  s+=(v.sleep/5)*25;
  s+=((10-v.fatigue)/9)*20;
  s+=((10-v.stress)/9)*20;
  s+=((10-v.pain)/10)*15;
  s+=(v.mood/5)*20;
  return Math.round(s);
}
function renderAtPSE(){
  const td=today();
  const already=APP.pse.filter(p=>p.athleteId===AID&&p.date===td);
  // Cada sessão do dia tem o seu próprio PSE (ex: Ginásio + Treino principal no mesmo dia
  // geram 2 registos separados) — "já respondida" é por evento (eventId), não pelo dia
  // inteiro, senão o Ginásio "gastava" o único PSE do dia e o Treino principal ficava sem
  // nenhum (ver memória project_sps_pre_treino_ginasio, v3).
  const _answeredEvIds=new Set(already.map(p=>p.eventId).filter(Boolean));
  // ── PSE session-end check ──────────────────────────────────────────────
  const _pNow=new Date();
  const _pNowMin=_pNow.getHours()*60+_pNow.getMinutes();
  const _pDelay=parseInt(APP.config.pseDelay)||0;
  const _pAt=APP.athletes.find(a=>a.id===AID);
  const _pTrainTypes=['Treino','Treino Força','Treino Técnico','Jogo','Jogo Oficial','Jogo Treino','Jogo Amigável','Ginásio'];
  const _pEvs=APP.schedule.filter(e=>{
    if(e.date!==td||!e.time||!e.dur)return false;
    if(!_pTrainTypes.includes(e.type))return false;
    if(!e.teamId||e.teamId===_pAt?.teamId)return true;
    // Convocatória avulsa a Treino de outra equipa (guestIds no evento)
    if((e.guestIds||[]).includes(AID))return true;
    // Convocatória avulsa a Jogo de outra equipa (vive em g.convocatoria, não no evento)
    if(e.type==='Jogo'){
      const mg=APP.games.find(g=>g.date===e.date&&g.teamId===e.teamId);
      if(mg&&(mg.convocatoria||[]).includes(AID))return true;
    }
    return false;
  });
  // Treinos individuais prescritos e marcados como concluídos hoje também abrem o PSE,
  // sem o intervalo de segurança (_pDelay) usado nos treinos de equipa — aqui a própria
  // atleta reporta o fim ao clicar "Marcar como concluído", por isso o PSE abre de imediato.
  const _pDonePlans=(APP.trainingPlans||[]).filter(p=>p.athleteId===AID&&p.done&&p.doneAt===td&&p.doneTime);
  _pDonePlans.forEach(p=>_pEvs.push({id:'plan_'+p.id,title:p.title||'Treino Individual',time:p.doneTime,dur:0,isDone:true}));
  // Uma linha por sessão do dia: hora de fim prevista + se já terminou + se já tem PSE.
  const _pRows=_pEvs.map(ev=>{
    const [eh,em]=(ev.time||'00:00').split(':').map(Number);
    const endMin=eh*60+em+(ev.isDone?0:parseInt(ev.dur||90))+(ev.isDone?0:_pDelay);
    const h2=Math.floor(endMin/60),m2=endMin%60;
    return {ev,endMin,endStr:String(h2).padStart(2,'0')+':'+String(m2).padStart(2,'0'),answered:_answeredEvIds.has(ev.id),ended:_pNowMin>=endMin};
  }).sort((a,b)=>a.endMin-b.endMin);
  const _pPending=_pRows.filter(r=>!r.answered&&r.ended);
  const _pWaiting=_pRows.filter(r=>!r.answered&&!r.ended);
  const _pCurrent=_pPending.length?_pPending[0].ev:null;
  const _pUnlocked=!!_pCurrent;
  if(_pUnlocked)_psfEventId=_pCurrent.id;
  if(!_pUnlocked){
    const noSession=!_pEvs.length;
    const allDone=_pEvs.length>0&&_pWaiting.length===0;

function _resetExtraForm(){_exfVals={type:'Ginásio',pse:null,duration:'',summary:'',guidance:''};_exEditId=null;}
function submitExtraTraining(){
  const type=document.getElementById('ex-type').value;
  const dur=+document.getElementById('ex-dur').value;
  if(!dur)return toast('Duração obrigatória','err');
  if(_exfVals.pse===null||_exfVals.pse===undefined)return toast('Seleciona o PSE','err');
  const ua=Math.round(_exfVals.pse*dur);
  const summary=(document.getElementById('ex-summary').value||'').trim();
  const guidance=document.getElementById('ex-guidance').value||'';
  if(_exEditId){
    const entry=(APP.extraTrainings||[]).find(e=>e.id===_exEditId&&e.athleteId===AID);
    if(!entry)return toast('Registo não encontrado','err');
    if(!_extraEditable(entry))return toast('Já não é possível editar este registo','err');
    entry.type=type;entry.duration=dur;entry.pse=_exfVals.pse;entry.ua=ua;entry.summary=summary;entry.guidance=guidance;
    if(_sync)cloudUpsert('extra_training_records',{...entry,athlete_id:entry.athleteId,club_id:_cid});
    saveData();_resetExtraForm();toast('Registo atualizado ✓');renderAtTreino();
    return;
  }
  const entry={id:uid(),athleteId:AID,date:today(),type,duration:dur,pse:_exfVals.pse,ua,summary,guidance,submittedAt:new Date().toISOString()};
  APP.extraTrainings.push(entry);
  if(_sync)cloudUpsert('extra_training_records',{...entry,athlete_id:entry.athleteId,club_id:_cid});
  saveData();_resetExtraForm();toast(`Treino extra registado! UA: ${ua}`);renderAtTreino();
}
function editExtraTraining(id){
  const entry=(APP.extraTrainings||[]).find(e=>e.id===id&&e.athleteId===AID);
  if(!entry)return;
  if(!_extraEditable(entry))return toast('Já não é possível editar este registo','err');
  _exEditId=id;
  _exfVals={type:entry.type||'Ginásio',pse:entry.pse,duration:String(entry.duration||''),summary:entry.summary||'',guidance:entry.guidance||''};
  renderAtTreino();
}
function cancelEditExtra(){_resetExtraForm();renderAtTreino();}
async function deleteExtraTraining(id){
  const entry=(APP.extraTrainings||[]).find(e=>e.id===id&&e.athleteId===AID);
  if(!entry)return;
  if(!_extraEditable(entry))return toast('Já não é possível apagar este registo','err');
  if(!confirm('Apagar este registo de treino extra?'))return;
  APP.extraTrainings=APP.extraTrainings.filter(e=>e.id!==id);
  if(_sync&&_supa){try{await _supa.from('extra_training_records').delete().eq('id',id);}catch(err){_warnSyncFailure('extra_training_records (apagar)',err);}}

  saveData();toast('Registo apagado');renderAtTreino();
}

  const ev=(APP.schedule||[]).find(e=>e.id===eventId);if(!ev)return;

    ['Data',esc(fmtDate(ev.date))],

    ['Duração',ev.dur?ev.dur+' min':'—'],

// Confirmação de presença (RSVP) — a atleta responde Vou/Não vou por cada convocatória

let _rsvpDeclining=new Set();

function atRsvpYes(convId){

    const logistica=[c.concentracaoLocal||c.concentracaoHora?['Concentração',`${c.concentracaoHora||''} ${c.concentracaoLocal||''}`.trim()]:null,c.transporte?['Transporte',c.transporte]:null,c.refeicaoAntes?['Refeição antes',c.refeicaoAntes]:null,c.refeicaoApos?['Refeição após',c.refeicaoApos]:null].filter(Boolean);
