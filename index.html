        <div style="font-size:11px;color:var(--t2)">${fmtDate(c.date)}${g.time?' · '+g.time:''}${g.loc?' · '+escHtml(g.loc):''}</div>`:`<div style="font-size:11px;color:var(--t2)">${fmtDate(c.date)}</div>`}
        ${isStarter||isSub||isCap||isVc?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
          ${isStarter?'<span class="bdg bg-g">Titular</span>':isSub?'<span class="bdg bg-y">Suplente</span>':''}
          ${isCap?'<span class="bdg bg-b">Capitã</span>':isVc?'<span class="bdg bg-b">Vice-Capitã</span>':''}
        </div>`:''}
        ${logistica.length?`<div style="margin-top:10px;font-size:11px;color:var(--t2)">${logistica.map(([l,v])=>`<div><strong>${l}:</strong> ${escHtml(v)}</div>`).join('')}</div>`:''}
        ${(c.notes&&!(g&&c.notes==='vs '+g.opp))?`<div class="al al-b" style="margin-top:8px;font-size:11px">${escHtml(c.notes)}</div>`:''}
        ${_rsvpBlockHtml(c)}
      </div>
    </div>`;
  }).join(''):`<div class="al al-b">Sem convocatórias próximas</div>`}
  ${past.length?`<div style="margin-top:16px"><div style="font-size:12px;font-weight:700;color:var(--t2);margin-bottom:8px">Historial</div>
  ${past.map(c=>{const g=APP.games.find(x=>x.id===c.gameId);return`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--brd);font-size:12px"><span>${g?'vs '+escHtml(g.opp):'Jogo'}</span><span style="color:var(--t2)">${fmtDate(c.date)}</span></div>`;}).join('')}</div>`:''}`;
}

async function connectCloud(){
  const url=document.getElementById('supa-url')?.value?.trim();
  const key=document.getElementById('supa-key')?.value?.trim();
  let clubId=document.getElementById('supa-cid')?.value?.trim();
  if(!url||!key)return toast('URL e Anon Key obrigatórios','err');
  try{
    _supa=supabase.createClient(url,key);
    if(!clubId){
      const cn=APP.config.clubName||'Clube';
      const {data,error}=await _supa.from('clubs').select('id').eq('name',cn).maybeSingle();
      if(data){clubId=data.id;}
      else{
        const {data:d2}=await _supa.from('clubs').insert({name:cn,season:APP.config.season||'2025/26'}).select('id').single();
        if(d2)clubId=d2.id;
      }
    }
    if(!clubId)return toast('Erro ao criar clube','err');
    _cid=clubId;_sync=true;
    setSupaCfg({url,anonKey:key,clubId});
    updateCloudDot(true);
    const cidEl=document.getElementById('supa-cid');if(cidEl)cidEl.value=clubId;
    toast('☁️ Cloud ligado! A enviar dados...');
    await pushAppMeta();
    await pullCloud();
    toast('☁️ Cloud ligado e sincronizado ✓');
  }catch(e){toast('Erro: '+e.message,'err');}
}
function disconnectCloud(){

function _doPasteImport(){

// ── Proteção do Gameday contra pullCloud a sobrepor jogo ao vivo ────────────
// Incidente real (30/08/2026, jogo vs Aldeia Nova): o tablet gravou a sessão ao
// vivo inteira em localStorage (saveData() grava sempre, mesmo offline), mas ao
// voltar a ter rede, um pullCloud() automático (ver handler de visibilitychange
// mais abaixo) substituiu APP.games pela cópia antiga da cloud — sem eventos —
// e essa substituição foi logo gravada por cima do localStorage. pushAppMeta()
// já tinha proteção contra isto (staleness guard); pullCloud() nunca teve.
// _gdIsLiveUnlaunched(g) identifica um jogo "em risco": tem liveSession, ainda
// não foi lançado, e já tem sinais de atividade real (eventos, fase avançada
// ou relógio a correr) — não basta ter liveSession, porque TODOS os jogos têm
// uma liveSession em branco assim que a aba Ao Vivo é aberta (_gdInit). Ver
// memória feedback_sps_gameday_pullcloud_overwrite.
function _gdIsLiveUnlaunched(g){
  const ls=g&&g.liveSession;
  if(!ls||ls.launched)return false;
  return (ls.events&&ls.events.length>0)||ls.phase!=='pre'||!!ls.runningSince;
}
// Lista de jogos deste dispositivo com sessão ao vivo em risco (por lançar,
// com atividade). Usado tanto pelo merge do pullCloud como pelo handler de
// visibilitychange, para decidir se é seguro sincronizar em segundo plano.
function _gdLiveGamesAtRisk(){
  return (APP.games||[]).filter(_gdIsLiveUnlaunched);
}
async function pullCloud(){
  if(!_supa||!_cid)return;
  try{
    const pulls=[
      ['athletes','athletes',(d)=>APP.athletes=d.map(r=>({...r,teamId:r.team_id,passwordHash:r.password_hash||r.passwordHash,nat:r.nationality||r.nat,mustChangePwd:r.must_change_pwd!==undefined?r.must_change_pwd:r.mustChangePwd}))],
      ['wellness_records','wellness',(d)=>APP.wellness=d.map(r=>({...r,athleteId:r.athlete_id,submittedAt:r.submitted_at,cycleImpact:r.cycle_impact}))],
      ['pse_records','pse',(d)=>APP.pse=d.map(r=>({...r,athleteId:r.athlete_id,sessionType:r.session_type,submittedAt:r.submitted_at,eventId:r.event_id}))],
      ['injuries','injuries',(d)=>APP.injuries=d.map(r=>({...r,athleteId:r.athlete_id,returnDate:r.return_date,bodyPart:r.body_part,phaseDesc:r.phase_desc,registeredAt:r.registered_at}))],
      ['treatments','treatments',(d)=>APP.treatments=d.map(r=>({...r,athleteId:r.athlete_id,injuryId:r.injury_id,professionalName:r.professional_name,registeredAt:r.registered_at}))],
      ['nutrition_records','nutritionAssessments',(d)=>APP.nutritionAssessments=d.map(r=>({...r,athleteId:r.athlete_id,bodyFat:r.body_fat,registeredAt:r.registered_at}))],
      ['nutrition_plans','nutritionPlans',(d)=>APP.nutritionPlans=d.map(r=>({...r,athleteId:r.athlete_id,startDate:r.start_date,createdAt:r.created_at}))],
      ['schedule_events','schedule',(d)=>APP.schedule=d.map(r=>({...r,teamId:r.team_id,createdAt:r.created_at,horaConcentracao:r.hora_concentracao,localConcentracao:r.local_concentracao,guestIds:r.guest_ids||[],gymSheet:r.gym_sheet||null}))],
      ['training_plans','trainingPlans',(d)=>APP.trainingPlans=d.map(r=>({...r,athleteId:r.athlete_id,createdAt:r.created_at,doneAt:r.done_at,doneTime:r.done_time}))],
      ['attendance_records','attendance',(d)=>APP.attendance=d.map(r=>({...r,eventId:r.event_id,athleteId:r.athlete_id,createdAt:r.created_at}))],
      ['staff_users','users',(d)=>{APP.users=d.map(r=>({...r,isAdmin:r.is_admin,passwordHash:r.password_hash,createdAt:r.created_at,mustChangePwd:r.must_change_pwd!==undefined?r.must_change_pwd:r.mustChangePwd}));APP.users.forEach(u=>{if(u.role==='tecnico')u.role='treinador';});}],
      ['athlete_anamnesis','anamnesis',(d)=>APP.anamnesis=d.map(r=>({id:r.id,athleteId:r.athlete_id,selfReport:r.self_report||{},selfReportUpdatedAt:r.self_report_updated_at,clinicalNotes:r.clinical_notes||'',clinicalNotesUpdatedAt:r.clinical_notes_updated_at,clinicalNotesUpdatedBy:r.clinical_notes_updated_by,fisioViewedAt:r.fisio_viewed_at}))],
      // Treino Extra: registo autoiniciado pela atleta (ginásio, corrida, treino em casa...),
      // sem ligação a schedule_events — tabela dedicada própria, mesmo padrão de pse_records/
      // wellness_records (série temporal, não singleton). UA calculado mas propositadamente
      // NÃO somado ao ACWR oficial (_acwrAt só lê APP.pse) — ver project_sps_treino_extra_atleta_plano.
      ['extra_training_records','extraTrainings',(d)=>APP.extraTrainings=d.map(r=>({...r,athleteId:r.athlete_id,submittedAt:r.submitted_at}))],
      // Registos de Ginásio (Fase 2): um registo por atleta por sessão, vals[] paralelo a
      // event.gymSheet.exercises (mesmo índice = mesmo exercício). Tabela dedicada própria
      // (mesmo padrão de pse_records/attendance_records) em vez de meta blob — pode crescer
      // muito (1 linha por atleta por sessão de Ginásio). Ver project_sps_fichas_ginasio_fase2.
      ['gym_records','gymRecords',(d)=>APP.gymRecords=d.map(r=>({...r,eventId:r.event_id,athleteId:r.athlete_id,rirGeral:r.rir_geral,updatedAt:r.updated_at,vals:r.vals||[]}))]
    ];
    for(const [tbl,,setter] of pulls){
      const {data}=await _supa.from(tbl).select('*').eq('club_id',_cid);
      if(data&&data.length)setter(data);
    }
    // Segurança: se a atleta com sessão ativa neste dispositivo foi removida do plantel
    // entretanto (ex: passou para Scouting), não deixar a app continuar a tentar ler dados
    // de uma atleta que já não existe (isso partia a página em vez de reencaminhar). Força
    // logout limpo e avisa. Só se aplica a sessões de atleta — staff não é afetado.
    if(ROLE==='atleta'&&AID&&!APP.athletes.find(a=>a.id===AID)){
      toast('O teu acesso foi removido. Contacta o teu treinador.','err');
      logout();
      return;
    }
    // Pull app_meta (users, config, games, evaluations, etc.)
    const {data:clubRow,error:metaErr}=await _supa.from('clubs').select('meta,updated_at').eq('id',_cid).maybeSingle();
    const meta=clubRow&&clubRow.meta?{data:clubRow.meta}:null;
    console.log('[pullCloud] club_id=',_cid,'meta found=',!!(meta&&meta.data),'error=',metaErr);
    if(clubRow&&clubRow.updated_at)_metaSyncAt=clubRow.updated_at;
    if(meta&&meta.data){
      const m=meta.data;
      // 'users' já não vem daqui — tem tabela própria (staff_users, ver pulls acima).
      if(m.config)APP.config=Object.assign(APP.config||{},m.config);
      if(m.teams&&m.teams.length)APP.teams=m.teams;
      if(m.games&&m.games.length){
        // Nunca sobrepor um jogo com sessão ao vivo em risco (ver _gdIsLiveUnlaunched
        // acima) — mantém a versão local desse(s) jogo(s) e só aceita a versão da
        // cloud para todos os outros. Protege qualquer chamada a pullCloud (login,
        // visibilitychange, botão Sincronizar), não só o caso que causou o incidente.
        const atRisk=_gdLiveGamesAtRisk();
        if(atRisk.length){
          const atRiskIds=new Set(atRisk.map(g=>g.id));
          console.warn('[pullCloud] '+atRisk.length+' jogo(s) com sessão ao vivo em risco — a preservar localmente:',[...atRiskIds]);
          APP.games=[...m.games.filter(g=>!atRiskIds.has(g.id)),...atRisk];
        } else {
          APP.games=m.games;
        }
      }
      if(m.evaluations)APP.evaluations=m.evaluations;
      if(m.evalPeriods)APP.evalPeriods=m.evalPeriods;
      if(m.evalResponses){APP.evalResponses=m.evalResponses;console.log('[pullCloud] evalResponses=',m.evalResponses.length);}
      if(m.trainings)APP.trainings=m.trainings;
      // NOTA: schedule NÃO é lido daqui de propósito — schedule_events (tabela dedicada,
      // já puxada acima) é a fonte de verdade. meta.schedule é só um backup legado escrito
      // por pushAppMeta; deixá-lo sobrepor aqui fazia o pull reverter para dados desatualizados
      // sempre que a tabela schedule_events fosse editada fora do fluxo normal da app.
      if(m.convocatorias)APP.convocatorias=m.convocatorias;
      if(m.scouting)APP.scouting=m.scouting;
      if(m.microcycles)APP.microcycles=m.microcycles;
      if(m.sessions)APP.sessions=m.sessions;
      if(m.exercises&&m.exercises.length)APP.exercises=m.exercises;
      if(m.gymSheets)APP.gymSheets=m.gymSheets;
      toast('Sincronizado ✓');
    } else {
      toast('Cloud: sem dados de meta (club_id='+_cid+')','err');
    }
    saveData();
    if(ROLE!=='atleta'&&_curPg)navTo(_curPg);
  }catch(e){console.warn('pullCloud error',e);toast('Erro sync: '+e.message,'err');}
}
async function pushAppMeta(_pushRetry){
  if(!_supa||!_cid){console.log('[pushAppMeta] skipped: supa=',!!_supa,'cid=',_cid);return;}
  try{
    // Guarda contra cópias desatualizadas: este separador pode ter ficado aberto horas
    // (ou dias) sem recarregar, com um APP.games/evaluations/etc. antigo em memória. Se
    // gravássemos sempre por cima sem verificar, qualquer alteração feita por outra pessoa
    // desde o último pull deste separador seria apagada em silêncio (já aconteceu: 36 jogos
    // de Campeonato/Taça perdidos em 2026-08-18 — ver memória feedback_sps_meta_staleness_guard).
    // Verificação leve (1 SELECT) antes de cada gravação do blob inteiro.
    try{
      const {data:chk}=await _supa.from('clubs').select('updated_at').eq('id',_cid).maybeSingle();
      if(chk&&chk.updated_at&&_metaSyncAt&&new Date(chk.updated_at).getTime()>new Date(_metaSyncAt).getTime()+2000){
        console.warn('[pushAppMeta] cloud mais recente que a última sincronização deste separador — a fundir com a alteração local antes de gravar');
        // ATENÇÃO (2026-08-18, sps-v22): a versão anterior desta guarda fazia só pullCloud()
        // e ABORTAVA — o que apagava em silêncio qualquer alteração local ainda não gravada
        // (ex: uma atleta submetia a autoavaliação, outra sessão tinha mexido na cloud entretanto,
        // e o pullCloud() sobrescrevia APP.evalResponses ANTES da autoavaliação alguma vez chegar
        // à cloud — a atleta via "submetida" no ecrã mas ao reabrir voltava a pedir para preencher).
        // Corrigido: guarda-se um snapshot dos arrays locais, deixa-se o pullCloud atualizar tudo
        // com os dados frescos de outras sessões, e depois qualquer item que exista no snapshot
        // local substitui (por id) o equivalente vindo da cloud — a alteração que disparou este
        // push nunca se perde, e o que outras sessões acrescentaram entretanto também não. Ver
        // memória feedback_sps_meta_staleness_guard / feedback_sps_meta_local_change_lost_on_merge.
        const _localSnap={
          games:APP.games||[], evaluations:APP.evaluations||[], evalPeriods:APP.evalPeriods||[],
          evalResponses:APP.evalResponses||[], trainings:APP.trainings||[], convocatorias:APP.convocatorias||[],
          scouting:APP.scouting||[], microcycles:APP.microcycles||[], sessions:APP.sessions||[],
          exercises:APP.exercises||[], gymSheets:APP.gymSheets||[]
        };
        await pullCloud();
        Object.keys(_localSnap).forEach(key=>{
          const fresh=APP[key]||[];
          const local=_localSnap[key]||[];
          const localIds=new Set(local.filter(x=>x&&x.id).map(x=>x.id));
          const deletedIds=_pendingDeletes[key]||new Set();
          // Um item da cloud só sobrevive ao merge se não tiver sido também editado
          // (localIds — a versão local ganha) nem apagado (deletedIds) nesta sessão.
          const keep=fresh.filter(f=>!f||!f.id||(!localIds.has(f.id)&&!deletedIds.has(f.id)));
          APP[key]=[...keep,...local];
        });
        saveData();
        if(!_pushRetry)return pushAppMeta(true);
        console.warn('[pushAppMeta] staleness persistente mesmo após fusão — a gravar mesmo assim para não bloquear o utilizador');
      }
    }catch(e){console.warn('[pushAppMeta] staleness check falhou, a prosseguir mesmo assim',e);}
    console.log('[pushAppMeta] pushing for club_id=',_cid,'evalResponses=',((APP.evalResponses||[]).length));
    // NOTA (2026-08-18): 'users' deixou de fazer parte deste blob — tem tabela própria
    // (staff_users), exatamente como 'athletes'. Motivo: qualquer dispositivo com uma cópia
    // desatualizada de APP.users em memória (ex: telemóvel de atleta com a app aberta há

// Aviso visível de falha de sync: até aqui, um erro em cloudUpsert só ia para
// console.warn — a atleta/staff nunca sabia que um registo não tinha chegado à cloud
// (o dado ficava só local, sujeito a perder-se se o dispositivo fosse trocado/limpo).
// Throttle de 10s para não inundar de toasts em cascata se a rede cair a meio de uma
// sequência de gravações (ex: várias atletas a submeter PSE ao mesmo tempo).
let _lastSyncErrToast=0;
function _warnSyncFailure(table,err){
  console.warn('cloudUpsert error',table,err);
  const now=Date.now();
  if(now-_lastSyncErrToast<10000)return;
  _lastSyncErrToast=now;
  toast('⚠️ Falha ao sincronizar com a cloud — o registo ficou guardado só neste dispositivo. Tenta novamente quando tiveres rede.','err');
}
async function cloudUpsert(table,row){
  if(!_supa||!_cid)return;
  try{
    const schema=_CLOUD_TABLE_SCHEMA[table];
    let payload;
    if(schema){
      const src={...row};
      // Sempre que o objeto local tem as duas formas (ex: passwordHash E password_hash,
      // porque pullCloud() faz spread(r) + campos camelCase por cima), o valor camelCase
      // é sempre o mais atual — quem chama cloudUpsert acabou de o mutar. Sobrepor sempre
      // (não só quando o campo snake_case está undefined), senão o valor antigo vindo do
      // último pull "ganha" silenciosamente e a atualização nunca chega à cloud.
      Object.keys(schema.rename||{}).forEach(k=>{ if(src[k]!==undefined)src[schema.rename[k]]=src[k]; });
      payload={club_id:_cid};
      schema.cols.forEach(c=>{ if(src[c]!==undefined)payload[c]=src[c]; });
    } else {
      payload={...row,club_id:_cid};
    }
    // supabase-js só rejeita a promise em falhas de rede/transporte — um erro devolvido
    // pela API (RLS, coluna em falta, constraint) vem em {error} sem lançar exceção, por
    // isso o try/catch sozinho não chegava para apanhar esse caso.
    const {error}=await _supa.from(table).upsert(payload,{onConflict:'id'});
    if(error){_warnSyncFailure(table,error);return;}
  }catch(e){_warnSyncFailure(table,e);return;}
  // Also push app meta to keep config/games/etc in sync (users NÃO está aqui, tem tabela própria)
  pushAppMeta();
}

    if(document.visibilityState==='visible'&&_hiddenAt&&(Date.now()-_hiddenAt)>60000){
      if(_sync&&_supa&&_cid&&(ROLE||AID)){
        // Incidente 30/08/2026 (jogo vs Aldeia Nova): este pull silencioso apanhou
        // um tablet a meio de um jogo do Gameday e apagou a sessão ao vivo local
        // (ver _gdIsLiveUnlaunched acima). O merge protetor do pullCloud já evita
        // a perda de dados mesmo que este pull corra, mas mais vale nem tentar —
        // se há um jogo ao vivo em risco neste aparelho, o mais seguro é ENVIAR
        // (pushAppMeta) em vez de TRAZER (pullCloud) enquanto o jogo não é lançado.
        if(_gdLiveGamesAtRisk().length){pushAppMeta().catch(()=>{});}
        else pullCloud().catch(()=>{});
      }
    }
    _hiddenAt=null;
  });
})();

// ── Enviar assim que a rede volta, durante um jogo ao vivo ──────────────────
// Complemento ao ponto acima: não espera pelo separador voltar a ficar visível
// (pode passar o jogo inteiro em segundo plano se ninguém tocar no aparelho).
// O evento 'online' do browser dispara assim que a ligação volta, mesmo com o
// ecrã bloqueado nalguns aparelhos — aproveita para tentar enviar logo os dados
// do jogo em vez de esperar pelo próximo pullCloud automático. Ver
// _gdIsLiveUnlaunched / feedback_sps_gameday_pullcloud_overwrite.
window.addEventListener('online',()=>{
  if(_sync&&_supa&&_cid&&_gdLiveGamesAtRisk().length)pushAppMeta().catch(()=>{});
});

// ─── FASE 2 + 3: LINK/TOKEN + AUTH SIMPLIFICADA ─────────────────────────────

// ── Sessão persistente da atleta ──────────────────────────────────────────────
var AT_SESS_KEY = '_sps_at_sess';

function _getAtSess(){
  try{ return JSON.parse(localStorage.getItem(AT_SESS_KEY)||'null'); }catch(e){return null;}
}
function _setAtSess(data){
  localStorage.setItem(AT_SESS_KEY, JSON.stringify(data));
}
function _clearAtSess(){
  localStorage.removeItem(AT_SESS_KEY);
}

// ── Token ─────────────────────────────────────────────────────────────────────
function _atletaToken(at){
  var seed = at.passwordHash ? at.id+':'+at.passwordHash.slice(0,16) : at.id+':'+at.id;
  try{ return btoa(seed).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_'); }
  catch(e){ return btoa(unescape(encodeURIComponent(seed))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_'); }
}

function _atletaLink(at){
  var base = location.href.split('?')[0];
  var tok  = _atletaToken(at);
  var n    = encodeURIComponent(at.name||'');
  var p    = encodeURIComponent(at.pos||'');
  var num  = encodeURIComponent(at.num||'');
  return base+'?a='+at.id+'&t='+tok+'&n='+n+'&p='+p+'&num='+num;
}

// ── Verificar token na URL ─────────────────────────────────────────────────────
function _checkAtletaToken(){
  var params = new URLSearchParams(location.search);
  var aid    = params.get('a');
  var tok    = params.get('t');
  if(!aid || !tok) return false;

  // Se já tem sessão activa para este atleta — auto-login sem pedir password
  var existing = _getAtSess();
  if(existing && existing.role==='atleta' && existing.userId===aid){
    var atEx = APP.athletes.find(function(a){return a.id===aid;});
    if(atEx){
      AID=atEx.id; ROLE='atleta';
      setSession(existing);
      window.history.replaceState({},'',location.pathname);
      showAtletaApp(atEx);
      return true;
    }
    // Atleta não encontrada localmente — tentar via Supabase
    if(_supa && _cid){
      window.history.replaceState({},'',location.pathname);
      pullCloud().then(function(){
        var atCloud=APP.athletes.find(function(a){return a.id===aid;});
        if(atCloud){AID=atCloud.id;ROLE='atleta';setSession(existing);showAtletaApp(atCloud);}
        else{document.getElementById('screen-login').style.display='flex';renderLoginScreen();}
      }).catch(function(){document.getElementById('screen-login').style.display='flex';renderLoginScreen();});
      return true;
    }
  }

  // Tentar encontrar atleta localmente
  var at = APP.athletes.find(function(a){ return a.id===aid; });
  var isReset = false;

  if(at){
    // Validar token — se não bate é novo link do técnico (reset)
    isReset = (tok !== _atletaToken(at));
  } else {
    // Sem dados locais — usar params do URL
    var nome = params.get('n')||'Atleta';
    var pos  = params.get('p')||'';
    var num  = params.get('num')||'';
    at = {id:aid, name:decodeURIComponent(nome), pos:decodeURIComponent(pos), num:decodeURIComponent(num), photo:'', _fromUrl:true};
    isReset = true; // sem dados locais = tratar como primeiro acesso
  }

  _showWelcomeScreen(at, tok, isReset);
  return true;
}

// ── Criar password (1º acesso ou reset) ──────────────────────────────────────
async function _welcomeCriarPass(aid, tok){
  var pwd1 = (document.getElementById('ws-pwd1')||{}).value||'';
  var pwd2 = (document.getElementById('ws-pwd2')||{}).value||'';
  var err  = document.getElementById('ws-err');
  if(pwd1.length < 6){if(err)err.textContent='Mínimo 6 caracteres.';return;}
  if(pwd1 !== pwd2){if(err)err.textContent='As passwords não coincidem.';return;}
  if(err) err.textContent='';

  var ws = document.getElementById('welcome-screen');
  var btn = ws ? ws.querySelector('button') : null;
  if(btn){btn.textContent='A guardar...';btn.disabled=true;}

  var hash = await hashPwd(pwd1);

  // Aguardar Supabase inicializar (máx 4 segundos)
  for(var i=0; i<8; i++){
    if(_supa && _cid) break;
    await new Promise(function(r){setTimeout(r,500);});
  }

  // Tentar encontrar atleta nos dados locais ou via Supabase
  var at = APP.athletes.find(function(a){return a.id===aid;});
  if(!at && _supa && _cid){
    try{ await pullCloud(); }catch(e){}
    at = APP.athletes.find(function(a){return a.id===aid;});
  }

  // Fallback: usar dados do URL se Supabase não disponível
  if(!at){
    var params = new URLSearchParams(location.search);
    var nome = params.get('n')||'Atleta';
    var pos  = params.get('p')||'';
    var num  = params.get('num')||'';
    at = {id:aid, name:decodeURIComponent(nome), pos:decodeURIComponent(pos), num:decodeURIComponent(num), photo:'', passwordHash:hash, mustChangePwd:false};
    APP.athletes.push(at);
    saveData();
  } else {
    at.passwordHash = hash;
    at.mustChangePwd = false;
    saveData();
    if(_sync && _cid) await cloudUpsert('athletes',{...at, club_id:_cid, team_id:at.teamId});
  }

  // Sessão persistente
  var sessData = {userId:aid, role:'atleta', name:at.name};
  AID=aid; ROLE='atleta';
  setSession(sessData);
  _setAtSess(sessData);

  ws = document.getElementById('welcome-screen');
  if(ws) ws.remove();
  window.history.replaceState({},'',location.pathname);
  showAtletaApp(at);
}

// ── Entrar com password existente ─────────────────────────────────────────────
async function _welcomeEntrar(aid){
  var pwd = (document.getElementById('ws-pwd')||{}).value||'';
  var err = document.getElementById('ws-err');
  if(!pwd){if(err)err.textContent='Introduz a tua password.';return;}

  var at = APP.athletes.find(function(a){return a.id===aid;});
  if(!at){
    var ws2 = document.getElementById('welcome-screen');
    if(ws2){var btn2=ws2.querySelector('button');if(btn2){btn2.textContent='A verificar...';btn2.disabled=true;}}
    // Aguardar Supabase (máx 4s)
    for(var i=0; i<8; i++){
      if(_supa && _cid) break;
      await new Promise(function(r){setTimeout(r,500);});
    }
    try{ await pullCloud(); }catch(e){}
    at = APP.athletes.find(function(a){return a.id===aid;});
  }

  if(!at){
    if(err) err.textContent='Não foi possível carregar os dados. Tenta de novo.';
    var ws=document.getElementById('welcome-screen');
    if(ws){var btn=ws.querySelector('button');if(btn){btn.textContent='Entrar →';btn.disabled=false;}}
    return;
  }

  var hash = await hashPwd(pwd);
  if(hash !== at.passwordHash){
    if(err) err.textContent='Password incorreta.';
    var inp = document.getElementById('ws-pwd');
    if(inp){inp.value='';inp.focus();}
    var btn = document.querySelector('#welcome-screen button');
    if(btn){btn.textContent='Entrar →';btn.disabled=false;}
    return;
  }

  // Password correta
  var sessData = {userId:aid, role:'atleta', name:at.name};
  AID=aid; ROLE='atleta';
  setSession(sessData);
  _setAtSess(sessData);

  var ws = document.getElementById('welcome-screen');
  if(ws) ws.remove();
  window.history.replaceState({},'',location.pathname);
  showAtletaApp(at);
}
