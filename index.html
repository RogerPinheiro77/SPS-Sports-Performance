<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Sport Performance Platform</title>
<link rel="icon" type="image/jpeg" href="assets/logo_sps.jpg">
<link id="pwa-manifest" rel="manifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SPS">
<meta name="theme-color" content="#1d6f3b">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  --c1:#1d6f3b;--c1d:#155c2f;--c1l:#27a34a;
  --acc:#f59e0b;--red:#dc2626;--yel:#d97706;--grn:#16a34a;--blu:#0284c7;--prp:#7c3aed;--tea:#0e6251;
  --bg0:#0c0f14;--bg1:#131720;--bg2:#1a1f2c;--bg3:#222838;--bg4:#2a3145;
  --brd:#2e3550;--t1:#e8edf5;--t2:#94a3b8;--t3:#5a6582;
  --sw:242px;--th:54px;--r:10px;--rs:6px;--rx:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg0);color:var(--t1);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
a{text-decoration:none;color:inherit}
ul{list-style:none}
*{scrollbar-width:thin;scrollbar-color:var(--bg4) transparent}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}

/* LOGIN */
#screen-login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,rgba(29,111,59,.3) 0%,var(--bg0) 65%);padding:20px}
.login-card{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rx);padding:36px 28px;width:100%;max-width:420px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.login-brand{width:76px;height:76px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c1l));display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:34px;box-shadow:0 0 30px rgba(29,111,59,.4)}
.login-brand img{width:100%;height:100%;object-fit:cover}
.login-title{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--t2);margin-bottom:26px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.role-card{padding:15px 10px;border-radius:var(--r);background:var(--bg3);border:2px solid var(--brd);color:var(--t2);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:all .2s}
.role-card:hover{border-color:var(--c1);color:var(--t1)}
.role-card.sel{border-color:var(--c1);background:rgba(29,111,59,.15);color:var(--c1l)}
.role-card .ri{font-size:25px}
#athlete-picker{display:none;text-align:left}
#athlete-picker.show{display:block}
.fg{margin-bottom:12px}
.lbl{display:block;font-size:10px;font-weight:700;color:var(--t2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.ctrl{width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--brd);border-radius:var(--rs);color:var(--t1);font-size:13px;transition:border-color .2s}
.ctrl:focus{border-color:var(--c1)}
.btn-login{width:100%;padding:12px;background:linear-gradient(135deg,var(--c1),var(--c1l));color:#fff;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;border:none;margin-top:10px;transition:opacity .2s;box-shadow:0 4px 15px rgba(29,111,59,.3)}
.btn-login:hover{opacity:.9}
.btn-login:disabled{opacity:.45;cursor:not-allowed}
.login-err{color:#f87171;font-size:11px;min-height:16px;margin:6px 0 2px;text-align:left}
.login-divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--t3);font-size:11px}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--brd)}
.link-btn{background:none;border:none;color:var(--t2);font-size:11px;cursor:pointer;padding:4px;text-decoration:underline;text-underline-offset:2px}
.link-btn:hover{color:var(--t1)}
.user-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--brd);font-size:12px}
.user-role-badge{padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700}
.urb-tec{background:#1d6f3b33;color:#4caf76}
.urb-tecadj{background:#0e625133;color:#3ecfae}
.urb-prep{background:#b8860b33;color:#e0c040}
.urb-gr{background:#2d4f9c33;color:#7a9ce8}
.urb-fis{background:#e07b3922;color:#f0a060}
.urb-nut{background:#9c5ae022;color:#c080f0}
.urb-tm{background:#0c7b9333;color:#5cd0e8}
.urb-dir{background:#5b5f6633;color:#a7acb3}
.urb-atl{background:#0284c722;color:#60b0f0}
.cred-box{background:var(--bg3);border:1px solid var(--brd);border-radius:8px;padding:14px;margin:10px 0;font-size:12px;font-family:monospace;word-break:break-all}
.btn-login:disabled{opacity:.35;cursor:not-allowed}

/* STAFF SHELL */
#staff-app{display:none;min-height:100vh}
#staff-app.on{display:flex}
#sidebar{width:var(--sw);background:var(--bg1);border-right:1px solid var(--brd);height:100vh;position:fixed;left:0;top:0;overflow-y:auto;z-index:200;display:flex;flex-direction:column;transition:transform .3s}
.sb-brand{padding:15px 13px 13px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px;flex-shrink:0}
.sb-logo{width:33px;height:33px;border-radius:8px;background:linear-gradient(135deg,var(--c1),var(--c1l));display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.sb-club{font-size:12px;font-weight:800;line-height:1.3}
.sb-season{font-size:10px;color:var(--t2)}
.sb-nav{flex:1;padding:9px 7px;overflow-y:auto}
.sb-sec{margin-bottom:4px}
.sb-sl{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:1px;padding:7px 9px 3px}
.nb{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:var(--rs);font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .15s;margin-bottom:1px;width:100%}
.nb:hover{background:var(--bg3);color:var(--t1)}
.nb.on{background:rgba(29,111,59,.18);color:var(--c1l);font-weight:700}
.nb .ic{font-size:14px;width:17px;text-align:center;flex-shrink:0}
.nb-bdg{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:10px}
.sb-foot{padding:9px 7px;border-top:1px solid var(--brd);flex-shrink:0}
.sb-user{display:flex;align-items:center;gap:8px;padding:7px;border-radius:var(--rs);cursor:pointer}
.sb-user:hover{background:var(--bg3)}
.sb-av{width:29px;height:29px;border-radius:50%;background:var(--c1);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.sb-un{font-size:11px;font-weight:700}
.sb-ur{font-size:9px;color:var(--t2)}
.sb-cloud{margin-left:auto;font-size:10px}
#main{margin-left:var(--sw);flex:1;min-width:0;overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:var(--th);background:var(--bg1);border-bottom:1px solid var(--brd);padding:0 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;flex-shrink:0}
.topbar-title{font-size:14px;font-weight:800;flex:1}
.tb-btn{width:31px;height:31px;border-radius:var(--rs);background:var(--bg3);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--t2);cursor:pointer;transition:all .2s}
.tb-btn:hover{color:var(--t1);border-color:var(--c1)}
.pg-content{padding:20px;flex:1;min-width:0}
.pg{display:none}.pg.on{display:block}
/* SPS-Gameday standalone (?gameday=1, sps-v78) — entra direto na lista de Jogos, sem
   o resto da plataforma à volta; sidebar escondida, topbar reduzida a título+Sair. */
.gd-mode #sidebar{display:none}
.gd-mode #main{margin-left:0}
.gd-mode #tb-cfg-btn,.gd-mode .tb-btn[onclick="toggleSb()"]{display:none}
.gd-only{display:none}
.gd-mode .gd-only{display:flex}
/* SPS-Ginásio standalone (?ginasio=1) — mesmo padrão do gd-mode acima: sidebar
   escondida, topbar reduzida a título + atalhos Registo/Biblioteca/Sair. */
.gy-mode #sidebar{display:none}
.gy-mode #main{margin-left:0}
.gy-mode #tb-cfg-btn,.gy-mode .tb-btn[onclick="toggleSb()"]{display:none}
.gy-only{display:none}
.gy-mode .gy-only{display:flex}
#sb-backdrop{display:none}
/* Campo tocável do Ao Vivo — maior em tablet/desktop (mais espaço, toque mais preciso),
   compacto em telemóvel. A escala é feita pelo viewBox do SVG, não pelas coordenadas. */
/* Campo tocável do Ao Vivo (27/08/2026) — em vez de um limite fixo em px,
   a largura acompanha o ecrã: o menor entre 94% da largura visível, a altura
   disponível convertida pelo rácio do campo (300:420), ou 480px como teto de
   conforto. Cresce sozinho com o ecrã em qualquer orientação, sem saltos entre
   tamanhos fixos. */
.gd-pitch-wrap{width:min(94vw,62vh*0.7143,480px);transition:transform .2s ease}
.gd-pitch-wrap.rotated{transform:rotate(180deg)}
.gd-live-wrap{display:flex;flex-direction:column;gap:4px}
.gd-pitch-col{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.gd-pitch-col>.gd-pitch-rot-row{text-align:center}
.gd-info-col{min-width:0}
/* Em paisagem (ecrã mais largo que alto, com largura suficiente para 2 colunas),
   o campo passa para uma coluna à esquerda a aproveitar quase toda a altura
   disponível, e a informação (relógio/controlos/contagens/cronologia) passa
   para uma coluna à direita com scroll próprio — em vez de tudo empilhado por
   baixo como em retrato. Só telemóveis pequenos em paisagem (<680px) continuam
   empilhados, para não espremer as duas colunas a um tamanho inútil. */
@media(orientation:landscape) and (min-width:680px){
  .gd-pitch-wrap{width:min(48vw,84vh*0.7143,480px)}
  .gd-live-wrap{flex-direction:row;align-items:flex-start;gap:16px}
  .gd-pitch-col{flex:0 0 auto}
  .gd-info-col{flex:1;min-width:0;max-height:92vh;overflow-y:auto;padding-right:2px}
}
/* Em modo Gameday, botão de saída maior — usado de pé, no banco, muitas vezes com pressa. */
.gd-mode .tb-btn{width:38px;height:38px}
/* Em modo Ginásio, mesmo motivo — usado de pé, no ginásio, com o telemóvel na mão. */
.gy-mode .tb-btn{width:38px;height:38px}

/* CARDS */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:14px 15px;transition:border-color .2s}
.kpi-lbl{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.kpi-val{font-size:28px;font-weight:900;line-height:1}
.kpi-sub{font-size:10px;color:var(--t2);margin-top:4px}
.kpi.red{border-color:rgba(220,38,38,.4)}.kpi.yel{border-color:rgba(217,119,6,.4)}.kpi.grn{border-color:rgba(22,163,74,.4)}.kpi.blu{border-color:rgba(2,132,199,.4)}
.card{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r)}
.ch{padding:13px 17px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ct{font-size:13px;font-weight:800}
.cb{padding:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--rs);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;border:none}
.btn-sm{padding:5px 9px;font-size:11px}
.btn-xs{padding:3px 7px;font-size:10px}
.btn-g{background:var(--c1);color:#fff}.btn-g:hover{background:var(--c1l)}
.btn-gh{background:var(--bg3);color:var(--t1);border:1px solid var(--brd)}.btn-gh:hover{border-color:var(--c1);color:var(--c1l)}
.btn-r{background:rgba(220,38,38,.15);color:#f87171;border:1px solid rgba(220,38,38,.25)}.btn-r:hover{background:rgba(220,38,38,.25)}
.btn-y{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.25)}
.btn-icon{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--rs)}

/* FORMS */
.form-g{margin-bottom:11px}
.fl{display:block;font-size:10px;font-weight:700;color:var(--t2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.fc{width:100%;padding:8px 11px;background:var(--bg3);border:1px solid var(--brd);border-radius:var(--rs);color:var(--t1);font-size:12px;transition:border-color .2s}
.fc:focus{border-color:var(--c1)}
textarea.fc{resize:vertical;min-height:68px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.fr4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:9px}
.ipanel{background:var(--bg3);border:1px solid var(--brd);border-radius:var(--r);padding:16px;margin-bottom:16px}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{text-align:left;padding:8px 10px;font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--brd);white-space:nowrap}
tbody tr{border-bottom:1px solid rgba(255,255,255,.04);transition:background .1s}
tbody tr:hover{background:rgba(255,255,255,.03)}
tbody td{padding:8px 10px;color:var(--t1);vertical-align:middle}

/* BADGES */
.bdg{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.bg-g{background:rgba(22,163,74,.2);color:#4ade80}.bg-r{background:rgba(220,38,38,.2);color:#f87171}
.bg-y{background:rgba(245,158,11,.2);color:#fbbf24}.bg-b{background:rgba(2,132,199,.2);color:#38bdf8}
.bg-p{background:rgba(124,58,237,.2);color:#a78bfa}.bg-gr{background:rgba(100,116,139,.2);color:#94a3b8}
.bg-o{background:rgba(234,88,12,.2);color:#fb923c}.bg-t{background:rgba(14,98,81,.3);color:#2dd4bf}

/* TABS */
.tabs{display:flex;gap:2px;background:var(--bg3);border-radius:var(--rs);padding:3px;margin-bottom:16px;flex-wrap:wrap}
.tab-btn{padding:6px 12px;border-radius:4px;font-size:11px;font-weight:700;color:var(--t2);cursor:pointer;transition:all .15s;white-space:nowrap}
.tab-btn.on{background:var(--bg2);color:var(--t1)}
.tp{display:none}.tp.on{display:block}

/* ALERTS */
.al{padding:10px 13px;border-radius:var(--rs);font-size:12px;margin-bottom:9px;display:flex;align-items:flex-start;gap:7px;line-height:1.5}
.al-r{background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.3);color:#f87171}
.al-y{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#fbbf24}
.al-g{background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.3);color:#4ade80}
.al-b{background:rgba(2,132,199,.1);border:1px solid rgba(2,132,199,.3);color:#38bdf8}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.mbox{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:20px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.mbox.lg{max-width:680px}.mbox.xl{max-width:860px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.mt{font-size:14px;font-weight:800}
.mx{width:25px;height:25px;border-radius:var(--rs);background:var(--bg3);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--t2);cursor:pointer}
.mx:hover{color:var(--t1)}

/* PLANTEL GRID */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:11px}
.at-card{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:13px;text-align:center;cursor:pointer;transition:all .2s}
.at-card:hover{border-color:var(--c1);transform:translateY(-2px)}
.at-card.inj{border-color:rgba(220,38,38,.4)}
.at-av{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c1l));margin:0 auto 9px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;overflow:hidden}
.at-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.at-name{font-size:11px;font-weight:700;margin-bottom:2px;line-height:1.3}
.at-pos{font-size:10px;color:var(--t2)}
.at-num{font-size:10px;color:var(--c1l);font-weight:800;margin-top:1px}
.wdots{display:flex;gap:3px;justify-content:center;margin-top:4px}
.wd{width:8px;height:8px;border-radius:50%}
.wdg{background:#4ade80}.wdy{background:#fbbf24}.wdr{background:#f87171}.wd0{background:var(--bg4)}

/* CALENDAR */
.cal-wrap{overflow-x:auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;min-width:560px}
.cal-hdr{text-align:center;font-size:10px;font-weight:700;color:var(--t2);padding:5px 0}
.cal-day{min-height:82px;padding:5px;border-radius:5px;background:var(--bg3);border:1px solid var(--brd);cursor:pointer}
.cal-day:hover{border-color:var(--bg4)}
.cal-day.today{border-color:var(--c1)}
.cal-day.dim{opacity:.3}
.cal-day.tall{min-height:260px}
.cal-dn{font-size:10px;color:var(--t2);font-weight:700;margin-bottom:3px}
.cal-dn-wk{font-size:9px;color:var(--t2);font-weight:600;text-transform:uppercase;margin-bottom:2px}
.cal-ev{border-radius:3px;padding:1px 4px;margin-bottom:2px;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-day.tall .cal-ev{white-space:normal;font-size:10px;padding:3px 5px}

/* MICROCICLOS */
.mc-wrap{overflow-x:auto}
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;min-width:700px}
.mc-day{background:var(--bg3);border:1px solid var(--brd);border-radius:var(--rs);padding:7px;min-height:105px}
.mc-dn{font-size:9px;font-weight:800;color:var(--t2);margin-bottom:5px;text-transform:uppercase}
.mc-sess{border-radius:3px;padding:3px 5px;margin-bottom:3px;font-size:10px;line-height:1.4;cursor:pointer}
.mc-sess:hover{opacity:.85}
.mc-add{color:var(--t3);font-size:10px;cursor:pointer;margin-top:3px;display:flex;align-items:center;gap:2px}
.mc-add:hover{color:var(--c1l)}

/* SESSION COLORS */
.s-tac{background:rgba(26,82,118,.6);color:#7fb3d6}.s-fis{background:rgba(125,60,152,.6);color:#c39bd3}
.s-tec{background:rgba(26,92,53,.6);color:#7dcea0}.s-ati{background:rgba(183,119,13,.6);color:#f9e79f}
.s-rec{background:rgba(46,134,193,.5);color:#85c1e9}.s-jog{background:rgba(123,36,28,.6);color:#f1948a}
.s-fol{background:rgba(90,90,90,.4);color:#aaa}.s-nut{background:rgba(14,98,81,.5);color:#76d7c4}
.s-fio{background:rgba(26,35,126,.5);color:#9fa8da}.s-reu{background:rgba(147,81,22,.5);color:#f0b27a}

/* PHASE BAR */
.pbar{display:flex;gap:3px;margin:5px 0}
.ps{flex:1;height:5px;border-radius:3px;background:var(--bg4)}
.ps.done{background:var(--c1)}.ps.now{background:var(--acc)}

/* STARS */
.stars{display:inline-flex;gap:2px}
.star{font-size:13px;cursor:pointer;color:var(--t3)}.star.on{color:var(--acc)}

/* CHART */
.chart-wrap{position:relative;width:100%}
.chart-wrap canvas{max-height:240px}

/* MEAL PLAN */
.meal{background:var(--bg3);border:1px solid var(--brd);border-radius:var(--rs);padding:10px;margin-bottom:8px}
.meal-n{font-size:12px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.meal-f{font-size:11px;color:var(--t2);line-height:1.7;white-space:pre-line}
.macros{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.mac{background:var(--bg4);border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700}

/* SECTION HEADER */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.sh-t{font-size:14px;font-weight:800}
.sh-a{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

/* EMPTY STATE */
.empty{text-align:center;padding:36px 20px;color:var(--t2)}
.empty .ei{font-size:40px;margin-bottom:9px}
.empty p{font-size:13px}
.esub{font-size:11px;color:var(--t3);margin-top:4px}

/* TOAST */
#toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--brd);border-radius:var(--rs);padding:8px 16px;font-size:12px;font-weight:700;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 8px 25px rgba(0,0,0,.4);white-space:nowrap}
#toast.show{opacity:1}
#toast.ok{border-color:var(--grn);color:#4ade80}
#toast.err{border-color:var(--red);color:#f87171}

/* SPIN */
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--bg4);border-top-color:var(--c1);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}

/* DIA DE JOGO — card em destaque no Início da app da atleta */
.at-gameday-card{animation:gdPulse 2.4s ease-in-out infinite}
@keyframes gdPulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.35)}50%{box-shadow:0 0 0 6px rgba(220,38,38,0)}}

/* PROGRESS */
.prog-bar{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-top:4px}
.prog-fill{height:100%;border-radius:3px;background:var(--c1);transition:width .4s}

/* ATLETA APP — paleta dourado (primário) + verde (secundário) do Moreirense, isolada do dashboard técnico */
#atleta-app{
  --c1:#C9A227;--c1d:#9C7D14;--c1l:#E3BF4A;
  --ags:#1F7A34;--agsl:#4ADE80;
  display:none;min-height:100vh;background:var(--bg0);max-width:500px;margin:0 auto;position:relative;padding-bottom:66px;
}
#atleta-app.on{display:block}
.at-topbar{background:var(--bg1);border-bottom:1px solid var(--brd);padding:12px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.at-topbar .atn{font-size:14px;font-weight:800;flex:1}
.at-topbar .atd{font-size:10px;color:var(--t2)}
.at-content{padding:13px}
.at-page{display:none}.at-page.on{display:block}
.at-bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:var(--bg1);border-top:1px solid var(--brd);display:flex;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;z-index:100}
.at-bnav::-webkit-scrollbar{display:none}
.at-ni{flex:0 0 auto;min-width:56px;padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;color:var(--t3);cursor:pointer;transition:color .15s}
.at-ni.on{color:var(--c1l)}
.at-ni .ic{font-size:18px;line-height:1}

/* Wellness form */
.wf-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--brd)}
.wf-row:last-child{border-bottom:none}
.wf-l{font-size:12px;font-weight:700}
.wf-s{font-size:10px;color:var(--t2);margin-top:1px}
.wf-sc{display:flex;gap:3px}
.wsb{width:29px;height:29px;border-radius:var(--rs);background:var(--bg3);border:1px solid var(--brd);font-size:11px;font-weight:800;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.wsb.on{border-color:var(--c1);background:rgba(29,111,59,.3);color:#fff}

/* PSE buttons */
.pse-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 0}
.psb{padding:9px 4px;border-radius:var(--rs);background:var(--bg3);border:1px solid var(--brd);font-size:12px;font-weight:800;cursor:pointer;text-align:center;transition:all .15s}
.psb.on{border-color:var(--c1);background:rgba(29,111,59,.3)}

/* EVAL SLIDERS */
.eval-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.eval-label{font-size:11px;font-weight:600;width:80px;flex-shrink:0;color:var(--t2)}
.eval-slider{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--bg4);outline:none;cursor:pointer}
.eval-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--c1);cursor:pointer}
.eval-val{width:28px;text-align:right;font-size:11px;font-weight:800;color:var(--c1l)}

/* RESPONSIVE */
@media(max-width:900px){:root{--sw:200px}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:680px){
  #sidebar{transform:translateX(-100%);width:min(var(--sw),82vw)}
  #sidebar.mob{transform:translateX(0)}
  #main{margin-left:0}
  .kpis{grid-template-columns:1fr 1fr}
  .g2,.g3{grid-template-columns:1fr}
  .fr,.fr3,.fr4{grid-template-columns:1fr}
  /* Grelhas com colunas de largura fixa (px) não encolhem sozinhas — em ecrãs
     estreitos empilham numa só coluna. Cobre os layouts inline conhecidos
     (Dashboard 1fr 360px, cartão de exercício 1fr 180px) sem tocar no JS. */
  div[style*="1fr 360px"],div[style*="1fr 180px"],div[style*="2fr 1fr 1fr"]{grid-template-columns:1fr!important}
  #sb-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150}
  #sb-backdrop.on{display:block}
}

<script>

// ============================================================
//  SPORT PERFORMANCE PLATFORM  v2.0
// ============================================================

const DK='sps_plat_v2', SK='sps_supa2';
let APP={}, ROLE=null, AID=null, _curPg='dashboard', _SESSION=null;
let _supa=null,_cid=null,_sync=false;
// Timestamp (ISO, vindo de clubs.updated_at) da última vez que este separador/dispositivo
// recebeu o meta blob da cloud — usado por pushAppMeta() para detetar cópias desatualizadas
// antes de gravar por cima (ver feedback_sps_full_meta_blob_overwrite_risk).
let _metaSyncAt=null;
// Ids apagados localmente desde a última sincronização, por coleção do meta blob
// (trainings, games, evalPeriods, evalResponses, convocatorias, scouting, sessions).
// Usado pelo merge de staleness em pushAppMeta(): sem isto, um item apagado
// localmente mas ainda presente na cópia antiga vinda da cloud era "ressuscitado"
// pelo merge, porque a lógica só sabia comparar por id presente/ausente — não
// distinguia "nunca existiu localmente" de "foi apagado localmente". Ver
// feedback_sps_planeamento_cloud_sync_bug (mesma família de bug, agora no lado
// das eliminações em vez do lado das edições).
const _pendingDeletes={};
function _markDeleted(key,ids){
  if(!_pendingDeletes[key])_pendingDeletes[key]=new Set();
  (Array.isArray(ids)?ids:[ids]).forEach(id=>{if(id)_pendingDeletes[key].add(id);});
}

// ─── DEFAULT DATA ─────────────────────────────────────────
function defApp(){
  return{
    config:{clubName:'Sport Performance',season:'2025/26',color:'#1d6f3b',logo:'⚽',clubLogo:'',homeGround:'',pinTec:'',pinFis:'',pinNut:'',wellnessStart:'07:00',wellnessEnd:'11:00',pseDelay:0},
    teams:[{id:'T1',name:'Equipa Principal',type:'principal',cat:'Sénior Feminino'}],
    athletes:[],schedule:[],microcycles:[],sessions:[],attendance:[],
    exercises:defEx(),games:[],trainings:[],scouting:[],evalPeriods:[],evalResponses:[],evaluations:[],
    convocatorias:[],trainingPlans:[],wellness:[],pse:[],
    injuries:[],treatments:[],nutritionAssessments:[],nutritionPlans:[],
    anamnesis:[],extraTrainings:[],gymSheets:[],gymRecords:[],
    users:[]
  };
}
function defEx(){
  return[
    {id:'ex1',name:'Posse 4v2',cat:'Tático',muscles:'Coordenação',diff:'Médio',equip:'Bola',desc:'Rondo de manutenção'},
    {id:'ex2',name:'Agachamento',cat:'Força',muscles:'Quadriceps,Glúteos',diff:'Médio',equip:'Barras',desc:'Agachamento livre'},
    {id:'ex3',name:'Sprint 30m',cat:'Velocidade',muscles:'Isquiotibiais',diff:'Intenso',equip:'Cones',desc:'Sprints máxima intensidade'},
    {id:'ex4',name:'Corrida Contínua',cat:'Resistência',muscles:'Cardio',diff:'Leve',equip:'',desc:'Corrida aeróbia'},
    {id:'ex5',name:'Finalização',cat:'Técnico',muscles:'Coordenação',diff:'Médio',equip:'Bola,Baliza',desc:'Remates após passe'},
    {id:'ex6',name:'Prancha',cat:'Força',muscles:'Core',diff:'Leve',equip:'',desc:'Isometria de core'},
    {id:'ex7',name:'Mobilidade',cat:'Recuperação',muscles:'Geral',diff:'Leve',equip:'',desc:'Alongamentos dinâmicos'},
    {id:'ex8',name:'Jogo 3v3',cat:'Tático',muscles:'Geral',diff:'Médio',equip:'Bola,Mini-balizas',desc:'Jogo reduzido'},
    {id:'ex9',name:'Pliometria',cat:'Força',muscles:'Gémeos,Quadriceps',diff:'Intenso',equip:'',desc:'Saltos e impulsões'},
    {id:'ex10',name:'Técnica Individual',cat:'Técnico',muscles:'Coordenação',diff:'Leve',equip:'Bola',desc:'Controlo e condução'},
  ];
}

// ─── STORAGE ──────────────────────────────────────────────
function loadData(){
  try{const d=localStorage.getItem(DK);APP=d?JSON.parse(d):defApp();}
  catch{APP=defApp();}
  // ensure all arrays exist
  const def=defApp();
  for(const k in def){if(!APP[k])APP[k]=def[k];}
  if(!APP.config)APP.config=def.config;
  for(const k in def.config){if(APP.config[k]===undefined)APP.config[k]=def.config[k];}
  if(!APP.users)APP.users=[];
  // migração: cargo antigo 'tecnico' (acesso total único) passa a 'treinador'
  APP.users.forEach(u=>{if(u.role==='tecnico')u.role='treinador';});
}
function saveData(){localStorage.setItem(DK,JSON.stringify(APP));if(_sync&&_supa&&_cid)pushAppMeta();}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
// Formata uma data para YYYY-MM-DD usando os campos LOCAIS (ano/mês/dia), não UTC.
// Bug corrigido 2026-08-11: `.toISOString().slice(0,10)` converte sempre para UTC — em
// Portugal (UTC+1 no verão) isso fazia qualquer data "meia-noite local" recuar um dia
// (ex: getMonday/addDaysStr no Microciclos mostravam sempre o dia anterior ao correto).
// Usar SEMPRE esta função (nunca toISOString) para converter um objeto Date para string
// de data local, em qualquer sítio novo do código.
const _fmtISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>_fmtISO(new Date());

// ─── AUTH (multi-user) ──────────────────────────────────────
async function hashPwd(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function getSession(){
  if(_SESSION)return _SESSION;
  try{return JSON.parse(sessionStorage.getItem('_sps_sess')||'null');}catch{return null;}
}
function setSession(data){_SESSION=data;sessionStorage.setItem('_sps_sess',JSON.stringify(data));}
function clearSession(){_SESSION=null;sessionStorage.removeItem('_sps_sess');}
function genPwd(len=8){
  const chars='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#';
  return Array.from({length:len},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
}
// Password inicial das atletas — MFC26@<número de camisola>. Têm de a trocar por uma própria no 1º acesso.
// Exige número de camisola atribuído (garante que o plantel está sempre atualizado com números).
function _defaultAthletePwd(num){ return num?('MFC26@'+num):null; }
// Password inicial fixa para novas contas de staff (fisio, nutri, etc) — igual para todos,
// obriga a definir uma password própria no 1º acesso (ver handleLogin/_showStaffPwdSetup).
// Mesma lógica das atletas, mas sem número (staff não tem camisola) — string fixa combinada
// com o Roger. Troca-se sempre no 1º uso, por isso não precisa de ser única por pessoa.
function _defaultStaffPwd(){ return 'MFC@26'; }
// Link/QR dedicado para atletas: .../index.html?atleta=1 abre logo o formulário
// de atleta, sem mostrar o ecrã de staff — evita a confusão de terem de encontrar
// o botão "Entrar como Atleta" (ver memória feedback_sps_athlete_only_entry_url).
const _forceAtletaMode=new URLSearchParams(location.search).get('atleta')==='1';
// SPS-Gameday standalone (?gameday=1, sps-v78) — mesmo padrão do ?atleta=1: URL/PWA
// dedicado, mas aqui continua a ser login normal de staff (o Gameday já exige o cargo
// de treinador/adjunto/team manager, ver _gamedayEligibleRole) — só muda o que acontece
// DEPOIS do login (ver _maybeEnterGamedayMode), nunca o próprio ecrã de login.
const _forceGamedayMode=new URLSearchParams(location.search).get('gameday')==='1';
// SPS-Ginásio standalone (?ginasio=1) — mesmo padrão do ?gameday=1 acima: login normal de
// staff, exige acesso a Fichas de Ginásio (ver _ginasioEligibleRole), só muda o que acontece
// DEPOIS do login (ver _maybeEnterGinasioMode).
const _forceGinasioMode=new URLSearchParams(location.search).get('ginasio')==='1';
function renderLoginScreen(){
  const el=document.getElementById('login-main');if(!el)return;
  if(APP.users.length===0){
    el.innerHTML=`
      <div class="al al-b" style="font-size:11px;margin-bottom:14px;text-align:center">
        👋 Primeira configuração — cria a conta de administrador
      </div>
      <div class="fg"><label class="lbl">Nome</label>
        <input class="ctrl" id="setup-name" placeholder="O teu nome">
      </div>
      <div class="fg"><label class="lbl">Email</label>

async function createFirstAdmin(){

  const err=document.getElementById('setup-err');

async function handleLogin(){
  const username=(document.getElementById('login-user')?.value||'').trim();
  const pwd=document.getElementById('login-pwd')?.value||'';
  const err=document.getElementById('login-err');
  if(!username||!pwd){err.textContent='⚠️ Preenche todos os campos.';return;}
  err.textContent='A verificar...';
  const hash=await hashPwd(pwd);
  const user=APP.users.find(u=>u.active!==false&&u.passwordHash===hash&&
    (u.email.toLowerCase()===username.toLowerCase()||u.name.toLowerCase()===username.toLowerCase()));
  if(!user){err.textContent='❌ Utilizador ou password incorretos.';document.getElementById('login-pwd').value='';return;}
  err.textContent='';
  if(user.mustChangePwd){
    // Ainda usa a password fixa inicial (ver addUserFromConfig/resetUserPwd) — obriga a
    // definir uma password própria antes de entrar, mesmo padrão do 1º acesso das atletas.
    _showStaffPwdSetup(user);
    return;
  }
  setSession({userId:user.id,role:user.role,isAdmin:!!user.isAdmin,name:user.name});
  ROLE=user.role;showStaffApp();
  _maybeEnterGamedayMode();
  _maybeEnterGinasioMode();
}

async function _saveStaffPwdSetup(userId){
  const user=APP.users.find(u=>u.id===userId);if(!user)return;
  const p1=document.getElementById('staff-newpwd1')?.value||'';
  const p2=document.getElementById('staff-newpwd2')?.value||'';
  const err=document.getElementById('staff-newpwd-err');
  if(p1.length<6){if(err)err.textContent='⚠️ Mínimo 6 caracteres.';return;}
  if(p1!==p2){if(err)err.textContent='⚠️ As passwords não coincidem.';return;}
  user.passwordHash=await hashPwd(p1);
  user.mustChangePwd=false;
  saveData();
  if(_sync)await cloudUpsert('staff_users',{...user,club_id:_cid});
  setSession({userId:user.id,role:user.role,isAdmin:!!user.isAdmin,name:user.name});
  ROLE=user.role;showStaffApp();
  toast('Password definida ✓ Bem-vindo, '+user.name+'!');
  _maybeEnterGamedayMode();
  _maybeEnterGinasioMode();
}
async function handleAthleteLogin(){
  const username=(document.getElementById('at-login-user')?.value||'').trim();
  const pwd=document.getElementById('at-login-pwd')?.value||'';
  const err=document.getElementById('at-login-err');
  if(!username||!pwd){err.textContent='⚠️ Preenche todos os campos.';return;}
  err.textContent='A verificar...';
  const hash=await hashPwd(pwd);
  const athlete=APP.athletes.find(a=>
    a.passwordHash===hash&&
    (String(a.number||a.num)===username||
     a.name.toLowerCase()===username.toLowerCase()||
     (a.email&&a.email.toLowerCase()===username.toLowerCase())));
  if(!athlete){err.textContent='❌ Dados incorretos.';document.getElementById('at-login-pwd').value='';return;}
  err.textContent='';
  if(athlete.mustChangePwd){
    // Ainda usa a password fixa do clube — obriga a criar uma password própria antes de entrar
    _showWelcomeScreen(athlete,_atletaToken(athlete),true);
    return;
  }
  AID=athlete.id;ROLE='atleta';
  setSession({userId:athlete.id,role:'atleta',name:athlete.name});
  showAtletaApp(athlete);
}
function logout(){
  clearSession();_clearAtSess();ROLE=null;AID=null;
  document.getElementById('staff-app').classList.remove('on');
  document.getElementById('atleta-app').classList.remove('on');
  if(_checkAtletaToken()) return;
  // Sessão persistente da atleta (localStorage)
  var _atSess=_getAtSess();
  if(_atSess&&_atSess.role==='atleta'){
    var _atLocal=APP.athletes.find(function(a){return a.id===_atSess.userId;});
    if(_atLocal){
      AID=_atLocal.id;ROLE='atleta';

  renderLoginScreen();
}

// Títulos qualificados por página — partilhado entre navTo() (cabeçalho da página) e
// _updateNewUserRoleHint() (hint de acessos em Configurações → Novo Utilizador), para
// as duas nunca divergirem (bug real: hint mostrava só o rótulo curto do menu, ex.
// "Dashboard" repetido para Fisioterapia/Nutrição/etc, em vez do título qualificado).
const _NAV_TITLES={dashboard:'Dashboard',plantel:'Plantel',planeamento:'Planeamento',presencas:'Presenças',microciclos:'Microciclos',jogos:'Jogos',treinos:'Unidades de Treino',formacao:'Formação','condicao-plantel':'Condição do Plantel','pse-wellness':'PSE & Wellness','treinos-extra':'Treinos Extra',scouting:'Scouting',avaliacoes:'Avaliações',convocatorias:'Convocatórias',biblioteca:'Biblioteca de Exercícios','fichas-ginasio':'Fichas de Ginásio','treinos-ind':'Treinos Individualizados','fisio-dash':'Fisioterapia — Dashboard','fisio-ep':'Fisioterapia — Episódios','fisio-trat':'Fisioterapia — Tratamentos','fisio-anamnese':'Fisioterapia — Anamnese','nutri-dash':'Nutrição — Dashboard','nutri-aval':'Nutrição — Avaliações','nutri-planos':'Planos Nutricionais',config:'Configurações',relatorios:'Relatórios & Exportações'};
function _navForRole(role){
  const def=ROLE_DEFS[role];
  if(!def)return ALL_PAGES;
  const allowed=new Set(def.pages);
  const out=[];let pendingSec=null;
  ALL_PAGES.forEach(item=>{
    if(item.sec){pendingSec=item;return;}
    if(allowed.has(item.id)){
      if(pendingSec){out.push(pendingSec);pendingSec=null;}
      out.push(item);
    }
  });
  return out;
}
function _defaultPageForRole(role){return (ROLE_DEFS[role]&&ROLE_DEFS[role].pages[0])||'dashboard';}
function _canManageUsers(){const sess=getSession();return !!(sess&&sess.isAdmin)||!!(ROLE_DEFS[ROLE]&&ROLE_DEFS[ROLE].manageUsers);}
// Bloqueio de escrita para cargos "só consulta" (ex: Diretor): desativa botões que não
// sejam claramente de exportação/impressão/consulta, e campos de formulário, dentro da
// página atualmente visível. É uma barreira de interface, não uma barreira de dados —
// ver nota de segurança na config de Supabase (sem Auth por utilizador/RLS individual).
const _RO_SAFE_RE=/export|imprim|print|download|pdf/i;
function _applyReadOnlyLock(){
  const root=document.querySelector('.pg.on');
  if(!root)return;
  root.querySelectorAll('button').forEach(b=>{
    const oc=b.getAttribute('onclick')||'';
    if(_RO_SAFE_RE.test(oc)||_RO_SAFE_RE.test(b.textContent||''))return;
    b.disabled=true;b.style.opacity='.4';b.style.cursor='not-allowed';
    if(!b.title)b.title='Acesso de consulta — sem permissão para editar';
  });
  root.querySelectorAll('input,textarea').forEach(el=>{
    if(el.type==='button'||el.type==='submit')return;
    el.readOnly=true;
    if(el.type==='checkbox'||el.type==='radio')el.disabled=true;
  });
  root.querySelectorAll('select').forEach(el=>el.disabled=true);
}
function renderSidebar(){
  const nav=_navForRole(ROLE);
  const roleDef=ROLE_DEFS[ROLE];
  const roleLabel=(roleDef&&roleDef.label)||ROLE;
  const roleInit=(roleDef&&roleDef.label?roleDef.label.slice(0,1):'S').toUpperCase();

function _handleStaffPhoto(input,previewId){
  const file=input.files[0];if(!file)return;

  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const max=200;let w=img.width,h=img.height;
      if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      const b64=cv.toDataURL('image/jpeg',0.85);

    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function svgRing(pct,color,sz){

function renderDashboard(){
  const td=today();
  // Day arrays
  const dys28=[],dys7=[];
  for(let i=27;i>=0;i--){const x=new Date(td+'T00:00:00');x.setDate(x.getDate()-i);dys28.push(_fmtISO(x));}
  dys7.push(...dys28.slice(-7));
  const wkMon=getMonday(td);
  const wkDays=[],lwDays=[];
  for(let i=0;i<7;i++){const x=new Date(wkMon+'T00:00:00');x.setDate(x.getDate()+i);wkDays.push(_fmtISO(x));}
  for(let i=0;i<7;i++){const x=new Date(wkMon+'T00:00:00');x.setDate(x.getDate()-7+i);lwDays.push(_fmtISO(x));}

  // Athletes for current team
  const selTeam=_pwTeam||'T1';
  const mainAts=APP.athletes.filter(a=>a.teamId===selTeam||(selTeam==='T1'&&!a.teamId));
  // Convocatória ativa (a mais próxima no futuro) desta equipa — a coluna de "visto"
  // no Estado do Plantel só aparece quando existe uma (pedido do Roger, 21/08/2026).
  const activeConv=(APP.convocatorias||[]).filter(c=>c.teamId===selTeam&&c.date>=td&&_convIsPublished(c)).sort((a,b)=>a.date.localeCompare(b.date))[0];

  // Injuries
  const injMap={};
  APP.injuries.filter(i=>i.status==='ativo'||i.status==='reabilitação').forEach(i=>injMap[i.athleteId]=i);
  const injCount=Object.keys(injMap).length;

  // Treino Extra (autorreportado) — mesmos limiares do 6º fator da Condição do Plantel
  // (ver [[project_sps_condicao_plantel]]/[[project_sps_treino_extra_atleta_plano]]):
  // 3+ sessões ou 150+ min nos últimos 7 dias = atenção, 5+/300+ = risco.
  const extraLvlMap={};
  // Registos de treino extra de HOJE, por atleta — usado para o sinal imediato na
  // coluna EXTRA (ver [[project_sps_treino_extra_atleta_plano]]): o ícone só aparece
  // no dia em que a atleta efetivamente submeteu, colorido como semáforo com a carga
  // acumulada dos últimos 7 dias (incluindo hoje) nesse momento.
  const extraTodayMap={};
  mainAts.forEach(at=>{
    const recs7=(APP.extraTrainings||[]).filter(e=>e.athleteId===at.id&&dys7.includes(e.date));
    const cnt=recs7.length,min=recs7.reduce((s,e)=>s+(+e.duration||0),0);
    extraLvlMap[at.id]=(cnt>=5||min>=300)?'r':(cnt>=3||min>=150)?'y':'g';
    extraTodayMap[at.id]=recs7.filter(e=>e.date===td);
  });
  const extraHighCount=Object.values(extraLvlMap).filter(l=>l==='r').length;

  // PSE loads
  const wkUA=Math.round(APP.pse.filter(p=>wkDays.includes(p.date)&&mainAts.find(a=>a.id===p.athleteId)).reduce((s,p)=>s+(+p.ua||0),0));
  const lwkUA=Math.round(APP.pse.filter(p=>lwDays.includes(p.date)&&mainAts.find(a=>a.id===p.athleteId)).reduce((s,p)=>s+(+p.ua||0),0));
  const uaDelta=lwkUA?Math.round((wkUA-lwkUA)/lwkUA*100):0;
  const wkMins=wkUA; // use UA as proxy for minutes accumulation

  // ACWR per athlete
  const acwrList=mainAts.map(at=>{
    const atP=APP.pse.filter(p=>p.athleteId===at.id);
    const ac=atP.filter(p=>dys7.includes(p.date)).reduce((s,p)=>s+(+p.ua||0),0)/7;
    const ch=atP.filter(p=>dys28.includes(p.date)).reduce((s,p)=>s+(+p.ua||0),0)/28;
    const r=ch?+(ac/ch).toFixed(2):0;
    const wkU=Math.round(atP.filter(p=>wkDays.includes(p.date)).reduce((s,p)=>s+(+p.ua||0),0));
    return{at,ac:Math.round(ac),ch:Math.round(ch),r,wkU};
  }).sort((a,b)=>b.r-a.r);
  const highAcwr=acwrList.filter(x=>x.r>1.5).length;
  const monitored=acwrList.filter(x=>x.r>0).length;

  // Disponibilidade
  const disp=mainAts.filter(a=>!injMap[a.id]).length;
  const dispPct=mainAts.length?Math.round(disp/mainAts.length*100):100;

  // Wellness last 7 days
  const wkW=APP.wellness.filter(w=>dys7.includes(w.date)&&mainAts.find(a=>a.id===w.athleteId));
  const avgD=(dim,max)=>wkW.length?(wkW.reduce((s,w)=>s+(+w[dim]||0),0)/wkW.length).toFixed(1):'0';
  const avgSleep=avgD('sleep',5),avgFat=avgD('fatigue',10),avgStr=avgD('stress',10),avgPain=avgD('pain',10);
  const avgRPE=APP.pse.filter(p=>dys7.includes(p.date)&&mainAts.find(a=>a.id===p.athleteId));
  const avgRPEVal=avgRPE.length?(avgRPE.reduce((s,p)=>s+(+p.pse||0),0)/avgRPE.length).toFixed(1):'0';
  const wAvg=wkW.length?Math.round(wkW.reduce((s,w)=>s+(+w.score||0),0)/wkW.length):0;

  // SVG gauge helper (inside function)
  function gauge(val,max,color,lbl,sz=68){
    const r=sz*.37,c=sz/2,ci=2*Math.PI*r,d=ci*(Math.min(+val/max,1));
    return`<div style="text-align:center;flex:1">
      <svg viewBox="0 0 ${sz} ${sz}" style="width:${sz}px;height:${sz}px">

        <text x="${c}" y="${c+sz*.19}" text-anchor="middle" fill="rgba(255,255,255,.45)" font-size="${sz*.14}">/10</text>
      </svg>
      <div style="font-size:9px;color:var(--t2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:2px">${lbl}</div>
    </div>`;
  }

  // Estado do plantel row builder
  function plantelRow(at,i){
    const inj=injMap[at.id];
    const lw=APP.wellness.filter(w=>w.athleteId===at.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
    const acd=acwrList.find(x=>x.at.id===at.id);
    // Status
    let stLbl='VERDE',stC='#4ade80';
    if(inj){stLbl='VERMELHO';stC='#f87171';}
    else if(lw&&lw.score<50){stLbl='VERMELHO';stC='#f87171';}
    else if((lw&&lw.score<70)||(acd&&(acd.r>1.3||acd.r<0.8))){stLbl='AMARELO';stC='#fbbf24';}
    // Wellness circle

function importAthleteFromUrl(){
  const urlEl=document.getElementById('af-import-url');
  if(!urlEl)return;
  const url=(urlEl.value||'').trim();
  if(!url)return toast('Cola o URL primeiro','err');
  const fpfM=url.match(/playerId[=\/](\d+)/i);
  const tmM=url.match(/spieler\/(\d+)/i);
  const zzM=url.match(/zerozero\.pt\/jogador\.php.*[?&]id=(\d+)/i);
  const btn=document.getElementById('af-import-btn');
  if(btn){btn.disabled=true;btn.textContent='⏳';}
  toast('A importar dados...','ok');
  (async()=>{
    try{
      let data=null;
      if(fpfM){
        document.getElementById('af-fpf-id').value=fpfM[1];
        data=await _xtFPF(fpfM[1],url);
      }else if(tmM){
        data=await _xtTM(url);
      }else if(zzM){
        data=await _xtZZ(zzM[1],url);
      }else{
        data=await _xtGeneric(url);
      }
      if(data&&data._ok){_showImportModal(data);}

    finally{if(btn){btn.disabled=false;btn.textContent='📥 Importar';}}
  })();
}
async function _proxyGet(url){
  try{
    const r=await fetch('https://api.allorigins.win/get?url='+encodeURIComponent(url));
    const j=await r.json();
    return j.contents||'';
  }catch(e){
    try{const r=await fetch('https://corsproxy.io/?'+encodeURIComponent(url));return await r.text();}
    catch(e2){return '';}
  }
}
async function _fpfTestImg(url){
  return new Promise(res=>{
    const img=new Image();
    const t=setTimeout(()=>{img.src='';res(null);},3000);
    img.onload=()=>{clearTimeout(t);res(url);};
    img.onerror=()=>{clearTimeout(t);res(null);};
    img.src=url+'?t='+Date.now();

}

// Remove acentos para comparar nomes de meses em PT sem depender de encoding exato
function _stripAccents(s){return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'');}
const _PT_MONTHS={janeiro:1,fevereiro:2,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
// Converte "11 de abril de 2004" ou "15/03/1998" para AAAA-MM-DD (formato do <input type=date>)
function _parsePtDate(s){
  if(!s)return '';
  const clean=_stripAccents(s).toLowerCase();
  const m=clean.match(/(\d{1,2})\s+de\s+([a-z]+)\s+de\s+(\d{4})/);
  if(m){
    const mon=_PT_MONTHS[m[2]];
    if(mon)return m[3]+'-'+String(mon).padStart(2,'0')+'-'+m[1].padStart(2,'0');
  }
  const m2=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m2)return m2[3]+'-'+m2[2].padStart(2,'0')+'-'+m2[1].padStart(2,'0');
  const m3=s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m3)return s.slice(0,10);
  return '';
}
// Converte HTML em texto simples (label numa linha, valor na linha seguinte) e extrai os
// campos da secção "Bio" da ficha de jogador da FPF: Nome, Data de Nascimento, Naturalidade, Posição.
// A ficha da FPF não usa uma API JSON — estes dados só existem como texto na própria página.
function _fpfExtractBio(html){
  try{
    let text=html
      .replace(/<script[\s\S]*?<\/script>/gi,' ')
      .replace(/<style[\s\S]*?<\/style>/gi,' ')
      .replace(/<(br|\/p|\/div|\/li|\/tr|\/td|\/dt|\/dd|\/h[1-6])[^>]*>/gi,'\n')
      .replace(/<[^>]+>/g,'\n')
      .replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&')
      .split('\n').map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean).join('\n');
    const grab=(label)=>{
      const re=new RegExp('^'+label+'\\s*:?$','im');
      const lines=text.split('\n');
      const idx=lines.findIndex(l=>re.test(l));
      return idx>=0&&idx+1<lines.length?lines[idx+1].trim():'';
    };
    const nome=grab('Nome');
    const dobRaw=grab('Data de Nascimento');
    const nat=grab('Naturalidade');
    const pos=grab('Posi[cç][aã]o');
    const out={};
    if(nome&&nome.length>2)out.fullName=nome;
    if(dobRaw){const iso=_parsePtDate(dobRaw);if(iso)out.dob=iso;}
    if(nat&&nat.length>1)out.nat=nat;
    if(pos&&pos.length>1)out.pos=pos;
    return out;
  }catch(e){return{};}
}
async function _xtFPF(id,url){
  // Run photo search in parallel with data fetch
  const photoPromise=_fpfFindPhoto(id);
  // Try FPF internal API patterns
  const apis=[
    'https://www.fpf.pt/umbraco/Surface/Player/Details?playerId='+id,
    'https://www.fpf.pt/umbraco/api/PlayerApi/GetPlayer?id='+id,
    'https://www.fpf.pt/api/v1/players/'+id,
    'https://www.fpf.pt/api/player/'+id,
  ];
  let apiData=null;
  for(const api of apis){
    try{
      const html=await _proxyGet(api);
      if(html&&html.trim().startsWith('{')){
        const j=JSON.parse(html);
        if(j.name||j.Name||j.firstName||j.FirstName){apiData=_parseFPFJ(j,id);break;}
      }
    }catch(e){}
  }
  // Try actual page HTML — buscada sempre (mesmo que já haja apiData) para poder ler a
  // secção "Bio" (Data de Nascimento, Naturalidade, Posição), que nunca vem da API.
  const pageHtml=await _proxyGet(url);
  if(!apiData){
    const html=pageHtml;
    if(html&&html.length>500){
      const nd=html.match(/<script[^>]*id=["']__NEXT_DATA__["'][^>]*>(\{[\s\S]+?\})<\/script>/);
      if(nd){try{const d=JSON.parse(nd[1]);const p=d.props?.pageProps?.player||d.props?.pageProps?.playerData;if(p){apiData=_parseFPFJ(p,id);}}catch(e){}}
      if(!apiData){
        const ws=html.match(/window\.__(?:INITIAL|STATE|DATA)__\s*=\s*(\{[\s\S]+?\});/);
        if(ws){try{const d=JSON.parse(ws[1]);const found=_deepFind(d,id);if(found){apiData=found;}}catch(e){}}
      }
      if(!apiData){
        const og=(k)=>{const m=html.match(new RegExp('<meta[^>]+(?:property|name)=["\']'+k+'["\'][^>]+content=["\']([^"\']+)'));return m?m[1]:'';}
        const name=og('og:title').split('|')[0].split('-')[0].trim();
        const metaImg=og('og:image');
        if(name&&name.length>2)apiData={name,photo:metaImg,bio:og('og:description').slice(0,200),fpfId:id,_ok:true,_source:'fpf'};
      }
    }
  }
  // A ficha da FPF não tem API — Data de Nascimento, Naturalidade e Posição só existem
  // como texto na secção "Bio" da própria página. Complementa sempre que possível,
  // sem substituir dados já encontrados por outra via.
  if(pageHtml){
    const bio=_fpfExtractBio(pageHtml);
    if(Object.keys(bio).length){
      if(!apiData)apiData={fpfId:id,_source:'fpf'};
      if(!apiData.name&&bio.fullName)apiData.name=bio.fullName;
      if(!apiData.dob&&bio.dob)apiData.dob=bio.dob;
      if(!apiData.nat&&bio.nat)apiData.nat=bio.nat;
      if(!apiData.pos&&bio.pos)apiData.pos=bio.pos;
    }
  }
  // Wait for photo result
  const foundPhoto=await photoPromise;
  if(apiData){
    // Prefer found photo over API photo if we found one
    if(foundPhoto)apiData.photo=foundPhoto;
    apiData._ok=true;
    return apiData;
  }
  // No data but maybe a photo
  if(foundPhoto){
    return{fpfId:id,photo:foundPhoto,_ok:true,_source:'fpf',
      _msg:'Foto encontrada! Preenche os restantes dados.'};
  }
  return{fpfId:id,_ok:false};
}

async function _xtZZ(id,url){

    ||html.includes('temporarily suspended')
    ||html.includes('acesso bloqueado')

function _deepFind(obj,id,depth=0){
  if(!obj||typeof obj!=='object'||depth>6)return null;
  for(const k of Object.keys(obj)){
    const v=obj[k];
    if(v&&typeof v==='object'){
      if((v.playerId==id||v.id==id||v.PlayerId==id)&&(v.name||v.firstName||v.Name)){return _parseFPFJ(v,id);}
      const r=_deepFind(v,id,depth+1);if(r)return r;
    }
  }
  return null;
}

// Fase 2 (parte 1, baixo risco) do sistema Carga/Wellness/Ciclo — ver memória
// project_sps_sistema_carga_wellness_ciclo. Baseline = média/desvio-padrão do
// histórico próprio da atleta (não bandas fixas do plantel). Só para consulta:
// não liga a nenhum alerta, badge ou decisão automática — isso fica para a
// parte 2 (revisão das bandas com dados reais, início de outubro 2026).
// MIN_BASE_N=8 evita mostrar uma "média" calculada com 2-3 registos, que seria
// só ruído. Simplificação aceite para esta parte: a baseline inclui o próprio
// registo mais recente (não leave-one-out) — irrelevante com n grande, a afinar
// se necessário na parte 2.
const _BASELINE_MIN_N=8;
function _baselineStats(vals){
  const n=vals.length;
  if(!n)return {n:0,mean:null,sd:null};
  const mean=vals.reduce((s,v)=>s+v,0)/n;
  if(n<2)return {n,mean:Math.round(mean*10)/10,sd:null};
  const variance=vals.reduce((s,v)=>s+Math.pow(v-mean,2),0)/(n-1);
  return {n,mean:Math.round(mean*10)/10,sd:Math.round(Math.sqrt(variance)*10)/10};
}
// Desvio em σ de um valor face a uma baseline {n,mean,sd} — null se a baseline
// não tiver dados suficientes (_BASELINE_MIN_N) ou sd=0 (evita dividir por zero
// quando todos os registos são iguais). Global porque é reutilizado tanto no
// perfil da atleta (baseline com todo o histórico) como na Análise da Unidade
// de Treino (baseline só com histórico anterior a uma data — ver _athleteBaselineAt).
function _devSigma(val,base){
  return (base&&base.n>=_BASELINE_MIN_N&&base.sd>0&&val!=null&&!isNaN(val))?Math.round((val-base.mean)/base.sd*10)/10:null;
}
// Baseline de wellness/UA usando só o histórico ANTERIOR a uma data (não inclui
// a própria data) — para saber se a carga/wellness de UMA sessão específica já
// passada se desviou do que era "normal" para a atleta até àquele momento, sem
// deixar a própria sessão influenciar a média com que está a ser comparada.
function _athleteBaselineAt(id,beforeDate){
  const wellVals=(APP.wellness||[]).filter(w=>w.athleteId===id&&w.date<beforeDate).map(w=>+w.score||0).filter(v=>!isNaN(v));
  const uaVals=(APP.pse||[]).filter(p=>p.athleteId===id&&p.date<beforeDate).map(p=>+p.ua||0).filter(v=>!isNaN(v));
  return {well:_baselineStats(wellVals),ua:_baselineStats(uaVals)};
}
// Monotonia e Strain (método de Foster) — janela de 7 dias terminando em endDate
// (inclusive), mesma janela do ACWR agudo (_acwrAt) por consistência. Monotonia =
// média da carga diária ÷ desvio-padrão da carga diária (desvio-padrão populacional,
// não amostral — descreve a semana real observada, não estima um parâmetro de uma
// amostra, ao contrário de _baselineStats). Strain = carga total da semana × monotonia.
// Dias sem sessão contam como carga 0 (a variabilidade importa: uma semana com um dia
// de descanso é literalmente menos monótona do que uma sem nenhum).
function _monotoniaStrain(id,endDate){
  const days7=Array.from({length:7},(_,i)=>addDaysStr(endDate,-(6-i)));
  const byDay=days7.map(d=>(APP.pse||[]).filter(p=>p.athleteId===id&&p.date===d).reduce((s,p)=>s+(+p.ua||0),0));
  const total=byDay.reduce((s,v)=>s+v,0);
  const mean=total/7;
  if(mean===0)return {total:0,mean:0,sd:0,monotonia:null,strain:null};
  const variance=byDay.reduce((s,v)=>s+Math.pow(v-mean,2),0)/7;
  const sd=Math.sqrt(variance);
  const monotonia=sd>0?Math.round(mean/sd*100)/100:null;
  const strain=monotonia!==null?Math.round(total*monotonia):null;
  return {total:Math.round(total),mean:Math.round(mean),sd:Math.round(sd*10)/10,monotonia,strain};
}
// As três leituras cruzadas propostas pelo Roger (2026-08-21): wellness de chegada
// (mesmo dia, manhã, antes do treino) × desvio da carga da sessão à baseline pessoal
// (ou, sem baseline suficiente, às bandas fixas _uaZone como aproximação — mesmo
// princípio de fallback já usado no resto da Fase 2). Só classifica quando o wellness
// de chegada é claramente bom (≥70) ou claramente baixo (<45) — na zona intermédia não
// há leitura clara o suficiente para gerar um padrão. Puramente descritivo: nomeia o
// que se observa, não prescreve o que fazer (ver feedback_sps_evento_treino_dados_divergentes
// e toda a cautela já estabelecida na Fase 1/2 sobre não confundir apoio à decisão com
// diagnóstico ou prescrição automática).
function _cargaLeitura(wellPreScore,ua,uaBaseline){
  if(wellPreScore==null||ua==null)return null;
  const dev=_devSigma(ua,uaBaseline);
  let cargaAlta,cargaBaixa;
  if(dev!==null){cargaAlta=dev>=1;cargaBaixa=dev<=-0.5;}
  else{ // fallback: bandas fixas quando ainda não há baseline pessoal suficiente

}

// Marca (ou atualiza) a presença da atleta num evento de treino, a partir de
// um sinal automático (PSE submetido = esteve em treino; tratamento
// registado = esteve com a fisio). PSE é o sinal mais forte e sobrepõe-se
// sempre a um registo anterior; um tratamento só marca 'tratamento' se ainda
// não houver um 'treino' confirmado nesse evento (não faz downgrade).
// status='tratamento' fica com present=null de propósito — não conta nem a
// favor nem contra a % de presenças (ver cálculo em attRate/attPct).
function _autoMarkAttendance(athleteId,date,status){
  const at=APP.athletes.find(a=>a.id===athleteId);if(!at)return;
  if(!APP.attendance)APP.attendance=[];
  const evs=APP.schedule.filter(e=>e.date===date&&(e.teamId===at.teamId||!e.teamId||(e.guestIds||[]).includes(athleteId))&&_isTrainingType(e.type));
  evs.forEach(ev=>{

function _presMonthAdd(n){const[y,m]=_presMonth.split('-').map(Number);const d=new Date(y,m-1+n,1);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function _presMonthLabel(ym){const names=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];const[y,m]=ym.split('-').map(Number);return names[m-1]+' '+y;}

  if(!athletes.length){document.getElementById('pg-presencas').innerHTML=`${header}<div class="empty"><div class="ei">👥</div><p>Sem atletas nesta equipa</p></div>`;return;}
  if(!evs.length){document.getElementById('pg-presencas').innerHTML=`${header}<div class="empty"><div class="ei">✅</div><p>Sem treinos agendados neste mês para esta equipa</p></div>`;return;}

    const rec=APP.attendance.find(a=>a.eventId===ev.id&&a.athleteId===at.id);

    return`<td style="text-align:center;cursor:pointer" onclick="openAttendanceModal('${ev.id}','${at.id}')" title="${escHtml(at.name)} — ${label}"><span style="font-size:14px">${icon}</span></td>`;
  };

// Para eventos tipo 'Jogo', vai buscar o ícone da competição ao Jogo

function _planMesGridHtml(){
  const first=new Date(_calYear,_calMonth,1);
  const last=new Date(_calYear,_calMonth+1,0);
  const startDay=first.getDay()===0?6:first.getDay()-1; // mon=0
  const td=today();
  let calHtml=`<div class="cal-wrap"><div class="cal-grid">`;
  ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].forEach(d=>{calHtml+=`<div class="cal-hdr">${d}</div>`;});
  for(let i=0;i<startDay;i++) calHtml+=`<div class="cal-day dim"></div>`;
  for(let day=1;day<=last.getDate();day++){
    const dt=`${_calYear}-${String(_calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday=dt===td;
    const evs=APP.schedule.filter(e=>e.date===dt).sort((a,b)=>(a.time||'').localeCompare(b.time||''));

function _planSemanaGridHtml(){

    const day=+dt.slice(8,10);
    const evs=APP.schedule.filter(e=>e.date===dt).sort((a,b)=>(a.time||'').localeCompare(b.time||''));

// Data/hora local (mesmo formato do <input type="datetime-local">, "AAAA-MM-DDTHH:MM")
// — usado para comparar com c.publishAt sem confusões de fuso horário (UTC vs local).
function _nowLocalStr(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
// Uma convocatória sem publishAt está sempre visível (comportamento de sempre); com
// publishAt, só fica visível para a atleta a partir dessa data/hora — pedido pelo
// Roger para poder preparar a convocatória com antecedência sem a "queimar" já.
// Convocatórias ligadas a um Jogo (c.gameId) ficam sempre em rascunho — invisíveis
// para as atletas, mesmo que já tenham data de publicação definida — até o treinador
// clicar em "Publicar Convocatória" (g.convocatoriaLaunched). Evita que cada marcação
// individual durante a edição (Convocar Todas, titulares, etc.) fique logo visível
// a meio do trabalho. Convocatórias manuais (sem jogo) não têm este rascunho: já são
// criadas de uma vez só, com o formulário "Nova Convocatória" (pedido do Roger, 21/08/2026).
function _convIsPublished(c){
  if(c.gameId){
    const g=APP.games.find(x=>x.id===c.gameId);
    if(g&&!g.convocatoriaLaunched)return false;
  }
  return !c.publishAt||c.publishAt<=_nowLocalStr();
}
function _convPublishBadgeHtml(publishAt){
  if(!publishAt)return '<span class="bdg bg-g" style="font-size:9px">Visível imediatamente</span>';
  const published=publishAt<=_nowLocalStr();
  return published
    ?`<span class="bdg bg-g" style="font-size:9px">✓ Publicada (desde ${escHtml(publishAt.replace('T',' '))})</span>`
    :`<span class="bdg bg-y" style="font-size:9px">🕓 Agendada — publica às ${escHtml(publishAt.replace('T',' '))}</span>`;
}
// Mantém APP.convocatorias sincronizada com a convocatória do Jogo — só há UM sítio
// para preencher (separador Pré-Jogo do Jogo); a entrada que a atleta vê na aba
// Convocatórias é gerada/atualizada automaticamente a partir daqui. Se a convocatória
// ficar vazia, a entrada é removida (evita convocatória fantasma).
function _syncConvocatoriaFromGame(g){
  if(!APP.convocatorias)APP.convocatorias=[];
  const i=APP.convocatorias.findIndex(x=>x.gameId===g.id);
  if(!g.convocatoria||!g.convocatoria.length){
    if(i>=0)APP.convocatorias.splice(i,1);
    return;
  }
  const data={teamId:g.teamId,date:g.date,notes:'vs '+g.opp,athletes:[...g.convocatoria],
    lineup:[...g.lineup],subs:[...g.subs],captain:g.captain,viceCaptain:g.viceCaptain,formation:g.formation,
    concentracaoLocal:g.concentracaoLocal,concentracaoHora:g.concentracaoHora,transporte:g.transporte,
    refeicaoAntes:g.refeicaoAntes,refeicaoApos:g.refeicaoApos,publishAt:g.convocatoriaPublishAt||''};
  if(i>=0){Object.assign(APP.convocatorias[i],data);}
  else{APP.convocatorias.push({id:uid(),gameId:g.id,seenBy:[],...data});}
}
// Quando uma atleta sai do plantel (deleteAthlete → Scouting), o ID dela pode ficar
// "fantasma" em jogos/convocatórias antigas já guardadas — purga-o de tudo para as
// contagens (convocadas, vista por X/Y) nunca mais divergirem entre ecrãs.
function _purgeAthleteRefs(id){
  (APP.games||[]).forEach(g=>{
    let changed=false;
    if(g.convocatoria&&g.convocatoria.includes(id)){g.convocatoria=g.convocatoria.filter(x=>x!==id);changed=true;}
    if(g.lineup&&g.lineup.includes(id)){g.lineup=g.lineup.filter(x=>x!==id);changed=true;}
    if(g.subs&&g.subs.includes(id)){g.subs=g.subs.filter(x=>x!==id);changed=true;}
    if(g.captain===id){g.captain='';changed=true;}
    if(g.viceCaptain===id){g.viceCaptain='';changed=true;}
    if(g.playerPositions&&g.playerPositions[id]){delete g.playerPositions[id];changed=true;}
    if(g.playerTasks&&g.playerTasks[id]){delete g.playerTasks[id];changed=true;}
    if(g.noShow&&g.noShow[id]!==undefined){delete g.noShow[id];changed=true;}
    if(changed)_syncConvocatoriaFromGame(g);
  });
  (APP.convocatorias||[]).forEach(c=>{
    if(c.athletes&&c.athletes.includes(id))c.athletes=c.athletes.filter(x=>x!==id);
    if(c.seenBy&&c.seenBy.some(s=>s.athleteId===id))c.seenBy=c.seenBy.filter(s=>s.athleteId!==id);
    if(c.rsvp&&c.rsvp[id])delete c.rsvp[id];
    if(c.djChecks&&c.djChecks[id])delete c.djChecks[id];
  });
  // Convocatórias manuais (sem jogo) que ficaram vazias são removidas — as ligadas a
  // jogo já foram tratadas acima pelo _syncConvocatoriaFromGame (remove se vazio).
  APP.convocatorias=(APP.convocatorias||[]).filter(c=>c.gameId||(c.athletes&&c.athletes.length));
}

  if(!name){sel.value='';return;}

  if(!_compList().some(c=>c.name===name))APP.config.competitions.push({name,icon:'🏅'});
  saveData();
  sel.outerHTML=_compSelectHtml(prefix,name);
  toast('Competição adicionada com ícone genérico 🏅 — podes mudar o ícone em Config');
}

// Estatísticas agregadas da época (Ranking do Plantel + "As Minhas Estatísticas" na
// app da atleta) — reaproveita g.playerStats já preenchido no Pós-Jogo, sem exigir
// nenhum trabalho extra ao treinador. Só jogos Oficiais/Particulares já realizados
// contam (mesmo critério de "realizadosStats" já usado nas estatísticas V/E/D/Golos).
function _seasonGames(){
  const td=today();
  return APP.games.filter(g=>g.tipo!=='treino'&&(g.date<td||g.status==='realizado'));
}
// Agrupa um jogo por "competição" para a separação Total/Taça/Campeonato/Amigáveis —
// reaproveita exatamente a mesma correspondência de prefixo já usada por _jogoIcon,
// para nunca divergir do ícone/nome que o resto da app já mostra por jogo.
function _seasonBucketFor(g){
  if(g.tipo==='particular')return {key:'particular',label:'Amigáveis',icon:'🤝'};
  if(g.comp){
    const match=_compList().find(c=>g.comp===c.name||g.comp.startsWith(c.name+' —')||g.comp.startsWith(c.name+' -'));
    if(match)return {key:match.name,label:match.name,icon:match.icon};
  }
  return {key:'outra',label:'Outras competições',icon:'🏆'};
}
function _rankingScopesList(){
  return [{key:'total',label:'Total',icon:'📊'},
    ..._compList().map(c=>({key:c.name,label:c.name,icon:c.icon})),
    {key:'particular',label:'Amigáveis',icon:'🤝'}];
}
function _seasonStatsFor(aid){
  const games=_seasonGames();
  let jogos=0,mins=0,goals=0,assists=0,yellow=0,red=0;
  const byComp={};
  games.forEach(g=>{
    const st=(g.playerStats||[]).find(s=>s.aid===aid);
    if(!st)return;
    jogos++;mins+=(+st.mins||0);goals+=(+st.goals||0);assists+=(+st.assists||0);yellow+=(+st.yellow||0);red+=(+st.red||0);
    const b=_seasonBucketFor(g);
    if(!byComp[b.key])byComp[b.key]={label:b.label,icon:b.icon,jogos:0,mins:0,goals:0,assists:0,yellow:0,red:0};
    const bc=byComp[b.key];
    bc.jogos++;bc.mins+=(+st.mins||0);bc.goals+=(+st.goals||0);bc.assists+=(+st.assists||0);bc.yellow+=(+st.yellow||0);bc.red+=(+st.red||0);
  });
  return {jogos,mins,goals,assists,yellow,red,byComp};
}
function _seasonStatsAll(){
  const ats=(APP.athletes||[]).filter(a=>a.teamId==='T1'||!a.teamId);
  return ats.map(a=>({at:a,..._seasonStatsFor(a.id)}));
}
// scope='total' usa os totais da época; qualquer outra chave usa o balde correspondente
// de byComp (0 se a atleta não teve jogos nessa competição) — mesma forma de agrupar
// usada no Ranking (staff) e em "As Minhas Estatísticas" (app da atleta).
function _scopedStats(r,scope){
  if(scope==='total')return {jogos:r.jogos,mins:r.mins,goals:r.goals,assists:r.assists,yellow:r.yellow,red:r.red};
  const bc=r.byComp[scope];
  return bc?{jogos:bc.jogos,mins:bc.mins,goals:bc.goals,assists:bc.assists,yellow:bc.yellow,red:bc.red}:{jogos:0,mins:0,goals:0,assists:0,yellow:0,red:0};
}
let _rankingScope='total';
function setRankingScope(key){_rankingScope=key;renderJogos();}
// Mapa de golos acumulado na época — todos os jogos já realizados (mesmo critério
// de _seasonGames), independente da competição escolhida no Ranking (dados ainda
// escassos, não vale a pena complicar com separadores por agora).
function _seasonGoalZoneCounts(){
  const all=[];
  _seasonGames().forEach(g=>{(g.fpfTimeline||[]).forEach(e=>{if(e.type==='golo'&&e.goalZone)all.push(e);});});
  return _gdZoneCounts(all);
}
function _rankingPlantelHtml(){
  const rows=_seasonStatsAll();
  if(!rows.length)return `<div class="empty"><div class="ei">🏆</div><p>Sem atletas no plantel</p></div>`;
  const scopes=_rankingScopesList();
  const tabsHtml=`<div class="tabs" style="margin-bottom:10px">${scopes.map(s=>`<button class="tab-btn ${_rankingScope===s.key?'on':''}" onclick="setRankingScope('${escHtml(s.key)}')">${s.icon} ${escHtml(s.label)}</button>`).join('')}</div>`;
  const scoped=rows.map(r=>({at:r.at,..._scopedStats(r,_rankingScope)})).sort((a,b)=>b.goals-a.goals||b.assists-a.assists||b.mins-a.mins);
  const trs=scoped.map((r,i)=>`<tr>
    <td>${i+1}</td>
    <td><div style="display:flex;align-items:center;gap:6px"><div style="width:20px;height:20px;background:var(--bg3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0">${r.at.number||r.at.num||'?'}</div>${escHtml(r.at.name)}</div></td>
    <td style="text-align:center">${r.jogos}</td>
    <td style="text-align:center">${r.mins}'</td>
    <td style="text-align:center;font-weight:700">${r.goals}</td>
    <td style="text-align:center;font-weight:700">${r.assists}</td>
    <td style="text-align:center">${r.yellow}</td>
    <td style="text-align:center">${r.red}</td>
  </tr>`).join('');
  const zc=_seasonGoalZoneCounts();
  const hasZoneData=Object.values(zc).some(n=>n>0);
  const zoneMapHtml=hasZoneData?`<div class="ipanel" style="margin-top:14px">
    <div class="sh-t" style="font-size:14px;margin-bottom:6px">🎯 Mapa de Golos da Época</div>
    <p style="font-size:11px;color:var(--t2);margin-bottom:8px">Zona de entrada na baliza, golos de todos os jogos já realizados registados via SPS-Gameday.</p>
    ${_gdGoalZoneMapSvg(zc,160)}
  </div>`:'';
  return `${tabsHtml}
  <div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn btn-gh btn-sm" onclick="exportRankingPDF()">📄 Exportar PDF</button></div>
  <div class="tw"><table><thead><tr><th>#</th><th>Atleta</th><th>J</th><th>Min.</th><th>⚽</th><th>🅰️</th><th>🟨</th><th>🟥</th></tr></thead><tbody>${trs}</tbody></table></div>
  <p style="font-size:11px;color:var(--t2);margin-top:8px">Só jogos Oficiais/Particulares já realizados. Ordenado por golos, depois assistências, depois minutos.</p>
  ${zoneMapHtml}`;
}
// PDF com uma tabela por separador (Total + cada competição/Amigáveis) — evita ter de
// exportar um de cada vez; secções sem nenhum jogo do plantel ficam de fora.
function exportRankingPDF(){
  const rows=_seasonStatsAll();
  if(!rows.length)return toast('Sem atletas no plantel','err');
  const scopes=_rankingScopesList();
  const sectionHtml=(scope,label,icon)=>{
    const scoped=rows.map(r=>({at:r.at,..._scopedStats(r,scope)})).filter(r=>scope==='total'||r.jogos>0).sort((a,b)=>b.goals-a.goals||b.assists-a.assists||b.mins-a.mins);
    if(!scoped.length)return '';
    const trs=scoped.map((r,i)=>`<tr><td>${i+1}</td><td>${r.at.number||r.at.num||'?'}</td><td>${escHtml(r.at.name)}</td><td style="text-align:center">${r.jogos}</td><td style="text-align:center">${r.mins}'</td><td style="text-align:center">${r.goals}</td><td style="text-align:center">${r.assists}</td><td style="text-align:center">${r.yellow}</td><td style="text-align:center">${r.red}</td></tr>`).join('');
    return `<h3 style="margin-top:18px">${icon} ${escHtml(label)}</h3>
    <table border="1" cellpadding="6" cellspacing="0" style="width:100%;border-collapse:collapse"><thead style="background:#eee"><tr><th>#</th><th>#Cam.</th><th>Nome</th><th>J</th><th>Min.</th><th>⚽</th><th>🅰️</th><th>🟨</th><th>🟥</th></tr></thead><tbody>${trs}</tbody></table>`;
  };
  const body=scopes.map(s=>sectionHtml(s.key,s.label,s.icon)).join('');
  const zc=_seasonGoalZoneCounts();
  const hasZoneData=Object.values(zc).some(n=>n>0);
  const zoneMapHtml=hasZoneData?`<h3 style="margin-top:22px">🎯 Mapa de Golos da Época</h3>${_gdGoalZoneMapSvg(zc,170,true)}`:'';
  _printWin(`Ranking do Plantel — ${APP.config.season||'Época'}`,
    `<div style="font-family:Arial,sans-serif;padding:20px">
      <div style="text-align:center;border-bottom:3px solid #1a1a2e;padding-bottom:14px;margin-bottom:10px">
        <h1 style="font-size:20px;margin:0">${escHtml(APP.config.clubName||'Clube')}</h1>
        <p style="margin:6px 0 0;font-size:14px;color:#555">🏆 Ranking do Plantel · ${escHtml(APP.config.season||'Época')}</p>
      </div>${body}${zoneMapHtml}</div>`);
}

function openJogo(id,tab='info'){
  const g=APP.games.find(x=>x.id===id);
  if(!g)return;
  _initG(g);saveData();
  // Em modo SPS-Gameday standalone (sps-v78), "Abrir" salta logo para o Ao Vivo em vez do
  // separador Info — é o único motivo de estar nesta app dedicada. Só quando o chamador
  // não pediu já um separador específico (ex. o botão "Convocatória" continua a abrir Pré-Jogo).
  if(tab==='info'&&typeof _forceGamedayMode!=='undefined'&&_forceGamedayMode)tab='aovivo';

// ─── PESQUISA DE EMBLEMA DE CLUBE (Wikipédia PT, ao vivo) ─────────────────
// Usado pelo formulário rápido "Novo Jogo" (jf-*) e pelo separador Info do
// detalhe do jogo (ji-*). Pesquisa por nome, mostra até 6 resultados com
// miniatura do emblema (quando a Wikipédia a tem) e deixa escolher.
// Clubes distritais pequenos normalmente não têm página na Wikipédia — nesse
// caso não aparece nada e o emblema continua a poder ser colado à mão.
let _clubSearchTimer=null,_clubSearchSeq=0;
function _doClubSearch(q,ddId,onSelect){
  clearTimeout(_clubSearchTimer);
  const dd=document.getElementById(ddId);
  if(!dd)return;
  q=(q||'').trim();
  if(q.length<3){dd.style.display='none';dd.innerHTML='';return;}
  const seq=++_clubSearchSeq;
  _clubSearchTimer=setTimeout(async()=>{
    dd.style.display='block';
    dd.innerHTML='<div style="padding:8px 10px;font-size:12px;color:var(--t2)">A procurar...</div>';
    let pages=null;
    try{
      const url='https://pt.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q+' futebol clube')+'&gsrlimit=6&prop=pageimages&piprop=thumbnail&pithumbsize=120&format=json&origin=*';
      const res=await fetch(url);
      const data=await res.json();
      pages=data&&data.query&&data.query.pages?Object.values(data.query.pages).sort((a,b)=>(a.index||0)-(b.index||0)):[];
    }catch(e){pages=null;}
    if(seq!==_clubSearchSeq)return; // resposta desatualizada (utilizador já escreveu mais), ignorar
    if(pages===null){dd.innerHTML='<div style="padding:8px 10px;font-size:12px;color:var(--t2)">Erro na pesquisa — tenta novamente</div>';return;}
    if(!pages.length){dd.innerHTML='<div style="padding:8px 10px;font-size:12px;color:var(--t2)">Sem resultados — cola o link do emblema à mão se precisares</div>';return;}
    dd.innerHTML=pages.map((p,i)=>`<div class="club-sr" data-i="${i}" style="display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer" onmouseover="this.style.background='var(--bg3)'" onmouseout="this.style.background='transparent'">
      <div style="width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--bg3);border-radius:5px;overflow:hidden">${p.thumbnail&&p.thumbnail.source?`<img src="${p.thumbnail.source}" style="width:20px;height:20px;object-fit:contain" onerror="this.style.display='none'">`:'⚽'}</div>
      <span style="font-size:12px">${escHtml((p.title||'').replace(/\s*\(.*?\)\s*$/,''))}</span>
    </div>`).join('');
    [...dd.querySelectorAll('.club-sr')].forEach(el=>{
      el.addEventListener('mousedown',ev=>{
        ev.preventDefault(); // evita que o blur do input feche o dropdown antes do clique registar
        const p=pages[+el.dataset.i];
        const name=(p.title||'').replace(/\s*\(.*?\)\s*$/,'');
        const logo=p.thumbnail&&p.thumbnail.source?p.thumbnail.source:'';
        onSelect(name,logo);
      });
    });
  },350);
}
