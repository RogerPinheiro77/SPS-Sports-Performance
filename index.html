// Histórico de confrontos (H2H) — junta jogos anteriores contra o mesmo adversário
// (por nome normalizado, tolera acentos/maiúsculas) com resultado já registado, mais
// as notas que já existiam no separador Adversário desses jogos. Zero trabalho extra
// para o treinador: só lê o que já está guardado.
function _h2hGames(g){
  const opp=_normName(g.opp);
  if(!opp)return [];
  return APP.games.filter(x=>x.id!==g.id&&_normName(x.opp)===opp&&x.g1!=null&&x.g2!=null)
    .sort((a,b)=>b.date.localeCompare(a.date));
}
function _h2hHtml(g){
  const games=_h2hGames(g);
  if(!games.length)return '';
  const v=games.filter(x=>x.g1>x.g2).length,e=games.filter(x=>x.g1===x.g2).length,d=games.filter(x=>x.g1<x.g2).length;
  const rows=games.map(x=>{
    const res=`${x.g1}–${x.g2}`;
    const won=x.g1>x.g2,drew=x.g1===x.g2;
    const rb=won?`<span class="bdg bg-g">V</span>`:drew?`<span class="bdg bg-y">E</span>`:`<span class="bdg bg-r">D</span>`;
    const notes=[];
    if(x.oppStrengths)notes.push(`<strong style="color:#4ade80">Pontos fortes:</strong> ${escHtml(x.oppStrengths)}`);
    if(x.oppWeaknesses)notes.push(`<strong style="color:#fbbf24">Pontos a explorar:</strong> ${escHtml(x.oppWeaknesses)}`);
    if(x.oppSetPieces)notes.push(`<strong style="color:#38bdf8">Bolas paradas:</strong> ${escHtml(x.oppSetPieces)}`);
    const tCount=(x.oppTactical&&x.oppTactical.snapshots)?x.oppTactical.snapshots.length:0;
    if(tCount)notes.push(`<strong style="color:#e74c3c">🧩 ${tCount} registo${tCount!==1?'s':''} tático${tCount!==1?'s':''}</strong> guardado${tCount!==1?'s':''} no separador Adversário desse jogo`);
    return `<div style="padding:9px 0;border-bottom:1px solid var(--brd)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:12px">${fmtDate(x.date)}${x.comp?' · '+escHtml(x.comp):''}</div>
        <div style="display:flex;align-items:center;gap:6px"><span style="font-size:12px;font-weight:700">${res}</span>${rb}</div>
      </div>
      ${notes.length?`<div style="font-size:11px;color:var(--t2);margin-top:4px;line-height:1.5">${notes.join('<br>')}</div>`:'<div style="font-size:11px;color:var(--t2);margin-top:4px">Sem notas guardadas nesse jogo.</div>'}
    </div>`;
  }).join('');
  return `<div class="ipanel" style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <div class="sh-t" style="font-size:15px">🔁 Últimos Confrontos — ${escHtml(g.opp)}</div>
      <span class="bdg" style="background:rgba(29,111,59,.18);color:var(--c1l)">${v}V · ${e}E · ${d}D</span>
    </div>
    ${rows}
  </div>`;
}
// ============================================================
// Quadros visuais do Adversário (26/08/2026) — o adjunto arrasta 11 marcadores
// genéricos (sem nomes, não temos o plantel deles) para a posição que observa e
// carrega em "Registar Posicionamento": fica uma fotografia (galeria cronológica)
// com o minuto (automático se o SPS-Gameday estiver a decorrer nesse jogo) e uma
// nota opcional. Pensado para usar ao intervalo/durante o jogo — mesma mecânica de
// arrastar já usada no Campo Tático da equipa (pitchDragStart/Move/End), só que
// aqui cada "Registar" cria uma cópia nova em vez de sobrescrever a posição atual,
// para nunca perder o histórico de como foram mudando ao longo do jogo. Mesmo
// mecanismo para o esquema tático (campo inteiro) e para as bolas paradas
// observadas (só terço de ataque, 3 abas — igual às da própria equipa).
const _OPP_TATICO_DEFAULT=[[150,395],[40,330],[105,330],[195,330],[260,330],[40,210],[105,210],[195,210],[260,210],[105,90],[195,90]];
function _oppDefaultPos(board,i){
  if(board==='tatico')return _OPP_TATICO_DEFAULT[i]||[150,210];
  return _pitchDefaultPos(board,i,null);
}
function _oppPosFor(g,board){
  if(board==='tatico'){
    if(!g.oppTactical)g.oppTactical={positions:{},snapshots:[]};
    if(!g.oppTactical.positions)g.oppTactical.positions={};
    if(!g.oppTactical.snapshots)g.oppTactical.snapshots=[];
    return g.oppTactical;
  }
  if(!g.oppSPBoards)g.oppSPBoards={cornerOf:{positions:{},snapshots:[]},cornerDef:{positions:{},snapshots:[]},freeKick:{positions:{},snapshots:[]}};
  if(!g.oppSPBoards[board])g.oppSPBoards[board]={positions:{},snapshots:[]};
  return g.oppSPBoards[board];
}
// Plantel do adversário por número (27/08/2026) — para além dos quadros de posição
// acima (arrastar marcadores num campo), o registo ao vivo (SPS-Gameday) precisa de
// uma forma rápida de dizer "isto foi da nº9 deles" sem termos o plantel real. Lista
// fixa de 11 números com uma posição por defeito (editável no ecrã Ao Vivo) — nunca é
// obrigatório preencher, só ajuda a identificar depois se houver tempo.
const _OPP_ROSTER_DEFAULT=[[1,'GR'],[2,'LT Dir'],[3,'DC Dir'],[4,'DC Esq'],[5,'LT Esq'],[6,'MDF'],[7,'Ext Dir'],[8,'MC'],[9,'PL'],[10,'MOF'],[11,'Ext Esq']];
function _oppRosterFor(g){
  if(!g.oppRoster||!Array.isArray(g.oppRoster)||g.oppRoster.length!==11){
    g.oppRoster=_OPP_ROSTER_DEFAULT.map(([num,pos])=>({num,pos}));
  }
  return g.oppRoster;
}
function _oppMarkersHtml(g,board){
  const store=_oppPosFor(g,board);
  const rad=7,numFs=7,sw=1.5;
  let html='';
  for(let i=1;i<=11;i++){
    const def=_oppDefaultPos(board,i-1);
    const pos=store.positions[i]||{x:def[0],y:def[1]};
    html+=`<g data-num="${i}" transform="translate(${pos.x},${pos.y})" style="cursor:grab" onmousedown="oppDragStart(event,'${g.id}','${board}',${i})">
      <circle r="${rad}" fill="#e74c3c" stroke="white" stroke-width="${sw}"/>
      <text text-anchor="middle" dy="2.5" font-size="${numFs}" font-weight="bold" fill="white">${i}</text>
    </g>`;
  }
  return html;
}
let _oppDragging=null,_oppWasDrag=false;
function oppDragStart(e,gid,board,num){
  e.preventDefault();e.stopPropagation();
  _oppWasDrag=false;
  const svg=document.getElementById('opp-pitch-'+board+'-'+gid);if(!svg)return;
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const svgP=pt.matrixTransform(svg.getScreenCTM().inverse());
  const g=APP.games.find(x=>x.id===gid);if(!g)return;
  const store=_oppPosFor(g,board);
  const def=_oppDefaultPos(board,num-1);
  const pos=store.positions[num]||{x:def[0],y:def[1]};
  _oppDragging={gid,board,num,sx:svgP.x,sy:svgP.y,ox:pos.x,oy:pos.y};
}
function oppDragMove(e){
  if(!_oppDragging)return;
  const svg=document.getElementById('opp-pitch-'+_oppDragging.board+'-'+_oppDragging.gid);if(!svg)return;
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const svgP=pt.matrixTransform(svg.getScreenCTM().inverse());
  const dx=svgP.x-_oppDragging.sx,dy=svgP.y-_oppDragging.sy;
  if(Math.abs(dx)>4||Math.abs(dy)>4)_oppWasDrag=true;
  const maxY=_oppDragging.board==='tatico'?410:_pitchMaxY(_oppDragging.board);
  const nx=Math.max(16,Math.min(284,_oppDragging.ox+dx));
  const ny=Math.max(16,Math.min(maxY,_oppDragging.oy+dy));
  const el=svg.querySelector('[data-num="'+_oppDragging.num+'"]');
  if(el)el.setAttribute('transform','translate('+nx.toFixed(1)+','+ny.toFixed(1)+')');
}
function oppDragEnd(e){
  if(!_oppDragging)return;
  if(_oppWasDrag&&e.clientX!==undefined){
    const svg=document.getElementById('opp-pitch-'+_oppDragging.board+'-'+_oppDragging.gid);
    if(svg){
      const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
      const svgP=pt.matrixTransform(svg.getScreenCTM().inverse());
      const dx=svgP.x-_oppDragging.sx,dy=svgP.y-_oppDragging.sy;
      const maxY=_oppDragging.board==='tatico'?410:_pitchMaxY(_oppDragging.board);
      const nx=Math.max(16,Math.min(284,_oppDragging.ox+dx));
      const ny=Math.max(16,Math.min(maxY,_oppDragging.oy+dy));
      const g=APP.games.find(x=>x.id===_oppDragging.gid);
      if(g){_oppPosFor(g,_oppDragging.board).positions[_oppDragging.num]={x:nx,y:ny};saveData();}
    }
  }
  _oppDragging=null;
}
function _oppSnapshot(gid,board){
  const g=APP.games.find(x=>x.id===gid);if(!g)return;
  const store=_oppPosFor(g,board);
  const noteEl=document.getElementById('opp-note-'+board+'-'+gid);
  const note=noteEl?noteEl.value:'';
  let minRaw=null;
  if(g.liveSession&&_gdRunning(g.liveSession))minRaw=_gdMinLabel(_gdElapsedSec(g.liveSession));
  const positions={};
  for(let i=1;i<=11;i++){const def=_oppDefaultPos(board,i-1);positions[i]=store.positions[i]?{...store.positions[i]}:{x:def[0],y:def[1]};}
  store.snapshots.push({id:uid(),minRaw,note,positions});
  saveData();toast('Posicionamento registado ✓');
  _renderJogoDetailFull();
}
function _oppLoadSnapshot(gid,board,snapId){
  const g=APP.games.find(x=>x.id===gid);if(!g)return;
  const store=_oppPosFor(g,board);
  const snap=store.snapshots.find(s=>s.id===snapId);if(!snap)return;
  store.positions={};
  Object.keys(snap.positions).forEach(k=>{store.positions[k]={...snap.positions[k]};});
  saveData();toast('Posicionamento carregado — ajusta e regista de novo');
  _renderJogoDetailFull();
}
function _oppDeleteSnapshot(gid,board,snapId){
  const g=APP.games.find(x=>x.id===gid);if(!g)return;
  if(!confirm('Apagar este registo da galeria?'))return;
  const store=_oppPosFor(g,board);
  store.snapshots=store.snapshots.filter(s=>s.id!==snapId);
  saveData();_renderJogoDetailFull();
}
function _oppThumbSvg(board,positions){
  const isTatico=board==='tatico';
  const W=300,H=isTatico?420:200;
  let dots='';
  for(let i=1;i<=11;i++){
    const def=_oppDefaultPos(board,i-1);
    const p=positions[i]||{x:def[0],y:def[1]};
    dots+=`<circle cx="${p.x}" cy="${p.y}" r="9" fill="#e74c3c" stroke="white" stroke-width="1.5"/><text x="${p.x}" y="${(p.y+3).toFixed(1)}" text-anchor="middle" font-size="8" font-weight="bold" fill="white">${i}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:60px;background:#0f3d24;border-radius:4px;display:block">${dots}</svg>`;
}
function _oppGalleryHtml(g,board){
  const store=_oppPosFor(g,board);
  if(!store.snapshots.length)return '<p style="font-size:11px;color:var(--t2)">Ainda sem registos.</p>';
  return `<div style="display:flex;gap:8px;flex-wrap:wrap">${store.snapshots.map(s=>`<div style="background:var(--bg2);border:1px solid var(--brd);border-radius:8px;padding:6px;width:92px;text-align:center;flex-shrink:0">
      <div onclick="_oppLoadSnapshot('${g.id}','${board}','${s.id}')" style="cursor:pointer" title="Toca para continuar a partir daqui">${_oppThumbSvg(board,s.positions)}</div>
      <div style="font-size:9px;font-weight:700;margin-top:4px">${s.minRaw?escHtml(s.minRaw):'—'}</div>
      ${s.note?`<div style="font-size:8px;color:var(--t2);margin-top:2px;line-height:1.3">${escHtml(s.note)}</div>`:''}
      <button class="btn btn-xs btn-r" style="margin-top:4px;padding:1px 4px;font-size:9px" onclick="_oppDeleteSnapshot('${g.id}','${board}','${s.id}')">🗑️</button>
    </div>`).join('')}</div>`;
}
// SVG grande (não-interativo) de um snapshot guardado — para o PDF. Usa o mesmo
// fundo/proporção do quadro ao vivo e o mesmo rácio dimensional dos marcadores
// (rad/numFs/sw) já usado em _oppMarkersHtml, para nunca divergir visualmente.
function _oppSnapshotSvg(board,positions,w){
  w=w||190;
  const isTatico=board==='tatico';
  const vbH=isTatico?420:200;
  const h=Math.round(w*(vbH/300));
  const rad=7,numFs=7,sw=1.5;
  const bg=isTatico?`<rect width="300" height="420" fill="#0f3d24" rx="8"/>
      <rect x="6" y="6" width="288" height="408" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.5"/>
      <line x1="6" y1="210" x2="294" y2="210" stroke="rgba(255,255,255,.3)" stroke-width="1.2"/>`
    :`<rect width="300" height="420" fill="#0f3d24" rx="8"/>
      <rect x="15" y="15" width="270" height="390" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/>
      <rect x="88" y="15" width="124" height="68" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/>
      <rect x="122" y="15" width="56" height="26" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/>`;
  let dots='';
  for(let i=1;i<=11;i++){
    const def=_oppDefaultPos(board,i-1);
    const p=positions[i]||{x:def[0],y:def[1]};
    dots+=`<circle cx="${p.x}" cy="${p.y}" r="${rad}" fill="#e74c3c" stroke="white" stroke-width="${sw}"/><text x="${p.x}" y="${(p.y+2.5).toFixed(1)}" text-anchor="middle" font-size="${numFs}" font-weight="bold" fill="white">${i}</text>`;
  }
  return `<svg viewBox="0 0 300 ${vbH}" style="width:${w}px;height:${h}px;display:block;border-radius:6px">${bg}${dots}</svg>`;

function toggleConvocado(gid,aid,checked){
  const g=APP.games.find(x=>x.id===gid);if(!g)return;_initG(g);
  if(checked){if(!g.convocatoria.includes(aid))g.convocatoria.push(aid);}
  else{g.convocatoria=g.convocatoria.filter(x=>x!==aid);g.lineup=g.lineup.filter(x=>x!==aid);g.subs=g.subs.filter(x=>x!==aid);if(g.captain===aid)g.captain='';if(g.viceCaptain===aid)g.viceCaptain='';}
  _syncConvocatoriaFromGame(g);saveData();_renderJogoDetailFull();
}

function convocarTodasAtletas(gid){
  const g=APP.games.find(x=>x.id===gid);if(!g)return;_initG(g);
  // Preserva convocadas avulsas de outras equipas já adicionadas — "Convocar Todas"
  // só deve completar a equipa própria, nunca apagar convidadas (ver addGuestConvocado).
  const guests=g.convocatoria.filter(aid=>{const a=APP.athletes.find(x=>x.id===aid);return a&&a.teamId!==g.teamId;});
  g.convocatoria=[...APP.athletes.filter(a=>a.teamId===g.teamId).map(a=>a.id),...guests];

function desconvocarTodasAtletas(gid){

  g.convocatoria=[];g.lineup=[];g.subs=[];g.captain='';g.viceCaptain='';g.convocatoriaLaunched=false;

function setFaltouMotivo(gid,aid,val){

// Como saveJogoField() acima, mas com re-render — usado só para

// 4 campos táticos interativos por jogo: o principal (formação/onze, g.playerPositions
// +g.playerTasks, como sempre existiu) e 3 de bolas paradas (Canto Defensivo/Ofensivo,
// Livre), cada um com posições e tarefas próprias em g.setpiecePositions/g.setpieceTasks
// — pedido do Roger, 24/08/2026, para poder montar rotinas específicas por fase de jogo.
const _SETPIECE_TABS=[['tatico','🏟️ Tático'],['cornerDef','🔴 Canto Defensivo'],['cornerOf','🔵 Canto Ofensivo'],['freeKick','🎯 Livre']];
let _jogoCampoTab='tatico';
function _pitchPos(g,mode){
  if(mode==='tatico'){if(!g.playerPositions)g.playerPositions={};return g.playerPositions;}
  if(!g.setpiecePositions)g.setpiecePositions={cornerDef:{},cornerOf:{},freeKick:{}};
  if(!g.setpiecePositions[mode])g.setpiecePositions[mode]={};
  return g.setpiecePositions[mode];
}
function _pitchTasks(g,mode){
  if(mode==='tatico'){if(!g.playerTasks)g.playerTasks={};return g.playerTasks;}
  if(!g.setpieceTasks)g.setpieceTasks={cornerDef:{},cornerOf:{},freeKick:{}};
  if(!g.setpieceTasks[mode])g.setpieceTasks[mode]={};
  return g.setpieceTasks[mode];
}
// Posição inicial de cada atleta: grelha simples dentro da metade de campo visível, igual
// nos 4 quadros — o treinador arrasta cada atleta para a posição/sistema que quiser. O
// tático deixou de ter formações predefinidas (4-3-3 etc.), pedido do Roger 24/08/2026,
// para ficar consistente com os 3 quadros de bolas paradas (só meio campo).
function _pitchDefaultPos(mode,i,formation){
  return [40+(i%4)*70,110+Math.floor(i/4)*35];
}
// Altura máxima de arrasto (eixo Y) — os 4 quadros mostram só meio campo (área+baliza),
// por isso o limite é sempre o mesmo, curto.
function _pitchMaxY(mode){return 190;}
// Galeria cronológica também na própria equipa (não só no Adversário) — pedido do Roger,
// 26/08/2026: começa com o que está definido na plataforma, mas durante o jogo dá para
// ir ajustando a estrutura (incl. bolas paradas) e gerar "prints", tal como já acontece
// com o Adversário. Mesma mecânica, dados diferentes: aqui guarda-se por ID de atleta
// real (não número genérico 1-11), porque os 4 quadros da equipa já usam esse modelo.
function _pitchSnapshotsFor(g,mode){
  if(mode==='tatico'){if(!g.tacticoSnapshots)g.tacticoSnapshots=[];return g.tacticoSnapshots;}
  if(!g.setpieceSnapshots)g.setpieceSnapshots={cornerDef:[],cornerOf:[],freeKick:[]};
  if(!g.setpieceSnapshots[mode])g.setpieceSnapshots[mode]=[];
  return g.setpieceSnapshots[mode];
}
function _pitchSnapshot(gid,mode){
  const g=APP.games.find(x=>x.id===gid);if(!g)return;
  if(!g.lineup||!g.lineup.length)return toast('Define o onze no Pré-Jogo primeiro','err');
  const posMap=_pitchPos(g,mode),taskMap=_pitchTasks(g,mode);
  const maxY=_pitchMaxY(mode);
  const noteEl=document.getElementById('pitch-note-'+mode+'-'+gid);
  const note=noteEl?noteEl.value:'';
  let minRaw=null;
  if(g.liveSession&&_gdRunning(g.liveSession))minRaw=_gdMinLabel(_gdElapsedSec(g.liveSession));
  const sortedLineup=g.lineup.map(aid=>({aid,a:APP.athletes.find(x=>x.id===aid)})).filter(x=>x.a)
    .sort((x,y)=>(+(x.a.number||x.a.num)||999)-(+(y.a.number||y.a.num)||999));
  const positions={},tasks={};
  sortedLineup.forEach(({aid},i)=>{
    const def=_pitchDefaultPos(mode,i,g.formation);
    const raw=posMap[aid]||{x:def[0],y:def[1]};
    positions[aid]={x:raw.x,y:Math.min(raw.y,maxY)};
    if(taskMap[aid])tasks[aid]=taskMap[aid];
  });
  _pitchSnapshotsFor(g,mode).push({id:uid(),minRaw,note,positions,tasks,lineup:sortedLineup.map(x=>x.aid)});
  saveData();toast('Posicionamento registado ✓');
  _renderJogoDetailFull();
}
function _pitchLoadSnapshot(gid,mode,snapId){
  const g=APP.games.find(x=>x.id===gid);if(!g)return;
  const snap=_pitchSnapshotsFor(g,mode).find(s=>s.id===snapId);if(!snap)return;
  const posMap=_pitchPos(g,mode),taskMap=_pitchTasks(g,mode);
  Object.keys(snap.positions).forEach(aid=>{posMap[aid]={...snap.positions[aid]};});
  Object.keys(snap.tasks||{}).forEach(aid=>{taskMap[aid]=snap.tasks[aid];});
  saveData();toast('Posicionamento carregado — ajusta e regista de novo');
  _renderJogoDetailFull();
}
function _pitchDeleteSnapshot(gid,mode,snapId){
  const g=APP.games.find(x=>x.id===gid);if(!g)return;
  if(!confirm('Apagar este registo da galeria?'))return;
  const snaps=_pitchSnapshotsFor(g,mode);
  const idx=snaps.findIndex(s=>s.id===snapId);
  if(idx>=0)snaps.splice(idx,1);
  saveData();_renderJogoDetailFull();
}
// SVG de um snapshot guardado (fundo/campo idêntico ao quadro ao vivo — ver
// _jogoCampoHtml — e mesmo esquema de cor GR/jogadora de linha). w controla o tamanho;
// usado tanto nas miniaturas da galeria como no PDF (tamanho maior).
function _pitchSnapshotSvg(mode,snap,w){
  w=w||190;
  const isTatico=mode==='tatico';
  const h=Math.round(w*(200/300));
  const rad=7,numFs=7,sw=1.5;
  const bg=`<rect width="300" height="420" fill="#2d7a2d" rx="8"/>
    <rect x="15" y="15" width="270" height="390" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/>
    <line x1="15" y1="210" x2="285" y2="210" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/>
    <circle cx="150" cy="210" r="38" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/>
    <circle cx="150" cy="210" r="3" fill="rgba(255,255,255,.45)"/>
    <rect x="88" y="15" width="124" height="68" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/>
    <rect x="88" y="317" width="124" height="68" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/>
    <rect x="122" y="15" width="56" height="26" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/>
    <rect x="122" y="359" width="56" height="26" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/>
    <rect x="132" y="8" width="36" height="9" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2"/>
    <rect x="132" y="403" width="36" height="9" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2"/>
    <circle cx="150" cy="58" r="2.5" fill="rgba(255,255,255,.45)"/>
    <circle cx="150" cy="362" r="2.5" fill="rgba(255,255,255,.45)"/>`;
  const lineup=snap.lineup||Object.keys(snap.positions);
  let dots='';
  lineup.forEach(aid=>{
    const a=APP.athletes.find(x=>x.id===aid);const p=snap.positions[aid];
    if(!a||!p)return;
    const isGK=a.pos==='GR';
    const fill=isGK?'#27ae60':'#ffd700';
    const tf=isGK?'#fff':'#1a1a2e';
    dots+=`<circle cx="${p.x}" cy="${p.y}" r="${rad}" fill="${fill}" stroke="white" stroke-width="${sw}"/><text x="${p.x}" y="${(p.y+2.5).toFixed(1)}" text-anchor="middle" font-size="${numFs}" font-weight="bold" fill="${tf}">${a.number||a.num||'?'}</text>`;
    if(isTatico)dots+=`<text x="${p.x}" y="${(p.y+16).toFixed(1)}" text-anchor="middle" font-size="6.5" fill="rgba(255,255,255,.9)">${escHtml(_shortName(a))}</text>`;
  });
  return `<svg viewBox="0 0 300 200" style="width:${w}px;height:${h}px;display:block;border-radius:6px">${bg}${dots}</svg>`;
}
function _pitchGalleryHtml(g,mode){
  const snaps=_pitchSnapshotsFor(g,mode);
  if(!snaps.length)return '<p style="font-size:11px;color:var(--t2)">Ainda sem registos.</p>';
  return `<div style="display:flex;gap:8px;flex-wrap:wrap">${snaps.map(s=>`<div style="background:var(--bg2);border:1px solid var(--brd);border-radius:8px;padding:6px;width:92px;text-align:center;flex-shrink:0">
      <div onclick="_pitchLoadSnapshot('${g.id}','${mode}','${s.id}')" style="cursor:pointer" title="Toca para continuar a partir daqui">${_pitchSnapshotSvg(mode,s,80)}</div>
      <div style="font-size:9px;font-weight:700;margin-top:4px">${s.minRaw?escHtml(s.minRaw):'—'}</div>
      ${s.note?`<div style="font-size:8px;color:var(--t2);margin-top:2px;line-height:1.3">${escHtml(s.note)}</div>`:''}
      <button class="btn btn-xs btn-r" style="margin-top:4px;padding:1px 4px;font-size:9px" onclick="_pitchDeleteSnapshot('${g.id}','${mode}','${s.id}')">🗑️</button>
    </div>`).join('')}</div>`;
}
function _jogoCampoHtml(g){
  const PW=300,PH=420;
  const mode=_jogoCampoTab;
  const posMap=_pitchPos(g,mode),taskMap=_pitchTasks(g,mode);
  const modeTabs=_SETPIECE_TABS.map(([k,lb])=>`<button class="tab-btn ${mode===k?'on':''}" onclick="_jogoCampoTab='${k}';_renderJogoDetailFull()">${lb}</button>`).join('');
  const modeLabel=(_SETPIECE_TABS.find(([k])=>k===mode)||['',''])[1]||'Campo';
  // Os 4 quadros mostram só meio campo, com a mesma grelha e círculos pequenos — o
  // tático deixou de ter formações predefinidas, pedido do Roger 24/08/2026 (antes só
  // se distinguia dos 3 de bolas paradas por mostrar o campo inteiro + formação 4-3-3
  // etc.). A única diferença que se mantém: o tático mostra número + alcunha por baixo
  // do círculo, os outros 3 só número (espaço mais apertado, ver [[project_sps_campo_tatico_4_quadros]]).
  const showName=mode==='tatico';
  const rad=7,numFs=7,sw=1.5,capFs=7,capOff=6,capY=-7;
  const maxY=_pitchMaxY(mode);
  // Ordem pelo número da camisola (não pela ordem em que foram clicadas como titulares
  // no Pré-Jogo) — pedido do Roger, 24/08/2026: os números devem manter-se consistentes
  // com o número real de cada jogadora, em vez de aparecerem numa ordem arbitrária.
  // isGK passa a olhar para a posição real (GR) em vez de "primeira da lista", que deixou
  // de ser fiável depois desta reordenação.
  const sortedLineup=g.lineup.map(aid=>({aid,a:APP.athletes.find(x=>x.id===aid)})).filter(x=>x.a)
    .sort((x,y)=>(+(x.a.number||x.a.num)||999)-(+(y.a.number||y.a.num)||999));
  const players=sortedLineup.map(({aid,a},i)=>{
    const def=_pitchDefaultPos(mode,i,g.formation);
    const rawPos=posMap[aid]||{x:def[0],y:def[1]};
    // Clamp defensivo: jogos que já tinham posições táticas guardadas no campo inteiro
    // (antes desta mudança) ficariam fora da área visível do meio-campo — em vez de
    // desaparecerem, aparecem encostadas ao limite, prontas a re-arrastar.
    const pos={x:rawPos.x,y:Math.min(rawPos.y,maxY)};
    const isCap=g.captain===aid,isVc=g.viceCaptain===aid,isGK=a.pos==='GR';
    const fill=isGK?'#27ae60':'#ffd700';
    const tf=isGK?'#fff':'#1a1a2e';
    const nm=escHtml(_shortName(a));
    const task=taskMap[aid]||'';
    return `<g class="pitch-pl" data-aid="${aid}" data-gid="${g.id}" transform="translate(${pos.x},${pos.y})" style="cursor:grab" onmousedown="pitchDragStart(event,'${g.id}','${aid}','${mode}')" onclick="pitchPlayerClick(event,'${g.id}','${aid}','${mode}')">
      <circle r="${rad}" fill="${fill}" stroke="white" stroke-width="${sw}"/>
      <text text-anchor="middle" dy="2.5" font-size="${numFs}" font-weight="bold" fill="${tf}">${a.number||a.num||i+1}</text>

// PDF de um único quadro do Campo Tático (o que estiver aberto no momento) — usa o
// próprio SVG já desenhado no ecrã (com as posições atuais) + uma legenda por baixo com
// número/alcunha/tarefa de cada titular, porque nos 3 quadros de bolas paradas o desenho
// só mostra números. Pedido do Roger, 24/08/2026 — "individualmente", um PDF por quadro.
// Layout vertical numa só página A4 (24/08/2026): campo grande em cima a ocupar quase
// toda a largura, legenda compacta por baixo, e uma caixa de Notas no fundo com o texto
// escrito no painel "Notas" desse quadro (g.pitchNotes[mode]) — em vez de linhas em
// branco, mostra o que o Roger escreveu ali.
function printJogoCampo(gid){
  const g=APP.games.find(x=>x.id===gid);if(!g)return;
  const mode=_jogoCampoTab;
  const svgEl=document.getElementById('pitch-svg-'+gid);
  if(!svgEl)return toast('Campo não encontrado','err');
  const svgHtml=svgEl.outerHTML
    .replace(/\son(?:mousedown|mousemove|mouseup|mouseleave|click)="[^"]*"/g,'')
    .replace(/style="[^"]*"/,'style="width:100%;display:block;border-radius:6px"');
  const label=(_SETPIECE_TABS.find(([k])=>k===mode)||['',''])[1]||'Campo';
  const taskMap=_pitchTasks(g,mode);
  // Mesma ordem por número de camisola do quadro em ecrã (ver _jogoCampoHtml).
  const sortedLineup=g.lineup.map(aid=>({aid,a:APP.athletes.find(x=>x.id===aid)})).filter(x=>x.a)
    .sort((x,y)=>(+(x.a.number||x.a.num)||999)-(+(y.a.number||y.a.num)||999));
  const legendRows=sortedLineup.map(({aid,a})=>{
    const task=taskMap[aid]||'';
    return `<tr><td style="padding:3px 6px;font-size:8pt;width:24px;text-align:center;font-weight:700">${a.number||a.num||'—'}</td><td style="padding:3px 6px;font-size:8pt">${escHtml(_shortName(a))}</td><td style="padding:3px 6px;font-size:8pt">${escHtml(task)||'—'}</td></tr>`;
  }).join('');
  const notes=(g.pitchNotes&&g.pitchNotes[mode])||'';
  const title=`${label} — vs ${escHtml(g.opp)} (${fmtDate(g.date)})`;
  const body=`
    <div class="pr-title">${title}</div>
    <div style="max-width:170mm;margin:0 auto 10px">${svgHtml}</div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:0">
      <thead><tr><th style="padding:3px 6px;font-size:8pt">Nº</th><th style="padding:3px 6px;font-size:8pt">Atleta</th><th style="padding:3px 6px;font-size:8pt">Tarefa</th></tr></thead>
      <tbody>${legendRows||'<tr><td colspan="3" style="text-align:center;color:#999;padding:6px">Sem titulares definidos</td></tr>'}</tbody>
    </table>
    <div style="margin-top:10px;border:0.5px solid #ccc;border-radius:4px;padding:8px 10px;min-height:22mm">
      <div style="font-size:9pt;font-weight:700;color:#1d6f3b;margin-bottom:4px">Notas</div>
      <div style="font-size:8.5pt;white-space:pre-wrap;line-height:1.5">${notes?escHtml(notes):''}</div>
    </div>
  `;
  _printWin(title,body);
}
function setFormation(gid,f){
  const g=APP.games.find(x=>x.id===gid);if(!g)return;
  g.formation=f;
  const preset=_FPOS[f]||_FPOS['4-3-3'];
  g.playerPositions={};
  g.lineup.forEach((aid,i)=>{if(preset[i])g.playerPositions[aid]={x:preset[i][0],y:preset[i][1]};});
  saveData();_renderJogoDetailFull();
}

function savePlayerTask(gid,aid,val,mode){
  const g=APP.games.find(x=>x.id===gid);if(!g)return;
  _pitchTasks(g,mode||'tatico')[aid]=val;saveData();
}

function saveSetPiece(gid,type,val){
  const g=APP.games.find(x=>x.id===gid);if(!g)return;
  if(!g.setpieces)g.setpieces={corners:'',freeKicks:'',penalty:''};
  g.setpieces[type]=val;saveData();
}

function savePitchNotes(gid,mode,val){
  const g=APP.games.find(x=>x.id===gid);if(!g)return;
  if(!g.pitchNotes)g.pitchNotes={tatico:'',cornerDef:'',cornerOf:'',freeKick:''};
  g.pitchNotes[mode]=val;saveData();
}

function pitchDragStart(e,gid,aid,mode){
  e.preventDefault();e.stopPropagation();
  _pitchWasDrag=false;
  mode=mode||_jogoCampoTab||'tatico';
  const svg=document.getElementById('pitch-svg-'+gid);if(!svg)return;
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const svgP=pt.matrixTransform(svg.getScreenCTM().inverse());
  const g=APP.games.find(x=>x.id===gid);
  const pos=(g&&_pitchPos(g,mode)[aid])||{x:150,y:210};
  _pitchDragging={gid,aid,mode,sx:svgP.x,sy:svgP.y,ox:pos.x,oy:pos.y};
}

function pitchDragMove(e){
  if(!_pitchDragging)return;
  const svg=document.getElementById('pitch-svg-'+_pitchDragging.gid);if(!svg)return;
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const svgP=pt.matrixTransform(svg.getScreenCTM().inverse());
  const dx=svgP.x-_pitchDragging.sx,dy=svgP.y-_pitchDragging.sy;
  if(Math.abs(dx)>4||Math.abs(dy)>4)_pitchWasDrag=true;
  const nx=Math.max(16,Math.min(284,_pitchDragging.ox+dx));
  const ny=Math.max(16,Math.min(_pitchMaxY(_pitchDragging.mode),_pitchDragging.oy+dy));
  const el=svg.querySelector('[data-aid="'+_pitchDragging.aid+'"]');
  if(el)el.setAttribute('transform','translate('+nx.toFixed(1)+','+ny.toFixed(1)+')');
}

function pitchDragEnd(e){
  if(!_pitchDragging)return;
  if(_pitchWasDrag){
    const svg=document.getElementById('pitch-svg-'+_pitchDragging.gid);
    if(svg&&e.clientX!==undefined){
      const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
      const svgP=pt.matrixTransform(svg.getScreenCTM().inverse());
      const dx=svgP.x-_pitchDragging.sx,dy=svgP.y-_pitchDragging.sy;
      const nx=Math.max(16,Math.min(284,_pitchDragging.ox+dx));
      const ny=Math.max(16,Math.min(_pitchMaxY(_pitchDragging.mode),_pitchDragging.oy+dy));
      const g=APP.games.find(x=>x.id===_pitchDragging.gid);
      if(g){_pitchPos(g,_pitchDragging.mode||'tatico')[_pitchDragging.aid]={x:nx,y:ny};saveData();}
    }
  }
  _pitchDragging=null;
}

function pitchPlayerClick(e,gid,aid,mode){
  if(_pitchWasDrag){_pitchWasDrag=false;return;}
  mode=mode||_jogoCampoTab||'tatico';
  const a=APP.athletes.find(x=>x.id===aid);if(!a)return;
  const g=APP.games.find(x=>x.id===gid);if(!g)return;
  const taskMap=_pitchTasks(g,mode);
  const task=taskMap[aid]||'';
  const nt=prompt('Tarefa tática — '+a.name+':',task);
  if(nt!==null){
    taskMap[aid]=nt;saveData();
    const svg=document.getElementById('pitch-svg-'+gid);
    if(svg){const ttl=svg.querySelector('[data-aid="'+aid+'"] title');if(ttl)ttl.textContent=a.name+(nt?' — '+nt:'');}
    document.querySelectorAll('input[onblur*="\''+aid+'\'"]').forEach(inp=>{inp.value=nt;});
  }
}

function _initPitchEvents(gid){
  const svg=document.getElementById('pitch-svg-'+gid);if(!svg)return;
  svg.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    const t=e.touches[0],target=t.target.closest('.pitch-pl');
    if(target){e.preventDefault();pitchDragStart({clientX:t.clientX,clientY:t.clientY,preventDefault:()=>{},stopPropagation:()=>{}},gid,target.dataset.aid,_jogoCampoTab);}
  },{passive:false});
  svg.addEventListener('touchmove',e=>{
    if(!_pitchDragging||e.touches.length!==1)return;
    e.preventDefault();pitchDragMove({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});
  },{passive:false});
  svg.addEventListener('touchend',e=>{
    if(!_pitchDragging)return;
    const t=e.changedTouches[0];
    const dgid=_pitchDragging.gid,daid=_pitchDragging.aid,dmode=_pitchDragging.mode||'tatico',wasD=_pitchWasDrag;
    pitchDragEnd({clientX:t.clientX,clientY:t.clientY});
    if(!wasD){
      const a=APP.athletes.find(x=>x.id===daid);
      const g=APP.games.find(x=>x.id===dgid);
      if(a&&g){const taskMap=_pitchTasks(g,dmode);const task=taskMap[daid]||'';const nt=prompt('Tarefa — '+a.name+':',task);
      if(nt!==null){taskMap[daid]=nt;saveData();}}
    }
  });
}

  const rows=evs.map(e=>{

function _gdCountByType(events){

// Mapa de zonas de golo: mini-baliza 3×3 com a contagem por zona, reaproveita

function _gdZoneCounts(entries){
  const c={};_GD_GOAL_ZONES.forEach(z=>{c[z[0]]=0;});
  (entries||[]).forEach(e=>{if(e.goalZone&&c[e.goalZone]!==undefined)c[e.goalZone]++;});
  return c;
}
function _gdGoalZoneMapSvg(counts,w,light){
  w=w||140;const h=w*0.6;
  const max=Math.max(1,..._GD_GOAL_ZONES.map(z=>counts[z[0]]||0));
  const stroke=light?'#999':'rgba(255,255,255,.4)';
  const textFill=light?'#1d6f3b':'#fff';
  const borderCol=light?'#999':'rgba(255,255,255,.5)';
  const cells=_GD_GOAL_ZONES.map((z,i)=>{
    const col=i%3,row=Math.floor(i/3);
    const n=counts[z[0]]||0;
    const alpha=n?0.25+0.55*(n/max):(light?0.03:0.06);
    return `<rect x="${col*(w/3)}" y="${row*(h/3)}" width="${w/3}" height="${h/3}" fill="rgba(46,204,113,${alpha.toFixed(2)})" stroke="${stroke}" stroke-width="1"/>
      <text x="${col*(w/3)+w/6}" y="${row*(h/3)+h/6+4}" font-size="12" font-weight="700" text-anchor="middle" fill="${textFill}">${n||''}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:${w}px;display:block;border:2px solid ${borderCol};border-radius:2px">${cells}</svg>`;

// Mapas de eventos (Em Posse / Sem Bola) — pedido do Roger, 31/08/2026. Não é tracking
// posicional real (isso exigia GPS/vídeo, impossível com registo manual por toque) — é
// uma grelha de densidade dos eventos já registados, cada um com a coordenada exata de
// onde se tocou no campo. "Em posse" junta golo/remate/canto_of/livre_of/recuperação;
// "sem bola" junta golo sofrido/remate_adv/canto_def/livre_def/perda de bola. Reaproveita
// o mesmo padrão de grelha do mapa de zonas de golo acima, só que sobre o campo inteiro
// em vez da mini-baliza 3×3.
const _GD_HEATMAP_POSSE=['golo','remate','canto_of','livre_of','recuperacao_bola'];
const _GD_HEATMAP_SEMBOLA=['golo_sofrido','remate_adv','canto_def','livre_def','perda_bola'];
function _gdHeatGrid(events,types,cols,rows){
  const grid=Array.from({length:rows},()=>Array(cols).fill(0));
  (events||[]).forEach(e=>{
    if(e.x==null||!types.includes(e.type))return;
    const c=Math.max(0,Math.min(cols-1,Math.floor(e.x/100*cols)));
    const r=Math.max(0,Math.min(rows-1,Math.floor(e.y/100*rows)));
    grid[r][c]++;
  });
  return grid;
}
function _gdHeatSvg(grid,w){
  const rows=grid.length,cols=grid[0].length;
  const h=w*1.4;
  const max=Math.max(1,...grid.map(row=>Math.max(...row)));
  const cw=w/cols,ch=h/rows;
  const cells=grid.map((row,r)=>row.map((n,c)=>{
    const alpha=n?0.12+0.68*(n/max):0.02;
    return `<rect x="${(c*cw).toFixed(1)}" y="${(r*ch).toFixed(1)}" width="${cw.toFixed(1)}" height="${ch.toFixed(1)}" fill="rgba(220,60,50,${alpha.toFixed(2)})" stroke="rgba(255,255,255,.15)" stroke-width="0.5"/>`;
  }).join('')).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:150px;display:block;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:#0f3d24">${cells}<line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="rgba(255,255,255,.3)" stroke-width="1"/></svg>`;
}
function _gdHeatmapsHtml(events){
  const hasData=(events||[]).some(e=>e.x!=null&&(_GD_HEATMAP_POSSE.includes(e.type)||_GD_HEATMAP_SEMBOLA.includes(e.type)));
  if(!hasData)return '';
  const heatPosse=_gdHeatGrid(events,_GD_HEATMAP_POSSE,6,8);
  const heatSem=_gdHeatGrid(events,_GD_HEATMAP_SEMBOLA,6,8);
  return `<div style="margin-top:14px">
    <div style="font-size:11px;font-weight:700;color:var(--t2);margin-bottom:6px;letter-spacing:.5px">MAPAS DE EVENTOS</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;background:var(--bg2);border:1px solid var(--brd);border-radius:8px;padding:10px">
      <div style="text-align:center"><div style="font-size:10px;color:var(--t2);margin-bottom:4px">Em Posse</div>${_gdHeatSvg(heatPosse,140)}</div>
      <div style="text-align:center"><div style="font-size:10px;color:var(--t2);margin-bottom:4px">Sem Bola</div>${_gdHeatSvg(heatSem,140)}</div>
    </div>
    <div style="font-size:9px;color:var(--t3);margin-top:4px">Densidade dos eventos registados nas coordenadas do toque — não é tracking posicional em tempo real.</div>
  </div>`;
}
// Variante da contagem agregada para dentro dos PDFs (_printWin usa página branca,

// Análise automática do jogo (sps-v77) — resumo gerado por regras a partir dos dados
// já registados neste jogo (resultado, contagens do SPS-Gameday, mapa de zonas de golo,
// notas dos quadros táticos próprios e do Adversário) — pedido do Roger, 26/08/2026, para
// o Relatório Completo abrir já com uma leitura rápida do jogo. Não interpreta nem infere
// causalidade entre eventos (ex.: nunca liga um golo sofrido a uma bola parada anterior) —
// só descreve, em frases, o que já está guardado. Deliberadamente scoped a UM jogo (não é
// análise de tendências da época, que fica deferida por falta de amostra real ainda).
function _gdAutoAnalysisHtml(g){
  const club=APP.config.clubName||'A equipa';
  const tlEvs=(g.fpfTimeline||[]).filter(e=>e.type!=='inicio'&&e.type!=='fim');
  const hasResult=g.g1!=null&&g.g2!=null;
  const counts=_gdCountByType(tlEvs);
  const countsTotal=_GD_COUNTABLE.reduce((s,t)=>s+counts[t[0]],0);
  const oppSnaps=(g.oppTactical&&g.oppTactical.snapshots)||[];
  const ownSnaps=g.tacticoSnapshots||[];
  const oppSPCount=['cornerOf','cornerDef','freeKick'].reduce((s,k)=>s+((g.oppSPBoards&&g.oppSPBoards[k]&&g.oppSPBoards[k].snapshots)?g.oppSPBoards[k].snapshots.length:0),0);
  if(!hasResult&&!countsTotal&&!oppSnaps.length&&!ownSnaps.length&&!oppSPCount)return '';

  const paras=[];

  // 1) Resultado + golos + zona dominante
  if(hasResult){
    const outcome=g.g1>g.g2?'venceu':g.g1===g.g2?'empatou':'perdeu';
    let s=`${escHtml(club)} ${outcome} por ${g.g1}-${g.g2} ${g.g1===g.g2?'com':'contra'} ${escHtml(g.opp||'o adversário')}.`;
    // Nota: g.fpfTimeline guarda goalZoneLbl (etiqueta já traduzida por _gdBuildTimeline),
    // não o código goalZone — por isso a contagem aqui é por etiqueta, não via _gdZoneCounts
    // (que espera o código e serve o mapa 3×3, não este resumo em texto).
    const zoneLbls=tlEvs.filter(e=>e.type==='golo'&&e.goalZoneLbl).map(e=>e.goalZoneLbl);
    if(zoneLbls.length){
      const freq={};zoneLbls.forEach(l=>{freq[l]=(freq[l]||0)+1;});
      const top=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
      const zTotal=zoneLbls.length;
      s+=` ${zTotal>1?'Os golos entraram sobretudo':'O golo entrou'} pela zona ${top[0]}${zTotal>1?` (${top[1]} de ${zTotal} com zona registada)`:''}.`;
    }
    if(counts.golo_sofrido>0)s+=` A equipa sofreu ${counts.golo_sofrido} golo${counts.golo_sofrido!==1?'s':''}.`;
    paras.push(s);
  }

  // 2) Contagens do SPS-Gameday (remates/cantos/livres)
  if(countsTotal){
    const parts=_GD_COUNTABLE.filter(([k])=>k!=='golo_sofrido'&&counts[k]>0).map(([k,icon,lbl])=>`${counts[k]} ${lbl.toLowerCase()}`);
    if(parts.length)paras.push(`Foram registados ${parts.join(', ')}.`);
  }

  // 3) Alterações táticas observadas — só as notas escritas nos quadros, por ordem cronológica
  const noteLine=snaps=>snaps.filter(s=>s.note).map(s=>`${s.minRaw?s.minRaw+' — ':''}${escHtml(s.note)}`).join('; ');
  const oppNotes=noteLine(oppSnaps);
  if(oppNotes)paras.push(`Esquema tático do adversário (registos ao longo do jogo): ${oppNotes}.`);
  const ownNotes=noteLine(ownSnaps);
  if(ownNotes)paras.push(`Ajustes próprios registados no quadro tático: ${ownNotes}.`);

  // 4) Bolas paradas do adversário observadas (contagem de registos, sem detalhe)
  if(oppSPCount)paras.push(`Foram registadas ${oppSPCount} rotina${oppSPCount!==1?'s':''} de bolas paradas do adversário nos quadros de observação.`);

  if(!paras.length)return '';
  return `<div style="margin-bottom:18px">
    <h2 style="border-bottom:2px solid #1d6f3b;padding-bottom:8px;color:#1d6f3b">Análise Automática do Jogo</h2>
    ${paras.map(p=>`<p style="font-size:10pt;line-height:1.5;margin:0 0 8px">${p}</p>`).join('')}
    <p style="font-size:8pt;color:#666;font-style:italic;margin:0">Resumo gerado a partir dos dados registados neste jogo (contagens, zonas de golo, notas dos quadros táticos). Não substitui a análise do treinador.</p>
  </div>`;
}
function _gdInit(g){
  if(!g.liveSession)g.liveSession={
    phase:'pre',runningSince:null,accumSec:0,regEndSec:null,etEndSec:null,
    events:[],onPitch:[...g.lineup],bench:[...g.subs],score:{casa:0,fora:0},
    penEvents:[],launched:false,pauseReason:null
  };
  return g.liveSession;
}
// Reiniciar Jogo — pedido do Roger, 31/08/2026: se algo correr mal a meio (ex.: cronómetro
// arrancado por engano), dá para voltar à estaca zero sem ter de sair e reentrar no jogo.
// Só disponível enquanto ainda é rascunho — depois de "Lançar" desaparece de propósito,
// para nunca haver risco de apagar dados que já passaram para os campos oficiais do jogo.
function _gdResetGame(gid){
  const g=APP.games.find(x=>x.id===gid);if(!g||!g.liveSession)return;
  if(g.liveSession.launched)return toast('Já foi lançado — não é possível reiniciar','err');
  if(!confirm('Reiniciar o jogo? Todo o registo ao vivo (eventos, cronómetro, substituições) será apagado. Esta ação não pode ser desfeita.'))return;
  delete g.liveSession;
  clearInterval(_gdClockInterval);_gdClockInterval=null;
  _gdSubMode=false;_gdSubBenchSel=null;_gdPauseMenuOpen=false;
  saveData();toast('Jogo reiniciado');
  _renderJogoDetailFull();
}
// Exportar backup do jogo — pedido do Roger, 31/08/2026, depois do incidente de
// perda de dados do jogo vs Aldeia Nova (30/08): rede de segurança independente
// da sincronização com a cloud. Descarrega um ficheiro .json com a sessão ao vivo
// para o próprio aparelho — funciona sem internet nenhuma, porque não faz nenhum
// pedido de rede, só grava um Blob local. Pode ser copiado manualmente para a
// Drive do projeto se o Roger quiser guardar como cópia extra. Ver
// _gdIsLiveUnlaunched / feedback_sps_gameday_pullcloud_overwrite.
function _gdExportBackup(gid){
  const g=APP.games.find(x=>x.id===gid);if(!g||!g.liveSession)return toast('Sem sessão ao vivo para exportar','err');
  const payload={
    exportedAt:new Date().toISOString(),
    gameId:g.id,opponent:g.opp,date:g.date,time:g.time,
    liveSession:g.liveSession
  };
  const blob=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`sps_gameday_backup_${(g.opp||'jogo').replace(/[^a-z0-9]+/gi,'_')}_${g.date||''}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('Backup do jogo descarregado ✓');
}
function _gdRunning(ls){return !!ls.runningSince;}
function _gdElapsedSec(ls){return ls.accumSec+(ls.runningSince?(Date.now()-ls.runningSince)/1000:0);}
function _gdFmtClock(sec){sec=Math.max(0,Math.round(sec));const m=Math.floor(sec/60),s=sec%60;return `${m}:${String(s).padStart(2,'0')}`;}
function _gdMinLabel(sec){return Math.floor(Math.max(0,sec)/60)+"'";}

function _gdRecompute(g){
  const ls=g.liveSession;
  let onPitch=[...g.lineup],bench=[...g.subs],casa=0,fora=0;
  [...ls.events].sort((a,b)=>a.sec-b.sec).forEach(e=>{
    if(e.type==='golo')casa++;
    else if(e.type==='golo_sofrido')fora++;
    else if(e.type==='substituicao'&&e.playerOut&&e.playerIn){
      onPitch=onPitch.filter(x=>x!==e.playerOut);
      if(!onPitch.includes(e.playerIn))onPitch.push(e.playerIn);
      bench=bench.filter(x=>x!==e.playerIn);
    }
  });
  ls.onPitch=onPitch;ls.bench=bench;ls.score={casa,fora};
}

// --- Controlo do cronómetro (corre sozinho, nunca escreve a hora à mão) ---
function _gdStartGame(gid){
  const g=APP.games.find(x=>x.id===gid);if(!g)return;
  const ls=_gdInit(g);
  ls.phase='1';ls.runningSince=Date.now();ls.accumSec=0;
  saveData();toast('Jogo iniciado — 1ª Parte ⏱️');_renderJogoDetailFull();
}
function _gdPause(gid,nextPhase){
  const g=APP.games.find(x=>x.id===gid);if(!g||!g.liveSession)return;
  const ls=g.liveSession;
  if(ls.runningSince){ls.accumSec=_gdElapsedSec(ls);ls.runningSince=null;}
  ls.phase=nextPhase;
  saveData();_renderJogoDetailFull();
}
function _gdResume(gid,phase,resetSec){
  const g=APP.games.find(x=>x.id===gid);if(!g||!g.liveSession)return;
  const ls=g.liveSession;
  if(resetSec!=null)ls.accumSec=resetSec;
  ls.phase=phase;ls.runningSince=Date.now();
  saveData();toast((_GD_PHASE_LBL[phase]||phase)+' iniciada ⏱️');_renderJogoDetailFull();
}
// Pausa genérica — pedido do Roger, 31/08/2026: às vezes é preciso parar o relógio a
// meio de uma parte (hidratação, lesão, VAR) sem "avançar de fase" como o intervalo faz.
// Mesmo mecanismo do _gdPause (para o relógio), mas mantém a fase e fica registada com
// motivo na cronologia — o botão "Retomar" volta exatamente onde parou.
const _GD_PAUSE_REASONS=[['hidratacao','Hidratação'],['lesao','Lesão'],['var','Consulta VAR'],['medica','Intervenção Médica'],['outro','Outro']];
const _GD_PAUSE_REASON_LBL={};_GD_PAUSE_REASONS.forEach(([k,l])=>{_GD_PAUSE_REASON_LBL[k]=l;});
let _gdPauseMenuOpen=false;
function _gdOpenPauseMenu(){_gdPauseMenuOpen=true;_renderJogoDetailFull();}
function _gdCancelPauseMenu(){_gdPauseMenuOpen=false;_renderJogoDetailFull();}
function _gdPauseMenuHtml(g){

    <div style="font-size:10px;color:var(--t2);margin-bottom:6px">Motivo da pausa:</div>
    <div style="display:flex;flex-direction:column;gap:4px">
      ${_GD_PAUSE_REASONS.map(([k,l])=>`<button class="btn btn-sm btn-gh" style="text-align:left" onclick="_gdPauseWithReason('${g.id}','${k}')">${l}</button>`).join('')}
    </div>

function _gdPauseWithReason(gid,reason){
  const g=APP.games.find(x=>x.id===gid);if(!g||!g.liveSession)return;

  ls.pauseReason=reason;
  ls.events.push({id:uid(),sec:ls.accumSec,min:_gdMinLabel(ls.accumSec),phase:ls.phase,type:'pausa',reason});

}
function _gdResumeFromPause(gid){

function _gdEndReg(gid){

function _gdEndET(gid){

function _gdPitchTap(e,gid){

  if(simple.includes(type)){_gdCommitEvent(gid,type,{});return;}

function _gdPickGoalZone(zone){_gdGoalZone=(_gdGoalZone===zone)?null:zone;_renderJogoDetailFull();}
// Partilhado entre a substituição via popup do campo (_gdCommitEvent) e a substituição
// toque-toque pelo banco (_gdSelectOnPitch) — a posição/tarefa da jogadora que sai passa
// para quem entra em todos os quadros (tático + 3 de bolas paradas), para nunca ficar um
// quadro tático a mostrar uma jogadora que já saiu do jogo.
function _gdApplySubPositionRemap(g,playerOut,playerIn){
  ['tatico','cornerDef','cornerOf','freeKick'].forEach(mode=>{
    const posMap=_pitchPos(g,mode),taskMap=_pitchTasks(g,mode);
    if(posMap[playerOut]){posMap[playerIn]=posMap[playerOut];delete posMap[playerOut];}
    if(taskMap[playerOut]!==undefined){taskMap[playerIn]=taskMap[playerOut];delete taskMap[playerOut];}
  });
}
// Substituição toque-toque — pedido do Roger, 31/08/2026: em vez do formulário com dois
// menus dentro do popup do campo, o banco fica visível junto ao campo (chips com número),
// toca-se na suplente que entra e depois em quem sai. Ficou toque-toque (não arrastar) por
// ser mais fiável em ecrãs táteis pequenos — o mesmo padrão usado pela Pitch Planner.
// Funciona também com o jogo parado (ex.: substituições ao intervalo), só não em 'pre'/'fim'.
function _gdToggleSubMode(){_gdSubMode=!_gdSubMode;_gdSubBenchSel=null;_renderJogoDetailFull();}
function _gdSelectBench(aid){
  if(!_gdSubMode)return;
  _gdSubBenchSel=(_gdSubBenchSel===aid)?null:aid;

function _gdSelectOnPitch(gid,aidOut){
  if(!_gdSubMode||!_gdSubBenchSel)return;
  const g=APP.games.find(x=>x.id===gid);if(!g||!g.liveSession)return;
  const ls=g.liveSession;
  const sec=_gdElapsedSec(ls);
  const ev={id:uid(),sec,min:_gdMinLabel(sec),phase:ls.phase,type:'substituicao',playerOut:aidOut,playerIn:_gdSubBenchSel};
  ls.events.push(ev);
  _gdApplySubPositionRemap(g,aidOut,_gdSubBenchSel);

  _gdSubBenchSel=null;_gdSubMode=false;

function _gdCommitEvent(gid,type,extra){
  const g=APP.games.find(x=>x.id===gid);if(!g||!g.liveSession||!_gdMenuXY)return;
  const ls=g.liveSession;
  const sec=_gdMenuXY.sec;
  const side=_gdMenuXY.x<50?'esq':'dir';
  const ev={id:uid(),sec,min:_gdMinLabel(sec),phase:ls.phase,type,x:_gdMenuXY.x,y:_gdMenuXY.y,side};
  Object.keys(extra||{}).forEach(k=>{ev[k]=extra[k];});
  ls.events.push(ev);
  if(type==='substituicao'&&extra.playerOut&&extra.playerIn){
    _gdApplySubPositionRemap(g,extra.playerOut,extra.playerIn);
  }
  _gdRecompute(g);
  saveData();
  _gdMenuXY=null;_gdPendingType=null;
  const lbl=_GD_TYPE_LBL[type]||type;
  toast(type==='golo'||type==='golo_sofrido'?`${lbl} — ${ls.score.casa}-${ls.score.fora} ✓`:`${lbl} registado ✓`);
  _renderJogoDetailFull();
}

// --- Lançar: só aqui os dados saem do rascunho e entram nos campos oficiais ---
function _gdEndMinute(ls){
  const sec=ls.etEndSec!=null?ls.etEndSec:(ls.regEndSec!=null?ls.regEndSec:_gdElapsedSec(ls));
  return Math.max(1,Math.round(sec/60));
}
function _gdBuildPlayerStats(g){
  const ls=g.liveSession;
  const endMin=_gdEndMinute(ls);
  const allIds=[];[...g.lineup,...g.subs].forEach(id=>{if(allIds.indexOf(id)<0)allIds.push(id);});
  const statMap={};
  const getStat=aid=>{if(!statMap[aid])statMap[aid]={aid,mins:0,goals:0,assists:0,yellow:0,red:0,subIn:null,subOut:null};return statMap[aid];};
  const onSince={};
  g.lineup.forEach(aid=>{onSince[aid]=0;});
  const sorted=[...ls.events].sort((a,b)=>a.sec-b.sec);
  sorted.forEach(e=>{
    const evMin=Math.round(e.sec/60);
    if(e.type==='golo'&&e.scorer)getStat(e.scorer).goals+=1;
    if(e.type==='golo'&&e.assist)getStat(e.assist).assists+=1;
    if(e.type==='amarelo'&&e.player)getStat(e.player).yellow+=1;
    if(e.type==='vermelho'&&e.player)getStat(e.player).red+=1;
    if(e.type==='substituicao'&&e.playerOut&&e.playerIn){
      if(onSince[e.playerOut]!=null){getStat(e.playerOut).mins+=Math.max(0,evMin-onSince[e.playerOut]);delete onSince[e.playerOut];}
      getStat(e.playerOut).subOut=evMin;
      onSince[e.playerIn]=evMin;
      getStat(e.playerIn).subIn=evMin;
    }
  });
  allIds.forEach(aid=>{if(onSince[aid]!=null)getStat(aid).mins+=Math.max(0,endMin-onSince[aid]);});
  return statMap;
}
function _gdBuildTimeline(g){
  const nameOf=aid=>{const a=APP.athletes.find(x=>x.id===aid);return a?a.name:'';};
  const oppLbl=e=>e.oppNum?('Adversário nº'+e.oppNum):'Adversário';
  let running={casa:0,fora:0};
  const sorted=[...g.liveSession.events].sort((a,b)=>a.sec-b.sec);
  const tl=sorted.map(e=>{
    if(e.type==='golo')running.casa++;
    else if(e.type==='golo_sofrido')running.fora++;
    let playerLbl;
    if(e.type==='golo')playerLbl=nameOf(e.scorer);
    else if(e.type==='golo_sofrido')playerLbl=(g.opp||'Adversário');
    else if(e.type==='remate_adv')playerLbl=e.oppNum?oppLbl(e):'Adversário';
    else if((e.type==='amarelo'||e.type==='vermelho')&&e.team==='adv')playerLbl=oppLbl(e);
    else if(e.type==='amarelo'||e.type==='vermelho')playerLbl=nameOf(e.player);
    else if(_GD_ATTRIBUTABLE.includes(e.type))playerLbl=[nameOf(e.player),e.oppNum?('Advers. nº'+e.oppNum):''].filter(Boolean).join(' · ');
    else playerLbl=undefined;
    return {
      minRaw:e.min,type:e.type,
      player:playerLbl,
      assistName:e.type==='golo'&&e.assist?nameOf(e.assist):undefined,
      goalZone:e.type==='golo'&&e.goalZone?e.goalZone:undefined,
      goalZoneLbl:e.type==='golo'&&e.goalZone?_GD_GOAL_ZONE_LBL[e.goalZone]:undefined,
      playerIn:e.type==='substituicao'?nameOf(e.playerIn):undefined,
      playerOut:e.type==='substituicao'?nameOf(e.playerOut):undefined,
      side:e.side,
      scoreAfter:(e.type==='golo'||e.type==='golo_sofrido')?`${running.casa}-${running.fora}`:undefined
    };
  });
  const ls=g.liveSession;
  if(ls.penEvents&&ls.penEvents.length){
    const ps=_gdPenScore(ls);
    tl.push({minRaw:'Pen.',type:'penaltis',player:`${ps.casa}-${ps.fora}`});
  }
  return tl;
}
function _gdLaunch(gid){
  const g=APP.games.find(x=>x.id===gid);if(!g||!g.liveSession)return;
  const ls=g.liveSession;
  const msg=ls.launched?'Este jogo já foi lançado antes. Lançar outra vez substitui as estatísticas/linha do tempo atuais pelos dados desta sessão. Confirmas?':'Terminar o jogo e lançar os dados para a plataforma (Estatísticas, Linha do Tempo, Resultado)? Esta ação atualiza o Pós-Jogo.';
  if(!confirm(msg))return;
  const statMap=_gdBuildPlayerStats(g);
  if(!g.playerStats)g.playerStats=[];
  Object.values(statMap).forEach(st=>{
    const i=g.playerStats.findIndex(x=>x.aid===st.aid);
    if(i>=0)g.playerStats[i]={...g.playerStats[i],...st};else g.playerStats.push(st);
  });
  g.fpfTimeline=_gdBuildTimeline(g);
  g.g1=ls.score.casa;g.g2=ls.score.fora;
  if(ls.penEvents&&ls.penEvents.length){
    const ps=_gdPenScore(ls);
    const penNote=`Decidido nas grandes penalidades: ${ps.casa}-${ps.fora}.`;
    g.postGameNotes=g.postGameNotes?g.postGameNotes+'\n'+penNote:penNote;
  }
  g.status='realizado';
  ls.phase='fim';ls.launched=true;
  if(ls.runningSince){ls.accumSec=_gdElapsedSec(ls);ls.runningSince=null;}
  saveData();
  toast('Jogo lançado na plataforma ✓');
  _jogoDetailTab='posjogo';
  _renderJogoDetailFull();
}

    if(_gdRunning(g.liveSession))el.textContent=(_gdRunning(g.liveSession)?'▶ ':'⏸ ')+_gdFmtClock(_gdElapsedSec(g.liveSession));

}

      <label class="fl" style="font-size:10px">Marcadora</label>
      <select class="fc" id="gd-scorer" style="margin-bottom:6px;width:100%">${opts(onPitchAts)}</select>
      <label class="fl" style="font-size:10px">Assistência (opcional)</label>
      <select class="fc" id="gd-assist" style="margin-bottom:8px;width:100%"><option value="">—</option>${opts(onPitchAts)}</select>
      ${goalDiagram}
      <div style="display:flex;gap:6px">
        <button class="btn btn-g btn-sm" style="flex:1" onclick="_gdSubmitGolo('${gid}')">✓ Confirmar</button>
        <button class="btn btn-gh btn-sm" onclick="_gdCancelMenu()">Cancelar</button>
      </div>`;
  }
  if(type==='substituicao'){
    return `<div style="font-size:11px;color:var(--c1l);font-weight:800;margin-bottom:6px">🔄 Substituição</div>
      <label class="fl" style="font-size:10px">Sai</label>
      <select class="fc" id="gd-out" style="margin-bottom:6px;width:100%">${opts(onPitchAts)}</select>
      <label class="fl" style="font-size:10px">Entra</label>
      <select class="fc" id="gd-in" style="margin-bottom:8px;width:100%">${benchAts.length?opts(benchAts):'<option value="">Sem suplentes</option>'}</select>
      <div style="display:flex;gap:6px">
        <button class="btn btn-g btn-sm" style="flex:1" onclick="_gdSubmitSub('${gid}')">✓ Confirmar</button>
        <button class="btn btn-gh btn-sm" onclick="_gdCancelMenu()">Cancelar</button>
      </div>`;
  }
  if(type==='amarelo'||type==='vermelho'){
    const oppOpts=_oppRosterFor(g).map(r=>`<option value="${r.num}">${r.num} ${escHtml(r.pos)}</option>`).join('');
    return `<div style="font-size:11px;color:var(--c1l);font-weight:800;margin-bottom:6px">${type==='amarelo'?'🟨 Amarelo':'🟥 Vermelho'}</div>
      <div style="display:flex;gap:4px;margin-bottom:8px">
        <button class="btn btn-xs ${_gdCardTeam==='nos'?'btn-g':'btn-gh'}" style="flex:1" onclick="_gdSetCardTeam('nos')">Nós</button>
        <button class="btn btn-xs ${_gdCardTeam==='adv'?'btn-g':'btn-gh'}" style="flex:1" onclick="_gdSetCardTeam('adv')">Adversário</button>
      </div>
      ${_gdCardTeam==='adv'?`
      <label class="fl" style="font-size:10px">Nº do adversário (opcional)</label>
      <select class="fc" id="gd-card-oppnum" style="margin-bottom:8px;width:100%"><option value="">— sem identificar —</option>${oppOpts}</select>`:`
      <label class="fl" style="font-size:10px">Jogadora</label>
      <select class="fc" id="gd-card-player" style="margin-bottom:8px;width:100%">${opts(onPitchAts)}</select>`}
      <div style="display:flex;gap:6px">
        <button class="btn btn-g btn-sm" style="flex:1" onclick="_gdSubmitCard('${gid}','${type}')">✓ Confirmar</button>
        <button class="btn btn-gh btn-sm" onclick="_gdCancelMenu()">Cancelar</button>
      </div>`;
  }
  return '';
}
function _jogoAoVivoHtml(g){
  const ls=_gdInit(g);
  const running=_gdRunning(ls);
  const elapsed=_gdElapsedSec(ls);
  const onPitchAts=ls.onPitch.map(aid=>APP.athletes.find(a=>a.id===aid)).filter(Boolean);
  const benchAts=ls.bench.map(aid=>APP.athletes.find(a=>a.id===aid)).filter(Boolean);
  const teamName=(APP.teams.find(t=>t.id===g.teamId)||{}).name||'Nós';

  const canReset=ls.phase!=='pre'&&!ls.launched;
  const header=`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px;flex-wrap:wrap;gap:8px">
    <div>
      <div style="font-size:11px;color:var(--t2)">SPS-GAMEDAY${canReset?` <span onclick="_gdResetGame('${g.id}')" style="color:var(--t3);cursor:pointer;text-decoration:underline">↺ Reiniciar</span>`:''}${ls.phase!=='pre'?` <span onclick="_gdExportBackup('${g.id}')" style="color:var(--t3);cursor:pointer;text-decoration:underline">⬇ Backup</span>`:''}</div>
      <div style="font-size:16px;font-weight:900">${escHtml(teamName)} <span style="color:var(--c1l)">${ls.score.casa}</span> – <span style="color:var(--t2)">${ls.score.fora}</span> ${escHtml(g.opp)}</div>
    </div>
    <div style="text-align:right">
      <div id="gd-clock-txt" style="font-size:24px;font-weight:900;color:${running?'var(--c1l)':'var(--t2)'};font-variant-numeric:tabular-nums">${running?'▶ ':'⏸ '}${_gdFmtClock(elapsed)}</div>
      <div style="font-size:10px;color:var(--t2)">${_GD_PHASE_LBL[ls.phase]||ls.phase}</div>
    </div>
  </div>`;

  // Fases "ao vivo" — cronómetro corre e pode ser pausado genericamente (motivo), sem
  // avançar de fase. ls.pauseReason marca que está parada por esse motivo (distinto das
  // paragens normais entre fases, que já têm os seus próprios ecrãs).
  const livePhases=['1','2','ET1','ET2'];
  let controls='';
  if(ls.phase==='pre'){
    controls=`<button class="btn btn-g" style="width:100%;padding:14px;font-size:14px" onclick="_gdStartGame('${g.id}')">▶️ Iniciar Jogo</button>`;
  }else if(livePhases.includes(ls.phase)&&ls.pauseReason){
    controls=`<div style="text-align:center">
      <div style="font-size:11px;color:var(--t2);margin-bottom:6px">⏸ Pausa — ${escHtml(_GD_PAUSE_REASON_LBL[ls.pauseReason]||ls.pauseReason)}</div>
      <button class="btn btn-g" style="width:100%;padding:12px" onclick="_gdResumeFromPause('${g.id}')">▶️ Retomar</button>
    </div>`;
  }else if(ls.phase==='1'){
    controls=`<div style="display:flex;gap:8px">
      <button class="btn btn-gh" style="flex:1;padding:12px" onclick="_gdOpenPauseMenu()">⏸ Pausa</button>
      <button class="btn btn-gh" style="flex:1;padding:12px" onclick="_gdPause('${g.id}','intervalo1')">⏹ Intervalo</button>
    </div>${_gdPauseMenuHtml(g)}`;
  }else if(ls.phase==='intervalo1'){
    controls=`<button class="btn btn-g" style="width:100%;padding:14px;font-size:14px" onclick="_gdResume('${g.id}','2',2700)">▶️ Iniciar 2ª Parte</button>`;
  }else if(ls.phase==='2'){
    controls=`<div style="display:flex;gap:8px">
      <button class="btn btn-gh" style="flex:1;padding:12px" onclick="_gdOpenPauseMenu()">⏸ Pausa</button>
      <button class="btn btn-gh" style="flex:1;padding:12px" onclick="_gdEndReg('${g.id}')">⏹ Terminar Tempo Regulamentar</button>
    </div>${_gdPauseMenuHtml(g)}`;
  }else if(ls.phase==='fimReg'){
    const tied=ls.score.casa===ls.score.fora;
    controls=`<div style="display:flex;gap:8px;flex-wrap:wrap">
      ${tied?`<button class="btn btn-gh" style="flex:1;padding:12px" onclick="_gdResume('${g.id}','ET1',5400)">⏱️ Iniciar Prolongamento</button>`:''}
      <button class="btn btn-g" style="flex:1;padding:12px" onclick="_gdLaunch('${g.id}')">🚀 Terminar e Lançar na Plataforma</button>
    </div>`;
  }else if(ls.phase==='ET1'){
    controls=`<div style="display:flex;gap:8px">
      <button class="btn btn-gh" style="flex:1;padding:12px" onclick="_gdOpenPauseMenu()">⏸ Pausa</button>
      <button class="btn btn-gh" style="flex:1;padding:12px" onclick="_gdPause('${g.id}','intervaloET')">⏹ Intervalo do Prolongamento</button>
    </div>${_gdPauseMenuHtml(g)}`;
  }else if(ls.phase==='intervaloET'){
    controls=`<button class="btn btn-g" style="width:100%;padding:14px;font-size:14px" onclick="_gdResume('${g.id}','ET2',6300)">▶️ Iniciar 2º Tempo do Prolongamento</button>`;
  }else if(ls.phase==='ET2'){
    controls=`<div style="display:flex;gap:8px">
      <button class="btn btn-gh" style="flex:1;padding:12px" onclick="_gdOpenPauseMenu()">⏸ Pausa</button>
      <button class="btn btn-gh" style="flex:1;padding:12px" onclick="_gdEndET('${g.id}')">⏹ Terminar Prolongamento</button>
    </div>${_gdPauseMenuHtml(g)}`;
  }else if(ls.phase==='penaltis'){
    controls=_gdPenaltisHtml(g);
  }else if(ls.phase==='fim'){
    controls=`<button class="btn btn-g" style="width:100%;padding:14px;font-size:14px" onclick="_gdLaunch('${g.id}')">🚀 ${ls.launched?'Relançar':'Lançar'} na Plataforma</button>`;
  }

  const canTap=running;
  // Ícones já não são hardcoded aqui — vêm de _GD_TYPES, fonte única (evita divergir do
  // que aparece no popup de escolha de ação).
  const markerIcon={};_GD_TYPES.forEach(([type,icon])=>{markerIcon[type]=icon;});
  // Marcadores ficam visíveis só ~10s depois do toque (pedido do Roger, 31/08/2026, para
  // o campo não ficar poluído de ícones ao longo do jogo) — os dados continuam todos
  // guardados (cronologia, contagens, heat maps), só a marca visual no campo desaparece.
  // Eventos "soltos" sem coordenada (ex.: pausa genérica) nunca tiveram marcador — filtram-se
  // aqui. O desaparecimento em si é feito pelo tick do relógio (_gdStartClockInterval),
  // que só mexe em display:none/'' de cada <text>, sem re-render completo a cada segundo.
  const markers=ls.events.filter(e=>e.x!=null).map(e=>{
    const cx=(e.x*3).toFixed(1),cy=(e.y*4.2).toFixed(1);
    // Com o campo rodado 180° (_gdPitchRotated), o texto do marcador ganha uma
    // contra-rotação própria em torno do seu ponto — fica sempre direito e
    // legível, mesmo que a posição em si acompanhe a rotação do campo todo.
    const rot=_gdPitchRotated?` transform="rotate(180 ${cx} ${cy})"`:'';
    const fresh=(elapsed-e.sec)<10;
    return `<text id="gd-mk-${e.id}" x="${cx}" y="${cy}" font-size="11" text-anchor="middle"${rot}${fresh?'':' style="display:none"'}>${markerIcon[e.type]||'•'}</text>`;
  }).join('');
  // Popups ancorados ao toque no campo: em telemóvel o campo tem só ~300px de largura,
  // por isso a âncora percentual antiga (left:X%) empurrava o popup para fora do ecrã
  // quando se tocava no lado direito — os botões ficavam por baixo do overflow-x:hidden
  // e impossíveis de tocar. Agora ancora à esquerda OU à direita consoante o toque, e a
  // largura do popup acompanha o ecrã (min(...,vw)) em vez de ser sempre fixa em px.
  const _gdAnchor=(xPct,capPct)=>xPct<=50?`left:${Math.min(xPct,capPct)}%`:`right:${Math.min(100-xPct,capPct)}%`;
  // Com o campo rodado 180° (_gdPitchRotated), a posição (left/top/right) já
  // fica correta sozinha — é calculada antes do transform ser aplicado — mas
  // o conteúdo em si (texto/botões) ficaria de pernas para o ar sem uma
  // contra-rotação própria no próprio popup, por isso soma-se aqui.
  const _gdCounterRot=_gdPitchRotated?';transform:rotate(180deg)':'';
  let popup='';
  if(_gdMenuXY&&!_gdPendingType){
    popup=`<div style="position:absolute;${_gdAnchor(_gdMenuXY.x,26)};top:${Math.min(_gdMenuXY.y,72)}%;background:var(--bg1);border:2px solid var(--c1l);border-radius:10px;padding:8px;width:min(170px,72vw);box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5${_gdCounterRot}">
      <div style="font-size:10px;color:var(--c1l);font-weight:800;margin-bottom:6px">📍 ${_gdMinLabel(_gdMenuXY.sec)}</div>
      <div style="display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto">
        ${_GD_TYPES.filter(([type])=>type!=='substituicao').map(([type,icon,label])=>`<button class="btn btn-sm btn-gh" style="justify-content:flex-start;text-align:left;padding:9px 10px" onclick="_gdPickType('${g.id}','${type}')">${icon} ${label}</button>`).join('')}
      </div>
      <button class="btn btn-sm btn-r" style="width:100%;margin-top:6px;padding:9px" onclick="_gdCancelMenu()">Cancelar</button>
    </div>`;
  }else if(_gdMenuXY&&_gdPendingType){
    popup=`<div style="position:absolute;${_gdAnchor(_gdMenuXY.x,20)};top:${Math.min(_gdMenuXY.y,65)}%;background:var(--bg1);border:2px solid var(--c1l);border-radius:10px;padding:10px;width:min(210px,82vw);box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5${_gdCounterRot}">
      ${_gdSubformHtml(g,_gdPendingType,onPitchAts,benchAts)}
    </div>`;
  }
  const pitchSvg=`<div class="gd-pitch-wrap${_gdPitchRotated?' rotated':''}" style="position:relative;margin:0 auto">
    <svg id="gd-pitch-${g.id}" viewBox="0 0 300 420" style="width:100%;display:block;border-radius:10px;touch-action:none;cursor:${canTap?'crosshair':'default'}" onclick="${canTap?`_gdPitchTap(event,'${g.id}')`:''}">
      <rect width="300" height="420" fill="#0f3d24" rx="8"/>
      <rect x="6" y="6" width="288" height="408" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.5"/>
      <line x1="6" y1="210" x2="294" y2="210" stroke="rgba(255,255,255,.3)" stroke-width="1.2"/>
      <circle cx="150" cy="210" r="35" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.2"/>
      <rect x="70" y="6" width="160" height="55" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.2"/>
      <rect x="105" y="6" width="90" height="20" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.2"/>
      <rect x="70" y="359" width="160" height="55" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.2"/>
      <rect x="105" y="394" width="90" height="20" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.2"/>
      ${markers}
    </svg>
    ${popup}
    ${!canTap?`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(12,15,20,.55);border-radius:10px;font-size:12px;color:var(--t2);text-align:center;padding:10px${_gdCounterRot}">${ls.phase==='pre'?'Toca em "Iniciar Jogo" para começar a registar':ls.phase==='penaltis'||ls.phase==='fim'?'':'Relógio parado — retoma para continuar a registar'}</div>`:''}
  </div>
  <div class="gd-pitch-rot-row"><button class="btn btn-xs btn-gh" onclick="_gdTogglePitchRotate()" title="Roda o campo 180° — ajusta a como seguras o ecrã, ou à troca de baliza ao intervalo">🔄 Rodar Campo</button></div>`;

  // Substituição toque-toque: banco visível junto ao campo, ativa-se pelo botão dedicado
  // (evita trocas por engano ao tocar nos avatares só para ver quem está onde).
  const subChipsHtml=(()=>{
    if(ls.phase==='pre'||ls.phase==='fim')return '';
    const chip=(a,isBench)=>{
      const sel=isBench&&_gdSubBenchSel===a.id;
      const onClick=isBench?`_gdSelectBench('${a.id}')`:`_gdSelectOnPitch('${g.id}','${a.id}')`;
      const active=_gdSubMode&&(isBench||_gdSubBenchSel);
      return `<div onclick="${active?onClick:''}" style="flex-shrink:0;text-align:center;cursor:${active?'pointer':'default'};opacity:${_gdSubMode?'1':'.55'}">
        <div style="width:34px;height:34px;border-radius:50%;background:${sel?'var(--c1l)':'var(--bg3)'};border:2px solid ${sel?'var(--c1l)':'var(--brd)'};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:${sel?'#fff':'var(--t1)'}">${a.number||'?'}</div>
        <div style="font-size:8px;color:var(--t2);max-width:38px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(_shortName(a))}</div>
      </div>`;
    };
    return `<div style="margin-top:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:6px">
        <span style="font-size:10px;color:var(--t2)">${_gdSubMode?(_gdSubBenchSel?'Toca em quem sai':'Toca na suplente que entra'):'Em campo / Banco'}</span>
        <button class="btn btn-xs ${_gdSubMode?'btn-g':'btn-gh'}" onclick="_gdToggleSubMode()">🔄 Substituição</button>
      </div>
      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px">${onPitchAts.map(a=>chip(a,false)).join('')}</div>
      ${benchAts.length?`<div style="display:flex;gap:8px;overflow-x:auto;margin-top:6px;padding-top:6px;border-top:1px dashed var(--brd)">${benchAts.map(a=>chip(a,true)).join('')}</div>`:'<div style="font-size:10px;color:var(--t2);margin-top:4px">Sem suplentes disponíveis.</div>'}
    </div>`;
  })();

  const oppLbl=e=>e.oppNum?`Adversário nº${e.oppNum}`:'Adversário';
  const evRows=[...ls.events].sort((a,b)=>b.sec-a.sec).map(e=>{
    const nm=aid=>{const a=APP.athletes.find(x=>x.id===aid);return a?_shortName(a):'?';};
    let detail='';
    if(e.type==='golo')detail=`${nm(e.scorer)}${e.assist?' (assist. '+nm(e.assist)+')':''}${e.goalZone?' — '+_GD_GOAL_ZONE_LBL[e.goalZone]:''}`;
    else if(e.type==='substituicao')detail=`Sai ${nm(e.playerOut)} → Entra ${nm(e.playerIn)}`;
    else if(e.type==='amarelo'||e.type==='vermelho')detail=e.team==='adv'?oppLbl(e):nm(e.player);
    else if(e.type==='remate')detail=e.player?nm(e.player):'';
    else if(e.type==='remate_adv')detail=e.oppNum?oppLbl(e):'';
    else if(e.type==='canto_of'||e.type==='canto_def'||e.type==='livre_of'||e.type==='livre_def')detail=(e.side==='esq'?'lado esquerdo':'lado direito')+(e.player?' — '+nm(e.player):'')+(e.oppNum?' · '+oppLbl(e):'');
    else if(e.type==='perda_bola'||e.type==='recuperacao_bola')detail=(e.side==='esq'?'lado esquerdo':'lado direito')+(e.player?' — '+nm(e.player):'');
    else if(e.type==='pausa')detail=_GD_PAUSE_REASON_LBL[e.reason]||e.reason||'';
    const assignable=_GD_ATTRIBUTABLE.includes(e.type);
    const oppAssignable=_GD_OPP_ATTRIBUTABLE.includes(e.type);
    const isAssigning=_gdAssignEventId===e.id;
    const isOppAssigning=_gdOppAssignEventId===e.id;
    let inlineSpan='',pickerBlock='';
    if(assignable){
      if(isAssigning){
        pickerBlock+=`<div style="display:flex;gap:4px;padding:0 10px 8px">
          <select id="gd-assign-sel-${e.id}" class="fc" style="flex:1;font-size:11px;padding:3px 6px">
            <option value="">— sem jogadora —</option>
            ${onPitchAts.map(a=>`<option value="${a.id}" ${e.player===a.id?'selected':''}>${a.number||'?'} ${escHtml(_shortName(a))}</option>`).join('')}
          </select>
          <button class="btn btn-xs btn-g" onclick="_gdAssignPlayer('${g.id}','${e.id}',document.getElementById('gd-assign-sel-${e.id}').value)">✓</button>
          <button class="btn btn-xs btn-gh" onclick="_gdCancelAssign()">✕</button>
        </div>`;
      }else if(!e.player){
        inlineSpan+=` <span onclick="_gdOpenAssign('${e.id}')" style="font-size:10px;color:var(--c1l);cursor:pointer;text-decoration:underline">+ identificar jogadora</span>`;
      }
    }
    if(oppAssignable){
      if(isOppAssigning){
        pickerBlock+=`<div style="display:flex;gap:4px;padding:0 10px 8px">
          <select id="gd-oppassign-sel-${e.id}" class="fc" style="flex:1;font-size:11px;padding:3px 6px">
            <option value="">— sem nº —</option>
            ${_oppRosterFor(g).map(r=>`<option value="${r.num}" ${String(e.oppNum)===String(r.num)?'selected':''}>${r.num} ${escHtml(r.pos)}</option>`).join('')}
          </select>
          <button class="btn btn-xs btn-g" onclick="_gdAssignOppNum('${g.id}','${e.id}',document.getElementById('gd-oppassign-sel-${e.id}').value)">✓</button>
          <button class="btn btn-xs btn-gh" onclick="_gdCancelOppAssign()">✕</button>
        </div>`;
      }else if(!e.oppNum){
        inlineSpan+=` <span onclick="_gdOpenOppAssign('${e.id}')" style="font-size:10px;color:var(--c1l);cursor:pointer;text-decoration:underline">+ nº adversário</span>`;
      }
    }
    return `<div style="border-bottom:1px solid var(--brd)">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;font-size:12px">
        <span>${e.min} ${_GD_TYPE_LBL[e.type]||e.type}${detail?' — '+escHtml(detail):''}${inlineSpan}</span>
        <button class="btn btn-xs btn-gh" onclick="_gdUndoEvent('${g.id}','${e.id}')" title="Desfazer">↩️</button>
      </div>
      ${pickerBlock}
    </div>`;
  }).join('')||`<p style="padding:10px;font-size:12px;color:var(--t2)">Ainda sem eventos registados.</p>`;

  const countsHtml=_gdCountsSummaryHtml(ls.events);
  const oppRosterLink=`<div style="margin-top:8px;text-align:right"><span onclick="_gdToggleOppRosterEditor()" style="font-size:10px;color:var(--c1l);cursor:pointer;text-decoration:underline">✏️ Plantel do adversário (nºs)</span></div>${_gdOppRosterOpen?_gdOppRosterHtml(g):''}`;

  return `<div class="ipanel" style="background:var(--bg0)">
    <div class="gd-live-wrap">
      <div class="gd-pitch-col">
        ${header}
        ${pitchSvg}
        ${subChipsHtml}
      </div>
      <div class="gd-info-col">
        <div style="margin-top:12px">${controls}</div>
        ${countsHtml?`<div style="margin-top:14px">${countsHtml}</div>`:''}
        ${oppRosterLink}
        <div style="margin-top:14px">
          <div style="font-size:11px;font-weight:700;color:var(--t2);margin-bottom:6px;letter-spacing:.5px">CRONOLOGIA</div>
          <div style="background:var(--bg2);border:1px solid var(--brd);border-radius:8px;max-height:260px;overflow-y:auto">${evRows}</div>
        </div>
        ${_gdHeatmapsHtml(ls.events)}
        <div style="font-size:10px;color:var(--t3);margin-top:10px">💾 Grava sozinho a cada toque — funciona sem internet no campo.</div>
      </div>
    </div>
  </div>`;
}

function _normName(s){return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\(gr\)/gi,'').replace(/[^a-z ]/g,'').trim().replace(/\s+/g,' ');}

function _fpfParseHtml(raw){
  const doc=new DOMParser().parseFromString(raw,'text/html');
  const txt=doc.body?doc.body.textContent:raw;
  let home={name:'',logo:''},away={name:'',logo:''},scoreH=null,scoreA=null;
  const scoreStrong=[...doc.querySelectorAll('strong')].find(e=>/^\d+\s*-\s*\d+$/.test(e.textContent.trim()));
  if(scoreStrong){
    const row=scoreStrong.closest('.row')||scoreStrong.parentElement;
    const strongs=[...row.querySelectorAll('strong')];
    const nums=scoreStrong.textContent.trim().split('-').map(s=>+s.trim());
    scoreH=nums[0];scoreA=nums[1];
    const nameEls=strongs.filter(s=>s!==scoreStrong);
    if(nameEls[0])home.name=nameEls[0].textContent.trim();
    if(nameEls[1])away.name=nameEls[1].textContent.trim();
    const imgs=row.querySelectorAll('img');
    if(imgs[0])home.logo=imgs[0].getAttribute('src')||'';
    if(imgs[1])away.logo=imgs[1].getAttribute('src')||'';
  }
  const dataMatch=txt.match(/Data:\s*([\d-]+)\s*Hora:\s*([\d:]+)\s*Est[aá]dio:\s*([^\n\r]+)/);
  const date=dataMatch?dataMatch[1]:'',time=dataMatch?dataMatch[2]:'',stadium=dataMatch?dataMatch[3].trim():'';
  function parsePlayers(panel){
    if(!panel)return{home:[],away:[]};
    const grab=side=>[...panel.querySelectorAll('.lineup-team.'+side+'-team .player')].map(p=>{
      const clone=p.cloneNode(true);
      const icons=clone.querySelector('.icons');if(icons)icons.remove();
      const strong=clone.querySelector('strong');
      const num=strong?strong.textContent.trim():'';
      let name=clone.textContent.trim();
      if(strong)name=name.replace(strong.textContent,'');
      const gk=/\(gr\)/i.test(name);
      name=name.replace(/\(gr\)/i,'').trim().replace(/\s+/g,' ');
      return {num,name,gk};
    });
    return {home:grab('home'),away:grab('away')};
  }
  const titleBars=[...doc.querySelectorAll('.title-bar')];
  const tbFind=t=>titleBars.find(e=>e.textContent.trim()===t);
  const startTb=tbFind('Equipas Iniciais'),subsTb=tbFind('Suplentes');
  const starters=parsePlayers(startTb?startTb.parentElement:null);
  const bench=parsePlayers(subsTb?subsTb.parentElement:null);
  const events=[...doc.querySelectorAll('.timeline-item')].map(it=>{
    const topTag=it.querySelector('.top-tag');
    const minRaw=topTag?topTag.textContent.trim():'';
    const mBase=parseInt((minRaw.match(/\d+/)||[0])[0],10)||0;
    const em=minRaw.match(/\+\s*(\d+)/);
    const mExtra=em?parseInt(em[1],10):0;
    const img=it.querySelector('img');
    const src=img?(img.getAttribute('src')||''):'';
    let type='evento';
    if(/start/i.test(src))type='inicio';
    else if(/end/i.test(src))type='fim';
    else if(/goal/i.test(src))type='golo';
    else if(/yellow/i.test(src))type='amarelo';
    else if(/red/i.test(src))type='vermelho';
    else if(/substitution/i.test(src))type='substituicao';
    const inSpan=it.querySelector('.in'),outSpan=it.querySelector('.out');
    let playerIn='',playerOut='',player='',scoreAfter='';
    if(inSpan||outSpan){
      playerIn=inSpan?inSpan.textContent.trim():'';
      playerOut=outSpan?outSpan.textContent.trim():'';
    }else{
      const bt=it.querySelector('.bottom-tag');
      const bot=bt?bt.textContent.trim().replace(/\s+/g,' '):'';
      const sm=bot.match(/^(\d+)\s*-\s*(\d+)\s*(.*)$/);
      if(sm){scoreAfter=sm[1]+'-'+sm[2];player=sm[3].trim();}
      else player=bot;
    }
    return {minRaw,minute:mBase+mExtra,type,player,playerIn,playerOut,scoreAfter};
  });
  return {home,away,scoreH,scoreA,date,time,stadium,starters,bench,events};
}

function _fpfGuessSide(g,parsed){
  const opp=_normName(g.opp);
  const hn=_normName(parsed.home.name),an=_normName(parsed.away.name);
  const hMatch=!!opp&&(hn.includes(opp)||opp.includes(hn));
  const aMatch=!!opp&&(an.includes(opp)||opp.includes(an));
  if(hMatch&&!aMatch)return 'away';
  if(aMatch&&!hMatch)return 'home';
  return g.ha==='fora'?'away':'home';
}

function _fpfMatchAthlete(fpfName){
  const n=_normName(fpfName);if(!n)return null;
  let best=null,bestScore=0;
  APP.athletes.forEach(a=>{
    const an=_normName(a.name);if(!an)return;
    let score=0;
    if(an===n)score=100;
    else{
      const at=an.split(' '),nt=n.split(' ');
      const common=at.filter(t=>t.length>2&&nt.includes(t)).length;
      score=common*10+((an.includes(n)||n.includes(an))?5:0);
    }
    if(score>bestScore){bestScore=score;best=a;}
  });
  return bestScore>=10?best:null;
}

let _fpfPreview=null;

function parseFpfPaste(gid){
  const g=APP.games.find(x=>x.id===gid);if(!g)return;
  const el=document.getElementById('fpf-html');
  const raw=el?el.value.trim():'';
  const msg=document.getElementById('fpf-msg');
  if(!raw){if(msg)msg.textContent='Cola primeiro o código-fonte da página.';return;}
  let parsed;
  try{parsed=_fpfParseHtml(raw);}catch(e){if(msg)msg.textContent='⚠️ Não consegui interpretar o conteúdo colado.';return;}
  if(!parsed.home.name&&!parsed.away.name){if(msg)msg.textContent='⚠️ Não encontrei dados de jogo neste conteúdo. Confirma que colaste o código-fonte da página correta (Ctrl+U).';return;}
  const ourSide=_fpfGuessSide(g,parsed);
  const ourList=[...(parsed.starters[ourSide]||[]).map(p=>({...p,st:true})),...(parsed.bench[ourSide]||[]).map(p=>({...p,st:false}))];
  const matches={};
  ourList.forEach(p=>{const m=_fpfMatchAthlete(p.name);matches[p.name]=m?m.id:'';});
  _fpfPreview={gid,parsed,ourSide,ourList,matches};
  if(msg)msg.textContent='✅ Interpretado. Confirma abaixo antes de aplicar.';
  _renderFpfPreview();
}

    <td><select class="fc fpf-match" data-fpfname="${escHtml(p.name)}" style="font-size:11px;padding:3px 6px">${athOpts(_fpfPreview.matches[p.name])}</select></td>

    </div>
    <div style="font-size:11px;color:var(--t2);margin-bottom:4px">📅 ${escHtml(parsed.date)} ${escHtml(parsed.time)} · ${escHtml(parsed.stadium)}</div>

    <button class="btn btn-g" style="margin-top:10px" onclick="applyFpfImport()">✅ Aplicar Importação</button>
